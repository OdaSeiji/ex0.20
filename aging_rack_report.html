<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Aging Rack Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }

    .lang-buttons { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .lang-buttons button {
      padding: 6px 12px; margin-left: 5px; border: 1px solid #0078d4;
      background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .lang-buttons button.active { background: #0078d4; color: #fff; }

    h1 { font-size: 22px; margin-bottom: 6px; border-left: 6px solid #0078d4; padding-left: 10px; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 18px; padding-left: 16px; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn { padding: 7px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-back { background: #546e7a; color: #fff; }
    .btn-csv  { background: #217346; color: #fff; }
    .btn-show { background: #0078d4; color: #fff; }

    .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-row label { font-size: 13px; color: #555; }
    .filter-row input[type=date] { padding: 5px 8px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px; }
    .preset-switch { display: flex; border: 1px solid #0078d4; border-radius: 5px; overflow: hidden; margin-left: 8px; }
    .preset-btn {
      padding: 6px 12px; border: none; background: #fff; color: #0078d4;
      font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .preset-btn + .preset-btn { border-left: 1px solid #0078d4; }
    .preset-btn.active { background: #0078d4; color: #fff; }

    .note { font-size: 12px; color: #777; margin: 6px 0 0 4px; line-height: 1.6; }

    .section-title {
      font-size: 15px; font-weight: bold; color: #2b6ca3;
      margin: 24px 0 8px; padding-left: 8px;
      border-left: 4px solid #0078d4;
    }

    /* グラフ */
    .chart-wrap {
      background: #fff; border-radius: 8px; padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    canvas { max-height: 360px; }

    /* テーブル */
    .table-wrap {
      background: #fff; border-radius: 8px; overflow: auto; max-height: 520px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: inline-block; min-width: 420px;
    }
    table { border-collapse: collapse; font-size: 13px; width: 100%; }
    th, td { padding: 7px 14px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; text-align: right; }
    th { background: #e8f1ff; text-align: center; font-size: 11px; position: sticky; top: 0; z-index: 1; }
    td.date-col { text-align: center; font-family: "Roboto Mono", monospace; background: #f5f5f5; font-weight: bold; }
    td.date-col.sun { color: #c62828; }
    td.date-col.sat { color: #1565c0; }
    td.mono { font-family: "Roboto Mono", monospace; }
    td.zero { color: #bbb; }
    td.diff-plus  { color: #c62828; }
    td.diff-minus { color: #2e7d32; }
    tr:hover td { background: #f0f8ff; }
    tr.sum-row td { background: #e3f2fd; font-weight: bold; color: #1565c0; }
    tr.avg-row td { background: #fff8e1; font-weight: bold; color: #8d6e00; }
  </style>
</head>
<body>
  <div class="lang-buttons">
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
    <button id="btnVi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>

  <h1 data-key="title">🗄️ 時効ラック 使用・解放実績</h1>
  <div class="subtitle" data-key="subtitle">日別の使用ラック数（押出日）と解放ラック数（最終梱包日）</div>

  <div class="toolbar">
    <button class="btn btn-back" onclick="location.href='index.html'" data-key="btn_back">← 戻る</button>
    <button class="btn btn-csv" onclick="exportCSV()" data-key="btn_csv">📥 CSV出力</button>
  </div>

  <div class="filter-row">
    <label data-key="label_period">期間：</label>
    <input type="date" id="fromDate" />
    <span>〜</span>
    <input type="date" id="toDate" />
    <button class="btn btn-show" onclick="clearPreset(); loadData()" data-key="btn_show">表示</button>
    <div class="preset-switch">
      <button class="preset-btn" data-days="7"   onclick="setPreset(7)"   data-key="preset_7">7日</button>
      <button class="preset-btn" data-days="30"  onclick="setPreset(30)"  data-key="preset_30">30日</button>
      <button class="preset-btn" data-days="90"  onclick="setPreset(90)"  data-key="preset_90">90日</button>
    </div>
  </div>

  <div class="chart-wrap">
    <canvas id="rackChart"></canvas>
    <div class="note" data-key="note">
      ※ 使用：押出日に登録された時効ラック数　／　解放：そのラックの最後の梱包日に計上。梱包日報が未入力のラックは解放に計上されません。
    </div>
  </div>

  <div class="section-title" data-key="sec_table">📋 日別一覧</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="col_date">日付</th>
          <th data-key="col_used">使用</th>
          <th data-key="col_released">解放</th>
          <th data-key="col_diff">差（使用−解放）</th>
        </tr>
      </thead>
      <tbody id="rackBody"></tbody>
    </table>
  </div>

  <script>
    /* =====================================================
       多言語
    ===================================================== */
    const dict = {
      ja: {
        title:        "🗄️ 時効ラック 使用・解放実績",
        subtitle:     "日別の使用ラック数（押出日）と解放ラック数（最終梱包日）",
        btn_back:     "← 戻る",
        btn_csv:      "📥 CSV出力",
        btn_show:     "表示",
        label_period: "期間：",
        preset_7:     "7日",
        preset_30:    "30日",
        preset_90:    "90日",
        note:         "※ 使用：押出日に登録された時効ラック数　／　解放：そのラックの最後の梱包日に計上。梱包日報が未入力のラックは解放に計上されません。",
        sec_table:    "📋 日別一覧",
        col_date:     "日付",
        col_used:     "使用",
        col_released: "解放",
        col_diff:     "差（使用−解放）",
        sum_row:      "合計",
        avg_row:      "1日平均",
        axis_y:       "ラック数",
        weekdays:     ["日", "月", "火", "水", "木", "金", "土"],
      },
      vi: {
        title:        "🗄️ Giá hóa già: Sử dụng / Giải phóng",
        subtitle:     "Số giá sử dụng theo ngày (ngày ép) và số giá giải phóng (ngày đóng gói cuối)",
        btn_back:     "← Quay lại",
        btn_csv:      "📥 Xuất CSV",
        btn_show:     "Hiển thị",
        label_period: "Thời gian：",
        preset_7:     "7 ngày",
        preset_30:    "30 ngày",
        preset_90:    "90 ngày",
        note:         "※ Sử dụng: số giá hóa già đăng ký theo ngày ép ／ Giải phóng: tính theo ngày đóng gói cuối cùng của giá. Giá chưa nhập báo cáo đóng gói sẽ không được tính là giải phóng.",
        sec_table:    "📋 Danh sách theo ngày",
        col_date:     "Ngày",
        col_used:     "Sử dụng",
        col_released: "Giải phóng",
        col_diff:     "Chênh lệch (SD−GP)",
        sum_row:      "Tổng",
        avg_row:      "TB/ngày",
        axis_y:       "Số giá",
        weekdays:     ["CN", "T2", "T3", "T4", "T5", "T6", "T7"],
      },
    };

    let currentLang = localStorage.getItem("lang") || "ja";

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-key]").forEach(el => {
        const val = dict[lang][el.dataset.key];
        if (val && typeof val === "string") el.textContent = val;
      });
      document.getElementById("btnJa").classList.toggle("active", lang === "ja");
      document.getElementById("btnVi").classList.toggle("active", lang === "vi");
      if (rawData) render();
    }

    /* =====================================================
       期間
    ===================================================== */
    function ymd(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function setPreset(days) {
      const to = new Date();
      const from = new Date();
      from.setDate(to.getDate() - (days - 1));
      document.getElementById("fromDate").value = ymd(from);
      document.getElementById("toDate").value   = ymd(to);
      document.querySelectorAll(".preset-btn").forEach(b =>
        b.classList.toggle("active", Number(b.dataset.days) === days));
      loadData();
    }

    function clearPreset() {
      document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    }

    /* =====================================================
       データ
    ===================================================== */
    let rawData = null;

    async function loadData() {
      const from = document.getElementById("fromDate").value;
      const to   = document.getElementById("toDate").value;
      const res  = await fetch(`./php/report_php/get_aging_rack_daily.php?from=${from}&to=${to}`);
      rawData = await res.json();
      // サーバー側で補正された期間（前後の入れ替え等）を画面に反映
      document.getElementById("fromDate").value = rawData.from;
      document.getElementById("toDate").value   = rawData.to;
      render();
    }

    /* =====================================================
       描画
    ===================================================== */
    function dateLabel(dateStr) {
      const t = dict[currentLang];
      const d = new Date(dateStr + "T00:00:00");
      return `${dateStr.slice(5).replace("-", "/")}(${t.weekdays[d.getDay()]})`;
    }

    function render() {
      renderChart();
      renderTable();
    }

    let chartInstance = null;

    function renderChart() {
      const t    = dict[currentLang];
      const days = rawData.days;

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById("rackChart"), {
        type: "bar",
        data: {
          labels: days.map(d => dateLabel(d.date)),
          datasets: [
            {
              label: t.col_used,
              data: days.map(d => d.used),
              backgroundColor: "#1976d2bb",
              borderColor: "#1976d2",
              borderWidth: 1,
            },
            {
              label: t.col_released,
              data: days.map(d => d.released),
              backgroundColor: "#2e7d32bb",
              borderColor: "#2e7d32",
              borderWidth: 1,
            },
          ],
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "top" } },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: t.axis_y }, ticks: { precision: 0 } },
          },
        },
      });
    }

    function diffCell(v) {
      const cls = v > 0 ? "diff-plus" : v < 0 ? "diff-minus" : "zero";
      return `<td class="mono ${cls}">${v > 0 ? "+" + v : v}</td>`;
    }

    function numCell(v) {
      return `<td class="mono${v === 0 ? " zero" : ""}">${v}</td>`;
    }

    function renderTable() {
      const t    = dict[currentLang];
      const days = rawData.days;
      const body = document.getElementById("rackBody");

      let sumUsed = 0, sumReleased = 0;
      // 新しい日付が上
      const rows = [...days].reverse().map(d => {
        sumUsed     += d.used;
        sumReleased += d.released;
        const wd = new Date(d.date + "T00:00:00").getDay();
        const wdCls = wd === 0 ? " sun" : wd === 6 ? " sat" : "";
        return `<tr>` +
          `<td class="date-col${wdCls}">${dateLabel(d.date)}</td>` +
          numCell(d.used) + numCell(d.released) + diffCell(d.used - d.released) +
          `</tr>`;
      });

      const n = days.length || 1;
      const avg = v => (v / n).toFixed(1);
      rows.push(
        `<tr class="avg-row"><td>${t.avg_row}</td><td>${avg(sumUsed)}</td><td>${avg(sumReleased)}</td><td>${avg(sumUsed - sumReleased)}</td></tr>`,
        `<tr class="sum-row"><td>${t.sum_row}</td><td>${sumUsed}</td><td>${sumReleased}</td><td>${sumUsed - sumReleased > 0 ? "+" : ""}${sumUsed - sumReleased}</td></tr>`,
      );
      body.innerHTML = rows.join("");
    }

    /* =====================================================
       CSV出力
    ===================================================== */
    function exportCSV() {
      if (!rawData) return;
      const t = dict[currentLang];
      const escape = v => `"${String(v).replace(/"/g, '""')}"`;
      const lines = [[t.col_date, t.col_used, t.col_released, t.col_diff].map(escape).join(",")];
      rawData.days.forEach(d => {
        lines.push([d.date, d.used, d.released, d.used - d.released].map(escape).join(","));
      });

      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = `時効ラック使用解放_${rawData.from}_${rawData.to}.csv`;
      a.click();
    }

    /* =====================================================
       初期化
    ===================================================== */
    window.onload = () => {
      setLang(currentLang);
      setPreset(30);
    };
  </script>
</body>
</html>
