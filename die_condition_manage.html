<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Die Condition Manage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Roboto Mono", "Segoe UI", monospace;
        background: #f0f2f5;
        padding: 20px;
      }

      .container { max-width: 1300px; margin: 0 auto; }

      .page-header {
        background: #fff;
        border-radius: 10px;
        padding: 16px 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .back-btn {
        background: #2b6ca3; color: #fff;
        padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer;
        white-space: nowrap;
      }
      h1 { font-size: 20px; border-left: 6px solid #0078d4; padding-left: 10px; }
      .search-wrap { margin-left: auto; }
      .search-wrap input {
        padding: 7px 12px; border: 1px solid #ccc; border-radius: 5px;
        font-size: 13px; width: 200px;
      }

      .list-card {
        background: #fff;
        border-radius: 10px;
        padding: 18px 22px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .list-title { font-size: 14px; color: #555; margin-bottom: 12px; }

      .group { margin-bottom: 8px; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
      .group-header {
        background: #f0f2f5;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-header:hover { background: #e5eaf0; }
      .group-header .arrow { transition: transform 0.15s; }
      .group-header.open .arrow { transform: rotate(90deg); }
      .group-header .group-count { color: #777; font-weight: normal; }
      .group-content { display: none; }
      .group-content.open { display: block; }
      .group-content > .sub-group { margin: 10px 12px 10px 20px; }
      .sub-group .group-header { background: #f7f8fa; font-size: 12px; }
      .sub-group .group-header:hover { background: #eef0f3; }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
      th { color: #777; font-size: 11px; }

      .condition-badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        color: #fff;
        white-space: nowrap;
      }
      .condition-none { background: #9e9e9e; }
      .condition-1 { background: #f57c00; } /* Trial */
      .condition-2 { background: #1565c0; } /* Mass Production Trial */
      .condition-3 { background: #2e7d32; } /* Mass Production */

      select.cond-select {
        padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;
      }

      #toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: #323232; color: #fff; padding: 10px 20px; border-radius: 6px;
        font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="container">

      <div class="page-header">
        <button class="back-btn" onclick="location.href='index.html'">← メニューへ戻る</button>
        <h1>金型コンディション管理</h1>
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="型番で検索" oninput="renderList()" />
        </div>
      </div>

      <div class="list-card">
        <div class="list-title">対象: CQ / CP96 / MXS / MXQ / CXS / MGP / PS で始まる金型(<span id="totalCount">0</span>件)</div>
        <div id="groupsWrap">読み込み中...</div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      const CONDITION_NAMES = { 1: "Trial", 2: "Mass Production Trial", 3: "Mass Production" };
      const PREFIXES = ["CQ", "CP96", "MXS", "MXQ", "CXS", "MGP", "PS"];
      let allDies = [];
      const openGroups = new Set();

      // プレフィックスごとのサブ分類文字(数字の直後にこの文字があり、その後が数字またはハイフンなら「あり」)
      const SUB_GROUP_LETTER = { CQ: "T", CP96: "T", CXS: "S" };

      function prefixOf(dieNumber) {
        return PREFIXES.find((p) => dieNumber.toUpperCase().startsWith(p)) ?? "OTHER";
      }

      function hasLetterPattern(dieNumber, letter) {
        const re = new RegExp(`\\d${letter}[\\d-]`);
        return re.test(dieNumber.toUpperCase());
      }

      function conditionBadge(id) {
        if (!id) return `<span class="condition-badge condition-none">未設定</span>`;
        return `<span class="condition-badge condition-${id}">${CONDITION_NAMES[id] ?? id}</span>`;
      }

      function conditionSelect(die) {
        const opts = [
          `<option value="">未設定</option>`,
          `<option value="1">Trial</option>`,
          `<option value="2">Mass Production Trial</option>`,
          `<option value="3">Mass Production</option>`,
        ].map((opt, i) => {
          const val = i === 0 ? "" : String(i);
          return val === String(die.die_condition_id ?? "")
            ? opt.replace("<option ", "<option selected ")
            : opt;
        }).join("");
        return `<select class="cond-select" onchange="changeCondition(${die.id}, this.value)">${opts}</select>`;
      }

      function renderTable(dies) {
        return `
          <table>
            <thead>
              <tr>
                <th style="width:220px;">型番</th>
                <th style="width:160px;">現在のコンディション</th>
                <th style="width:130px;">総押出長さ (km)</th>
                <th style="width:110px;">最終プレス日</th>
                <th style="width:110px;">最終プレス<br>ビレット本数</th>
                <th style="width:110px;">累計ビレット本数</th>
                <th>変更</th>
              </tr>
            </thead>
            <tbody>
              ${dies.map((d) => `
                <tr id="row-${d.id}">
                  <td>${d.die_number}</td>
                  <td>${conditionBadge(d.die_condition_id)}</td>
                  <td>${Number(d.total_profile_length).toFixed(1)}</td>
                  <td>${d.last_press_date_at ?? "-"}</td>
                  <td>${d.last_billet_quantities ?? "-"}</td>
                  <td>${d.total_billet_quantities}</td>
                  <td>${conditionSelect(d)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function toggleGroup(key) {
        if (openGroups.has(key)) openGroups.delete(key);
        else openGroups.add(key);
        renderList();
      }

      function renderGroupBlock(key, label, count, contentHtml, forceOpen, sub) {
        const isOpen = forceOpen || openGroups.has(key);
        return `
          <div class="group${sub ? " sub-group" : ""}">
            <div class="group-header ${isOpen ? "open" : ""}" onclick="toggleGroup('${key}')">
              <span class="arrow">▶</span>
              <span>${label}</span>
              <span class="group-count">(${count}件)</span>
            </div>
            <div class="group-content ${isOpen ? "open" : ""}">${contentHtml}</div>
          </div>
        `;
      }

      // ハイフンより手前の部分(例: "CQ12T3L-V01B" -> "CQ12T3L")でグループ化
      function baseCodeOf(dieNumber) {
        return dieNumber.split("-")[0];
      }

      function renderBaseCodeGroups(dies, keyPrefix, forceOpen) {
        const codes = [...new Set(dies.map((d) => baseCodeOf(d.die_number)))].sort();
        return codes.map((code) => {
          const group = dies.filter((d) => baseCodeOf(d.die_number) === code);
          return renderGroupBlock(`${keyPrefix}:${code}`, code, group.length, renderTable(group), forceOpen, true);
        }).join("");
      }

      function renderGroupContent(prefix, dies, forceOpen) {
        const letter = SUB_GROUP_LETTER[prefix];
        if (!letter) return renderBaseCodeGroups(dies, prefix, forceOpen);

        const withLetter    = dies.filter((d) => hasLetterPattern(d.die_number, letter));
        const withoutLetter = dies.filter((d) => !hasLetterPattern(d.die_number, letter));

        let html = "";
        if (withLetter.length) {
          html += renderGroupBlock(`${prefix}:${letter}`, `${letter}あり`, withLetter.length, renderBaseCodeGroups(withLetter, `${prefix}:${letter}`, forceOpen), forceOpen, true);
        }
        if (withoutLetter.length) {
          html += renderGroupBlock(`${prefix}:no${letter}`, `${letter}なし`, withoutLetter.length, renderBaseCodeGroups(withoutLetter, `${prefix}:no${letter}`, forceOpen), forceOpen, true);
        }
        return html;
      }

      function renderList() {
        const q = document.getElementById("searchInput").value.trim().toUpperCase();
        const filtered = q ? allDies.filter((d) => d.die_number.toUpperCase().includes(q)) : allDies;

        document.getElementById("totalCount").textContent = filtered.length;

        const wrap = document.getElementById("groupsWrap");
        if (!filtered.length) {
          wrap.innerHTML = `<div style="text-align:center; color:#999; padding:20px;">該当する金型がありません</div>`;
          return;
        }

        wrap.innerHTML = PREFIXES.map((prefix) => {
          const dies = filtered.filter((d) => prefixOf(d.die_number) === prefix);
          if (!dies.length) return "";
          const isOpen = q ? true : openGroups.has(prefix);
          return `
            <div class="group">
              <div class="group-header ${isOpen ? "open" : ""}" onclick="toggleGroup('${prefix}')">
                <span class="arrow">▶</span>
                <span>${prefix}</span>
                <span class="group-count">(${dies.length}件)</span>
              </div>
              <div class="group-content ${isOpen ? "open" : ""}">${renderGroupContent(prefix, dies, !!q)}</div>
            </div>
          `;
        }).join("");
      }

      async function loadList() {
        const res = await fetch("./php/die_condition_manage/get_list.php");
        allDies = await res.json();
        renderList();
      }

      async function changeCondition(dieId, conditionId) {
        const res = await fetch("./php/die_condition_manage/update_condition.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ die_id: dieId, condition_id: conditionId }).toString(),
        });
        const result = await res.json();

        if (result.status !== "ok") {
          showToast(result.message || "更新に失敗しました", false);
          return;
        }

        const die = allDies.find((d) => d.id === dieId);
        if (die) die.die_condition_id = conditionId === "" ? null : Number(conditionId);

        const row = document.getElementById(`row-${dieId}`);
        if (row) row.children[1].innerHTML = conditionBadge(die?.die_condition_id);

        showToast("更新しました");
      }

      function showToast(msg, ok = true) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.background = ok ? "#323232" : "#c62828";
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      loadList();
    </script>
  </body>
</html>
