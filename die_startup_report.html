<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Die Startup Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }

    .lang-buttons { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .lang-buttons button {
      padding: 6px 12px; margin-left: 5px; border: 1px solid #0078d4;
      background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .lang-buttons button.active { background: #0078d4; color: #fff; }

    h1 { font-size: 22px; margin-bottom: 6px; border-left: 6px solid #0078d4; padding-left: 10px; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 18px; padding-left: 16px; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn { padding: 7px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-back { background: #546e7a; color: #fff; }
    .btn-csv  { background: #217346; color: #fff; }
    .btn-toggle { background: #8e5ec7; color: #fff; }

    /* 年度フィルタ（年度を月別に展開しているときだけ使える） */
    .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; transition: opacity .2s; }
    .filter-row.is-disabled { opacity: 0.45; }
    .filter-row label { font-size: 13px; color: #555; }
    .filter-row select {
      padding: 5px 10px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px;
    }

    /* テーブル */
    .table-wrap {
      background: #fff; border-radius: 8px; overflow-x: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 28px;
    }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; text-align: right; }
    th { background: #e8f1ff; text-align: center; font-size: 12px; position: sticky; top: 0; }
    th.label-col, td.label-col { text-align: left; font-weight: bold; min-width: 130px; background: #f5f5f5; position: sticky; left: 0; }
    td.total-col { font-weight: bold; background: #e8f5e9; color: #2e7d32; }
    th.col-fyavg, td.col-fyavg { background: #fff8e1; }
    .fy-toggle-btn {
      border: none; background: transparent; color: #8e5ec7; cursor: pointer;
      font-size: 12px; font-weight: bold; padding: 0 2px; vertical-align: middle;
    }
    .fy-toggle-btn:hover { text-decoration: underline; }
    tr:hover td { background: #f0f8ff; }
    tr:hover td.label-col { background: #e8f1ff; }

    /* グラフ */
    .chart-wrap {
      background: #fff; border-radius: 8px; padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .chart-title { font-size: 15px; font-weight: bold; color: #2b6ca3; margin-bottom: 14px; }
    canvas { max-height: 320px; }
  </style>
</head>
<body>
  <div class="lang-buttons">
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
    <button id="btnVi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>

  <h1 data-key="title">📊 金型立上 実績レポート</h1>
  <div class="subtitle" data-key="subtitle">月別集計：到着 / 型検合格 / 移管 / 試押</div>

  <div class="toolbar">
    <button class="btn btn-back" onclick="location.href='index.html'" data-key="btn_back">← 戻る</button>
    <button class="btn btn-csv"  onclick="exportCSV()" data-key="btn_csv">📥 CSV出力</button>
    <button class="btn btn-toggle" id="btnToggleView" onclick="toggleView()">📆 月別に展開</button>
  </div>

  <div class="filter-row is-disabled" id="yearFilterRow">
    <label data-key="label_year">年度絞り込み：</label>
    <select id="yearFilter" onchange="applyFilter()" disabled>
      <option value="" data-key="opt_all">全期間</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="reportTable">
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="chart-wrap">
    <div class="chart-title" data-key="chart_title">📈 月別推移</div>
    <canvas id="myChart"></canvas>
  </div>

  <script>
    /* =====================================================
       多言語
    ===================================================== */
    const dict = {
      ja: {
        title:       "📊 金型立上 実績レポート",
        subtitle:    "月別集計：到着 / 型検合格 / 移管 / 試押",
        btn_back:    "← 戻る",
        btn_csv:     "📥 CSV出力",
        label_year:  "年度絞り込み：",
        opt_all:     "全期間",
        chart_title: "📈 月別推移",
        col_total:   "今年度平均",
        fyLabel:     fy => `${String(fy % 100).padStart(2, "0")}年度(月平均)`,
        btn_expand:   "📆 月別に展開",
        btn_collapse: "📅 年度平均で表示",
        title_expand:   "この年度を月別に展開",
        title_collapse: "この年度を月平均に戻す",
        title_avg_excl_current: "当年度(4月〜)の月平均。進行中の当月は除く",
        metrics: {
          arrival:       "金型到着数",
          parts_arrival: "金型部品到着数",
          inspection:    "型検合格数",
          handover:      "金型移管数",
          trial_press:   "試押回数",
        },
        diff_label: "移管数ー到着数",
      },
      vi: {
        title:       "📊 Báo cáo thực tế khởi động khuôn",
        subtitle:    "Tổng hợp theo tháng：Đến / KT đạt / Bàn giao / Thử ép",
        btn_back:    "← Quay lại",
        btn_csv:     "📥 Xuất CSV",
        label_year:  "Lọc theo năm：",
        opt_all:     "Tất cả",
        chart_title: "📈 Xu hướng theo tháng",
        col_total:   "TB năm nay",
        fyLabel:     fy => `Năm ${String(fy % 100).padStart(2, "0")}(TB tháng)`,
        btn_expand:   "📆 Xem theo tháng",
        btn_collapse: "📅 Xem TB năm",
        title_expand:   "Xem chi tiết theo tháng của năm này",
        title_collapse: "Quay lại TB tháng của năm này",
        title_avg_excl_current: "TB tháng của năm tài chính hiện tại (từ tháng 4), không tính tháng hiện tại",
        metrics: {
          arrival:       "Số khuôn đến",
          parts_arrival: "Số phụ kiện đến",
          inspection:    "KT khuôn đạt",
          handover:      "Số bàn giao",
          trial_press:   "Số lần thử ép",
        },
        diff_label: "Bàn giao - Đến",
      },
    };

    let currentLang = localStorage.getItem("lang") || "ja";

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-key]").forEach(el => {
        const val = dict[lang][el.dataset.key];
        if (val && typeof val === "string") el.textContent = val;
      });
      document.getElementById("btnJa").classList.toggle("active", lang === "ja");
      document.getElementById("btnVi").classList.toggle("active", lang === "vi");
      if (rawData) syncExpandState();
      if (rawData) renderAll(rawData);
    }

    /* =====================================================
       データ
    ===================================================== */
    let rawData = null;

    const METRIC_KEYS   = ["arrival", "parts_arrival", "inspection", "handover", "trial_press"];
    const CHART_COLORS  = ["#1976d2", "#00838f", "#2e7d32", "#f57c00", "#7b1fa2"];

    async function loadData() {
      const res = await fetch("./php/report_php/get_startup_monthly.php");
      rawData = await res.json();
      buildYearFilter(rawData.months);
      syncExpandState();
      renderAll(rawData);
    }

    /* =====================================================
       年度フィルタ
    ===================================================== */
    function buildYearFilter(months) {
      const years = [...new Set(months.map(m => m.slice(0, 4)))].sort();
      const sel   = document.getElementById("yearFilter");
      years.forEach(y => {
        const opt = document.createElement("option");
        opt.value       = y;
        opt.textContent = y;
        sel.appendChild(opt);
      });
    }

    function applyFilter() {
      if (rawData) renderAll(rawData);
    }

    function filteredMonths() {
      const y = document.getElementById("yearFilter").value;
      return y ? rawData.months.filter(m => m.startsWith(y)) : rawData.months;
    }

    /* =====================================================
       年度平均表示 ⇔ 月別表示（設備稼働実績 machine_report.html と同じ）
       （年度は4月始まり3月終わり。過去年度は月平均1列にまとめ、
        当年度分は月別のまま表示する。年度平均の列は、その列の
        ボタンから個別に月別展開／折りたたみができる）
    ===================================================== */
    let expandedFYs = new Set(); // 個別に「月別展開」した過去年度の集合

    function fiscalYearOf(monthStr) {
      const [y, m] = monthStr.split("-").map(Number);
      return m >= 4 ? y : y - 1;
    }

    function currentFiscalYear() {
      const now = new Date();
      const m = now.getMonth() + 1;
      return m >= 4 ? now.getFullYear() : now.getFullYear() - 1;
    }

    // 進行中の当月はそろっていないため、右端の「今年度平均」の計算から除く
    function currentMonthStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    }

    // 「今年度平均」の対象月：当年度（4月〜）のうち、進行中の当月を除いた月（絞り込みに関わらず全体で計算）
    function averageMonths() {
      if (!rawData) return [];
      const curFY     = currentFiscalYear();
      const currentMo = currentMonthStr();
      return rawData.months.filter(m => fiscalYearOf(m) === curFY && m !== currentMo);
    }

    function allPastFiscalYears() {
      if (!rawData) return [];
      const curFY = currentFiscalYear();
      return [...new Set(rawData.months.map(fiscalYearOf))].filter(fy => fy < curFY).sort((a, b) => a - b);
    }

    function buildColumns(months, expandedFYs) {
      const curFY = currentFiscalYear();
      const byFY = new Map();
      months.forEach(m => {
        const fy = fiscalYearOf(m);
        if (!byFY.has(fy)) byFY.set(fy, []);
        byFY.get(fy).push(m);
      });
      const columns = [];
      [...byFY.keys()].sort((a, b) => a - b).forEach(fy => {
        const fyMonths = byFY.get(fy);
        const isCurrent = fy === curFY;
        if (!isCurrent && !expandedFYs.has(fy)) {
          columns.push({ type: "fy-avg", key: "fy" + fy, fy, months: fyMonths });
        } else {
          fyMonths.forEach((m, i) => columns.push({
            type: "month", key: m, month: m, fy,
            // 手動で展開した年度だけ、先頭月に「折りたたむ」ボタンを出す
            collapsible: !isCurrent && i === 0,
          }));
        }
      });
      return columns;
    }

    function columnLabel(col) {
      const t = dict[currentLang];
      return col.type === "month" ? col.month.slice(2).replace("-", "/") : t.fyLabel(col.fy);
    }

    // 年度平均の列は、12ではなく実際にある月数で割る（データの端の年度でも実態に合わせる）
    function columnValue(mObj, col) {
      if (col.type === "month") return mObj[col.month] ?? 0;
      const sum = col.months.reduce((s, m) => s + (mObj[m] ?? 0), 0);
      return sum / (col.months.length || 1);
    }

    function toggleFY(fy) {
      if (expandedFYs.has(fy)) expandedFYs.delete(fy); else expandedFYs.add(fy);
      syncExpandState();
      if (rawData) renderAll(rawData);
    }

    // 年度絞り込みの有効/無効と、ツールバーのボタンの文言を、展開の状態に合わせる
    function syncExpandState() {
      const t           = dict[currentLang];
      const pastFYs     = allPastFiscalYears();
      const anyExpanded = expandedFYs.size > 0;
      const allExpanded = pastFYs.length > 0 && pastFYs.every(fy => expandedFYs.has(fy));
      const yearSel = document.getElementById("yearFilter");
      yearSel.disabled = !anyExpanded;
      document.getElementById("yearFilterRow").classList.toggle("is-disabled", !anyExpanded);
      if (!anyExpanded) yearSel.value = "";
      document.getElementById("btnToggleView").textContent = allExpanded ? t.btn_collapse : t.btn_expand;
    }

    // ツールバーの「月別に展開」：全年度をまとめて展開／折りたたみ
    function toggleView() {
      const pastFYs     = allPastFiscalYears();
      const allExpanded = pastFYs.length > 0 && pastFYs.every(fy => expandedFYs.has(fy));
      if (allExpanded) expandedFYs.clear(); else pastFYs.forEach(fy => expandedFYs.add(fy));
      syncExpandState();
      if (rawData) renderAll(rawData);
    }

    /* =====================================================
       描画
    ===================================================== */
    function renderAll(data) {
      const months  = filteredMonths();
      const columns = buildColumns(months, expandedFYs);
      renderTable(data, columns);
      renderChart(data, columns);
    }

    function renderTable(data, columns) {
      const t = dict[currentLang];

      // ヘッダー
      const head = document.getElementById("tableHead");
      head.innerHTML = `<th class="label-col">項目 / 年月</th>`;
      columns.forEach(col => {
        if (col.type === "fy-avg") {
          head.innerHTML += `<th class="col-fyavg">` +
            `<button type="button" class="fy-toggle-btn" onclick="toggleFY(${col.fy})" title="${t.title_expand}">▸</button> ` +
            `${columnLabel(col)}</th>`;
        } else if (col.collapsible) {
          head.innerHTML += `<th>` +
            `<button type="button" class="fy-toggle-btn" onclick="toggleFY(${col.fy})" title="${t.title_collapse}">▾</button> ` +
            `${columnLabel(col)}</th>`;
        } else {
          head.innerHTML += `<th>${columnLabel(col)}</th>`;
        }
      });
      head.innerHTML += `<th title="${t.title_avg_excl_current}">${t.col_total}</th>`;

      // 行
      const body = document.getElementById("tableBody");
      body.innerHTML = "";
      const avgMonths = averageMonths();

      METRIC_KEYS.forEach(key => {
        const tr   = document.createElement("tr");
        const mObj = data.data[key] ?? {};
        let cells  = `<td class="label-col">${t.metrics[key]}</td>`;
        columns.forEach(col => {
          const v = columnValue(mObj, col);
          // 年度平均は小数になるので小数1桁、月はそのままの件数
          const txt = v > 0 ? (col.type === "fy-avg" ? v.toFixed(1) : v) : "";
          cells += `<td class="mono${col.type === "fy-avg" ? " col-fyavg" : ""}">${txt}</td>`;
        });
        // 右端は当年度（進行中の当月を除く）の月平均
        const avg = avgMonths.reduce((s, m) => s + (mObj[m] ?? 0), 0) / (avgMonths.length || 1);
        cells += `<td class="total-col">${avg.toFixed(1)}</td>`;
        tr.innerHTML = cells;
        body.appendChild(tr);
      });
    }

    /* =====================================================
       グラフ（Chart.js）
    ===================================================== */
    let chartInstance = null;

    function renderChart(data, columns) {
      const t      = dict[currentLang];
      const labels = columns.map(columnLabel);

      // 試押回数は他の項目より桁が大きく、グラフが見にくくなるので表だけに出す（色は項目ごとに固定のまま）
      const datasets = METRIC_KEYS.map((key, i) => ({ key, i })).filter(({ key }) => key !== "trial_press").map(({ key, i }) => {
        const mObj = data.data[key] ?? {};
        return {
          label:           t.metrics[key],
          data:            columns.map(col => Math.round(columnValue(mObj, col) * 10) / 10),
          backgroundColor: CHART_COLORS[i] + "99",
          borderColor:     CHART_COLORS[i],
          borderWidth:     2,
          tension:         0.3,
        };
      });

      // 折れ線：移管数ー到着数
      const arrivalObj  = data.data["arrival"]  ?? {};
      const handoverObj = data.data["handover"] ?? {};
      datasets.push({
        type:            "line",
        label:           t.diff_label,
        data:            columns.map(col => Math.round((columnValue(handoverObj, col) - columnValue(arrivalObj, col)) * 10) / 10),
        borderColor:     "#e53935",
        backgroundColor: "transparent",
        borderWidth:     2,
        pointRadius:     4,
        pointBackgroundColor: "#e53935",
        tension:         0.3,
        yAxisID:         "y",
      });

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById("myChart"), {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: { legend: { position: "top" } },
          scales: {
            x: { stacked: false },
            y: { beginAtZero: true, ticks: { stepSize: 1 } },
          },
        },
      });
    }

    /* =====================================================
       CSV出力
    ===================================================== */
    function exportCSV() {
      const t      = dict[currentLang];
      const months = filteredMonths();
      const header = ["項目", ...months.map(m => m.slice(2).replace("-","/")), t.col_total];
      const avgMonths = averageMonths();
      const rows   = METRIC_KEYS.map(key => {
        const mObj = rawData.data[key] ?? {};
        const vals = months.map(m => mObj[m] ?? 0);
        const avg  = avgMonths.reduce((s, m) => s + (mObj[m] ?? 0), 0) / (avgMonths.length || 1);
        return [t.metrics[key], ...vals, avg.toFixed(1)];
      });

      const escape = v => `"${String(v).replace(/"/g,'""')}"`;
      const csv = [header, ...rows].map(r => r.map(escape).join(",")).join("\r\n");

      const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = `金型立上実績_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    /* =====================================================
       初期化
    ===================================================== */
    window.onload = async () => {
      setLang(currentLang);
      await loadData();
    };
  </script>
</body>
</html>
