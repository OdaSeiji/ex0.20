<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }

    .lang-buttons { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .lang-buttons button {
      padding: 6px 12px; margin-left: 5px; border: 1px solid #0078d4;
      background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .lang-buttons button.active { background: #0078d4; color: #fff; }

    h1 { font-size: 22px; margin-bottom: 6px; border-left: 6px solid #0078d4; padding-left: 10px; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 18px; padding-left: 16px; }

    .toolbar { margin-bottom: 16px; }
    .btn { padding: 7px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-back { background: #546e7a; color: #fff; }
    .btn-csv  { background: #217346; color: #fff; white-space: nowrap; }
    .btn-csv:disabled { background: #9e9e9e; cursor: wait; }

    .list { display: flex; flex-direction: column; gap: 12px; max-width: 900px; }
    .item {
      display: flex; align-items: center; gap: 16px;
      background: #fff; border-radius: 8px; padding: 14px 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .item-body { flex: 1; }
    .item-title { font-size: 15px; font-weight: bold; color: #2b6ca3; margin-bottom: 4px; }
    .item-desc { font-size: 12px; color: #555; line-height: 1.6; }
    .item-meta { font-size: 11px; color: #999; margin-top: 4px; }
  </style>
  <link rel="stylesheet" href="./css/lang_buttons.css" />
</head>
<body>
  <div class="lang-buttons">
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
    <button id="btnVi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>

  <h1 data-key="title">📥 ダウンロード</h1>
  <div class="subtitle" data-key="subtitle">データを Excel（.xlsx）でダウンロードします</div>

  <div class="toolbar">
    <button class="btn btn-back" onclick="location.href='index.html'" data-key="btn_back">← 戻る</button>
  </div>

  <div class="list">
    <!-- Quality Summary Table（ex0.11 CsvDownLoad.html から移植） -->
    <div class="item">
      <div class="item-body">
        <div class="item-title">Quality Summary Table</div>
        <div class="item-desc" data-key="qs_desc">押出ごとの品質のまとめ：押出日・押出時間・型番・品番・ビレット・切断数・不良数・良品数・各工程のチェック日・不良コード別の本数（301〜401）・号機・製造（Dubai/VN）・生産性（ton/h）・総時間・300/200コードの時間・オーダーシート番号。全期間、新しい押出から。</div>
        <div class="item-meta" data-key="qs_meta">列と見出しは旧画面（ex0.11）と同じ（aging_check_date は時効（硬度）の確認日）</div>
      </div>
      <button class="btn btn-csv" onclick="download(this, './php/download/quality_summary.php')" data-key="btn_xlsx">📥 Excel</button>
    </div>
  </div>

  <script src="./lib/xlsx.js"></script>
  <script>
    const dict = {
      ja: {
        title: "📥 ダウンロード",
        subtitle: "データを Excel（.xlsx）でダウンロードします",
        btn_back: "← 戻る",
        btn_xlsx: "📥 Excel",
        downloading: "⏳ 作成中…",
        error: "ダウンロードに失敗しました",
        qs_desc: "押出ごとの品質のまとめ：押出日・押出時間・型番・品番・ビレット・切断数・不良数・良品数・各工程のチェック日・不良コード別の本数（301〜401）・号機・製造（Dubai/VN）・生産性（ton/h）・総時間・300/200コードの時間・オーダーシート番号。全期間、新しい押出から。",
        qs_meta: "列と見出しは旧画面（ex0.11）と同じ（aging_check_date は時効（硬度）の確認日）",
      },
      vi: {
        title: "📥 Tải xuống",
        subtitle: "Tải dữ liệu dạng Excel (.xlsx)",
        btn_back: "← Quay lại",
        btn_xlsx: "📥 Excel",
        downloading: "⏳ Đang tạo…",
        error: "Tải xuống thất bại",
        qs_desc: "Tổng hợp chất lượng theo từng lần đùn: ngày đùn, thời gian đùn, mã khuôn, mã SP, phôi, số cây cắt, số NG, số OK, ngày kiểm tra từng công đoạn, số NG theo mã (301〜401), số máy, MFG (Dubai/VN), năng suất (ton/h), tổng thời gian, thời gian mã 300/200, số order sheet. Toàn bộ thời gian, mới nhất trước.",
        qs_meta: "Cột và tiêu đề giống màn hình cũ (ex0.11) (aging_check_date là ngày kiểm tra hóa già (độ cứng))",
      },
    };
    let currentLang = "ja";
    try { currentLang = localStorage.getItem("lang") || "ja"; } catch (e) {}

    function setLang(lang) {
      currentLang = lang;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      document.querySelectorAll("[data-key]").forEach(el => {
        const v = dict[lang][el.dataset.key];
        if (typeof v === "string") el.textContent = v;
      });
      document.getElementById("btnJa").classList.toggle("active", lang === "ja");
      document.getElementById("btnVi").classList.toggle("active", lang === "vi");
    }

    // サーバーから { sheet, file, header, rows } を受け取り、Excel（.xlsx）にして保存する（lib/xlsx.js = SheetJS）
    async function download(btn, url) {
      btn.disabled = true;
      btn.textContent = dict[currentLang].downloading;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        const ws = XLSX.utils.aoa_to_sheet([data.header, ...data.rows]);
        ws["!freeze"] = { xSplit: 0, ySplit: 1 };
        ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: data.rows.length, c: data.header.length - 1 } }) };
        ws["!cols"] = data.header.map(h => ({ wch: Math.max(8, String(h).length + 2) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, data.sheet);
        XLSX.writeFile(wb, data.file + ".xlsx", { compression: true });
      } catch (e) {
        alert(dict[currentLang].error + " (" + e.message + ")");
      } finally {
        btn.disabled = false;
        btn.textContent = dict[currentLang].btn_xlsx;
      }
    }

    setLang(currentLang);
  </script>
</body>
</html>
