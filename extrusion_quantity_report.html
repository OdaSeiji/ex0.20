<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Extrusion Quantity Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }

    .lang-buttons { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .lang-buttons button {
      padding: 6px 12px; margin-left: 5px; border: 1px solid #0078d4;
      background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .lang-buttons button.active { background: #0078d4; color: #fff; }

    h1 { font-size: 22px; margin-bottom: 6px; border-left: 6px solid #0078d4; padding-left: 10px; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 18px; padding-left: 16px; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn { padding: 7px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-back { background: #546e7a; color: #fff; }
    .btn-csv  { background: #217346; color: #fff; }
    .btn-excel { background: #185c37; color: #fff; }
    .btn-toggle { background: #8e5ec7; color: #fff; }

    .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; transition: opacity .2s; }
    .filter-row.is-disabled { opacity: 0.45; }
    .filter-row label { font-size: 13px; color: #555; }
    .filter-row select { padding: 5px 10px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px; }

    /* テーブル共通 */
    .section-title {
      font-size: 15px; font-weight: bold; color: #2b6ca3;
      margin: 24px 0 8px; padding-left: 8px;
      border-left: 4px solid #0078d4;
    }
    .table-wrap {
      background: #fff; border-radius: 8px; overflow-x: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 8px;
    }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 11px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; text-align: right; }
    th { background: #e8f1ff; text-align: center; font-size: 11px; position: sticky; top: 0; }
    td.label-col {
      text-align: center; font-weight: bold;
      background: #f5f5f5; position: sticky; font-family: "Segoe UI", sans-serif;
    }
    td.label-col.col-type, th.col-type { left: 0;   width: 92px; }
    td.label-col.col-size, th.col-size { left: 92px; width: 64px; font-family: "Roboto Mono", monospace; }
    td.label-col.col-mfg,  th.col-mfg  { left: 156px; width: 72px; text-align: left; font-family: "Roboto Mono", monospace; }
    th.col-type, th.col-size, th.col-mfg { z-index: 2; }
    td.total-col { font-weight: bold; background: #e8f5e9; color: #2e7d32; }
    th.col-fyavg, td.col-fyavg { background: #fff8e1; }
    tr.sum-row td.col-fyavg { background: #ffecb3; }
    .fy-toggle-btn {
      border: none; background: transparent; color: #8e5ec7; cursor: pointer;
      font-size: 12px; font-weight: bold; padding: 0 2px; vertical-align: middle;
    }
    .fy-toggle-btn:hover { text-decoration: underline; }
    tr.sum-row td { background: #e3f2fd; font-weight: bold; color: #1565c0; }
    tr.sum-row td.label-col { background: #bbdefb; }
    tr:hover td { background: #f0f8ff; }
    tr:hover td.label-col { background: #e8f1ff; }
    tr.sum-row:hover td { background: #bbdefb; }
    td.mono { font-family: "Roboto Mono", monospace; }

    /* グラフ */
    .chart-wrap {
      background: #fff; border-radius: 8px; padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-top: 28px;
    }
    .chart-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
    }
    .chart-title { font-size: 15px; font-weight: bold; color: #2b6ca3; }
    .chart-switch { display: flex; border: 1px solid #0078d4; border-radius: 5px; overflow: hidden; }
    .chart-switch-btn {
      padding: 6px 14px; border: none; background: #fff; color: #0078d4;
      font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .chart-switch-btn + .chart-switch-btn { border-left: 1px solid #0078d4; }
    .chart-switch-btn.active { background: #0078d4; color: #fff; }
    canvas { max-height: 360px; }
  </style>
</head>
<body>
  <div class="lang-buttons">
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
    <button id="btnVi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>

  <h1 data-key="title">⚖️ 押出重量 実績レポート</h1>
  <div class="subtitle" data-key="subtitle">押出種別 × ビレットサイズ × 製造工場 別：月次投入重量（t）</div>

  <div class="toolbar">
    <button class="btn btn-back" onclick="location.href='index.html'" data-key="btn_back">← 戻る</button>
    <button class="btn btn-csv"  onclick="exportCSV()" data-key="btn_csv">📥 CSV出力</button>
    <button class="btn btn-csv"  onclick="exportCombinedCSV()" data-key="btn_csv_all">📥 全体CSV出力（3表統合）</button>
    <button class="btn btn-excel" onclick="exportExcel()" data-key="btn_excel">📊 Excel出力</button>
    <button class="btn btn-toggle" id="btnToggleView" onclick="toggleView()">📆 月別に展開</button>
  </div>

  <div class="filter-row" id="yearFilterRow">
    <label data-key="label_year">年度絞り込み：</label>
    <select id="yearFilter" onchange="applyFilter()">
      <option value="" data-key="opt_all">全期間</option>
    </select>
  </div>

  <div class="section-title" data-key="sec_table">📋 重量集計（t）</div>
  <div class="table-wrap">
    <table id="qtyTable">
      <thead><tr id="qtyHead"></tr></thead>
      <tbody id="qtyBody"></tbody>
    </table>
  </div>

  <div class="chart-wrap">
    <div class="chart-header">
      <div class="chart-title" id="chartTitleMain" data-key="chart_title">📈 押出種別 月別重量（積み上げ）</div>
      <div class="chart-switch">
        <button class="chart-switch-btn active" id="btnChartByType" onclick="setChartMode('type')" data-key="chart_by_type">押出種別</button>
        <button class="chart-switch-btn" id="btnChartByMfg" onclick="setChartMode('mfg')" data-key="chart_by_mfg">製造工場</button>
      </div>
    </div>
    <canvas id="myChart"></canvas>
  </div>

  <div class="section-title" data-key="sec_cut_table">✂️ 切断重量集計（t）</div>
  <div class="table-wrap">
    <table id="cutTable">
      <thead><tr id="cutHead"></tr></thead>
      <tbody id="cutBody"></tbody>
    </table>
  </div>

  <div class="chart-wrap">
    <div class="chart-header">
      <div class="chart-title" data-key="cut_chart_title">✂️ 押出種別 月別切断重量（積み上げ）</div>
      <button class="btn btn-csv" id="btnCutCsv" onclick="exportCutCSV()" data-key="btn_csv">📥 CSV出力</button>
    </div>
    <canvas id="cutChart"></canvas>
  </div>

  <div class="section-title" data-key="sec_good_table">✅ 良品重量集計（t）</div>
  <div class="table-wrap">
    <table id="goodTable">
      <thead><tr id="goodHead"></tr></thead>
      <tbody id="goodBody"></tbody>
    </table>
  </div>

  <div class="chart-wrap">
    <div class="chart-header">
      <div class="chart-title" data-key="good_chart_title">✅ 押出種別 月別良品重量（積み上げ）</div>
      <button class="btn btn-csv" id="btnGoodCsv" onclick="exportGoodCSV()" data-key="btn_csv">📥 CSV出力</button>
    </div>
    <canvas id="goodChart"></canvas>
  </div>

  <script>
    /* =====================================================
       多言語
    ===================================================== */
    const dict = {
      ja: {
        title:      "⚖️ 押出重量 実績レポート",
        subtitle:   "押出種別 × ビレットサイズ × 製造工場 別：月次投入重量（t）",
        btn_back:   "← 戻る",
        btn_csv:    "📥 CSV出力",
        btn_csv_all: "📥 全体CSV出力（3表統合）",
        btn_excel:  "📊 Excel出力",
        label_year: "年度絞り込み：",
        opt_all:    "全期間",
        sec_table:  "📋 重量集計（t）",
        col_category: "区分",
        cat_input: "投入重量",
        cat_cut:   "切断重量",
        cat_good:  "良品重量",
        chart_title:      "📈 押出種別 月別重量（積み上げ）",
        chart_title_mfg:  "📈 製造工場別 月別重量（積み上げ）",
        chart_by_type: "押出種別",
        chart_by_mfg:  "製造工場",
        sec_cut_table:  "✂️ 切断重量集計（t）",
        cut_chart_title:"✂️ 押出種別 月別切断重量（積み上げ）",
        sec_good_table:  "✅ 良品重量集計（t）",
        good_chart_title:"✅ 押出種別 月別良品重量（積み上げ）",
        col_type:   "押出種別",
        col_size:   "ビレットサイズ",
        col_mfg:    "製造工場",
        col_total:  "今年度平均",
        sum_row:    "合計",
        mfgLabel:   { 1: "Dubai", 2: "VN" },
        typeLabel:  { 1: "試押", 2: "量産試押", 3: "量産" },
        btn_expand:   "📆 月別に展開",
        btn_collapse: "📅 年度平均で表示",
        fyLabel:    fy => `${String(fy % 100).padStart(2, "0")}年度(月平均)`,
        title_expand:   "この年度を月別に展開",
        title_collapse: "この年度を月平均に戻す",
        title_avg_excl_current: "当年度(4月〜)の月平均。進行中の当月は除く",
      },
      vi: {
        title:      "⚖️ Báo cáo trọng lượng ép",
        subtitle:   "Theo Loại ép × Kích thước phôi × Nhà máy：Trọng lượng (t) theo tháng",
        btn_back:   "← Quay lại",
        btn_csv:    "📥 Xuất CSV",
        btn_csv_all: "📥 Xuất CSV tổng hợp (3 bảng)",
        btn_excel:  "📊 Xuất Excel",
        label_year: "Lọc theo năm：",
        opt_all:    "Tất cả",
        sec_table:  "📋 Tổng hợp trọng lượng (t)",
        col_category: "Phân loại",
        cat_input: "Trọng lượng đầu vào",
        cat_cut:   "Trọng lượng cắt",
        cat_good:  "Trọng lượng SP tốt",
        chart_title:      "📈 Trọng lượng theo Loại ép theo tháng（tích lũy）",
        chart_title_mfg:  "📈 Trọng lượng theo Nhà máy theo tháng（tích lũy）",
        chart_by_type: "Loại ép",
        chart_by_mfg:  "Nhà máy",
        sec_cut_table:  "✂️ Tổng hợp trọng lượng cắt (t)",
        cut_chart_title:"✂️ Trọng lượng cắt theo Loại ép theo tháng（tích lũy）",
        sec_good_table:  "✅ Tổng hợp trọng lượng SP tốt (t)",
        good_chart_title:"✅ Trọng lượng SP tốt theo Loại ép theo tháng（tích lũy）",
        col_type:   "Loại ép",
        col_size:   "KT phôi",
        col_mfg:    "Nhà máy",
        col_total:  "TB năm nay",
        sum_row:    "Tổng",
        mfgLabel:   { 1: "Dubai", 2: "VN" },
        typeLabel:  { 1: "Ép thử", 2: "Ép thử SX loạt", 3: "SX hàng loạt" },
        btn_expand:   "📆 Xem theo tháng",
        btn_collapse: "📅 Xem TB năm tài chính",
        fyLabel:    fy => `NTC${String(fy % 100).padStart(2, "0")} (TB/tháng)`,
        title_expand:   "Xem chi tiết theo tháng của năm này",
        title_collapse: "Quay lại TB tháng của năm này",
        title_avg_excl_current: "TB tháng của năm tài chính hiện tại (từ tháng 4), không tính tháng hiện tại",
      },
    };

    let currentLang = localStorage.getItem("lang") || "ja";

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-key]").forEach(el => {
        const val = dict[lang][el.dataset.key];
        if (val && typeof val === "string") el.textContent = val;
      });
      document.getElementById("btnJa").classList.toggle("active", lang === "ja");
      document.getElementById("btnVi").classList.toggle("active", lang === "vi");
      updateToggleButtonLabel();
      updateChartHeaderLabels();
      if (rawData) renderAll(rawData);
      if (cutRawData) renderCutSection();
      if (goodRawData) renderGoodSection();
    }

    /* =====================================================
       データ
    ===================================================== */
    let rawData = null;
    let cutRawData = null;
    let goodRawData = null;

    const TYPE_COLORS = { 1: "#1976d2", 2: "#f57c00", 3: "#2e7d32" };
    const MFG_COLORS  = { 1: "#1976d2", 2: "#ef6c00" };

    let chartMode = "type"; // "type" | "mfg"

    function setChartMode(mode) {
      chartMode = mode;
      document.getElementById("btnChartByType").classList.toggle("active", mode === "type");
      document.getElementById("btnChartByMfg").classList.toggle("active", mode === "mfg");
      updateChartHeaderLabels();
      if (rawData) {
        const months  = filteredMonths();
        const columns = buildColumns(months, expandedFYs);
        renderChart(rawData, columns);
      }
    }

    function updateChartHeaderLabels() {
      const t = dict[currentLang];
      document.getElementById("btnChartByType").textContent = t.chart_by_type;
      document.getElementById("btnChartByMfg").textContent  = t.chart_by_mfg;
      const titleEl = document.getElementById("chartTitleMain");
      if (titleEl) titleEl.textContent = chartMode === "mfg" ? t.chart_title_mfg : t.chart_title;
    }

    async function loadData() {
      const res = await fetch("./php/report_php/get_bundle_quantity_monthly.php");
      rawData = await res.json();
      buildYearFilter(rawData.months);
      syncExpandState();
      renderAll(rawData);
    }

    async function loadCutData() {
      const res = await fetch("./php/report_php/get_cutting_weight_monthly.php");
      cutRawData = await res.json();
      renderCutSection();
    }

    async function loadGoodData() {
      const res = await fetch("./php/report_php/get_good_weight_monthly.php");
      goodRawData = await res.json();
      renderGoodSection();
    }

    /* =====================================================
       年度フィルタ
    ===================================================== */
    function buildYearFilter(months) {
      const years = [...new Set(months.map(m => m.slice(0, 4)))].sort();
      const sel   = document.getElementById("yearFilter");
      years.forEach(y => {
        const opt = document.createElement("option");
        opt.value = y; opt.textContent = y;
        sel.appendChild(opt);
      });
    }

    function applyFilter() {
      if (rawData) renderAll(rawData);
      if (cutRawData) renderCutSection();
      if (goodRawData) renderGoodSection();
    }

    function filteredMonths(sourceMonths) {
      const src = sourceMonths || rawData.months;
      const y = document.getElementById("yearFilter").value;
      return y ? src.filter(m => m.startsWith(y)) : src;
    }

    /* =====================================================
       年度平均表示 ⇔ 月別表示
       （年度は4月始まり3月終わり。過去年度は月平均1列にまとめ、
        当年度分は月別のまま表示する。年度平均の列は、その列の
        ボタンから個別に月別展開／折りたたみができる）
    ===================================================== */
    let expandedFYs = new Set(); // 個別に「月別展開」した過去年度の集合

    function fiscalYearOf(monthStr) {
      const [y, m] = monthStr.split("-").map(Number);
      return m >= 4 ? y : y - 1;
    }

    function currentFiscalYear() {
      const now = new Date();
      const m = now.getMonth() + 1;
      return m >= 4 ? now.getFullYear() : now.getFullYear() - 1;
    }

    // 進行中の当月（例：9月の途中）は日数がそろっていないため、
    // 右端の「今年度平均」列の計算対象から除外する
    function currentMonthStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    }

    // 「今年度平均」の対象月：当年度（4月〜）のうち、進行中の当月を除いた月
    // （絞り込み表示の状態に関わらず、常にその表の全期間データから当年度実績で計算する）
    function averageMonths(sourceMonths) {
      const curFY     = currentFiscalYear();
      const currentMo = currentMonthStr();
      return (sourceMonths ?? []).filter(m => fiscalYearOf(m) === curFY && m !== currentMo);
    }

    // 現在のデータに含まれる「当年度より前」の年度一覧
    function allPastFiscalYears(sourceMonths) {
      const curFY = currentFiscalYear();
      return [...new Set((sourceMonths ?? []).map(fiscalYearOf))].filter(fy => fy < curFY).sort((a, b) => a - b);
    }

    function buildColumns(months, expandedFYs) {
      const curFY = currentFiscalYear();
      const byFY = new Map();
      months.forEach(m => {
        const fy = fiscalYearOf(m);
        if (!byFY.has(fy)) byFY.set(fy, []);
        byFY.get(fy).push(m);
      });
      const columns = [];
      [...byFY.keys()].sort((a, b) => a - b).forEach(fy => {
        const fyMonths = byFY.get(fy);
        const isCurrent = fy === curFY;
        if (!isCurrent && !expandedFYs.has(fy)) {
          columns.push({ type: "fy-avg", key: "fy" + fy, fy, months: fyMonths });
        } else {
          fyMonths.forEach((m, i) => columns.push({
            type: "month", key: m, month: m, fy,
            // 手動で展開した年度だけ、先頭月に「折りたたむ」ボタンを出す
            collapsible: !isCurrent && i === 0,
          }));
        }
      });
      return columns;
    }

    function columnLabel(col) {
      const t = dict[currentLang];
      return col.type === "month" ? col.month.slice(2).replace("-", "/") : t.fyLabel(col.fy);
    }

    function columnValue(row, col) {
      if (col.type === "month") return row.values[col.month] ?? 0;
      const sum = col.months.reduce((s, m) => s + (row.values[m] ?? 0), 0);
      // データが揃っていない年度（先頭・末尾の端や、年度絞り込みで一部月だけの
      // 表示になっている場合）でも実態に合うよう、常に12ではなく実際の月数で割る
      return sum / (col.months.length || 1);
    }

    // 年度平均の列見出しについている「▸ 月別に展開」ボタン、
    // または展開済み年度の先頭月についている「▾ 折りたたむ」ボタン
    function toggleFY(fy) {
      if (expandedFYs.has(fy)) expandedFYs.delete(fy); else expandedFYs.add(fy);
      syncExpandState();
      if (rawData) renderAll(rawData);
      if (cutRawData) renderCutSection();
      if (goodRawData) renderGoodSection();
    }

    // 年度絞り込みドロップダウンの有効/無効、ツールバーボタンの文言を
    // 現在の展開状況に合わせて更新する
    function syncExpandState() {
      const t        = dict[currentLang];
      const pastFYs  = allPastFiscalYears(rawData?.months);
      const anyExpanded = expandedFYs.size > 0;
      const allExpanded = pastFYs.length > 0 && pastFYs.every(fy => expandedFYs.has(fy));

      const yearSel = document.getElementById("yearFilter");
      const yearRow = document.getElementById("yearFilterRow");
      yearSel.disabled = !anyExpanded;
      yearRow.classList.toggle("is-disabled", !anyExpanded);
      if (!anyExpanded) yearSel.value = "";

      document.getElementById("btnToggleView").textContent = allExpanded ? t.btn_collapse : t.btn_expand;
    }

    function updateToggleButtonLabel() { syncExpandState(); }

    // ツールバーの「月別に展開」：全年度をまとめて展開／折りたたみ
    function toggleView() {
      const pastFYs     = allPastFiscalYears(rawData?.months);
      const allExpanded = pastFYs.length > 0 && pastFYs.every(fy => expandedFYs.has(fy));
      if (allExpanded) {
        expandedFYs.clear();
      } else {
        pastFYs.forEach(fy => expandedFYs.add(fy));
      }
      syncExpandState();
      if (rawData) renderAll(rawData);
      if (cutRawData) renderCutSection();
      if (goodRawData) renderGoodSection();
    }

    /* =====================================================
       描画
    ===================================================== */
    function renderAll(data) {
      const months  = filteredMonths();
      const columns = buildColumns(months, expandedFYs);
      renderTable(data, months, columns);
      renderChart(data, columns);
    }

    function renderCutSection() {
      const months  = filteredMonths(cutRawData.months);
      const columns = buildColumns(months, expandedFYs);
      renderTwoLevelTable(cutRawData, months, columns, "cutHead", "cutBody");
      renderTypeOnlyChart(cutRawData, columns, "cutChart", "cut");
    }

    function renderGoodSection() {
      const months  = filteredMonths(goodRawData.months);
      const columns = buildColumns(months, expandedFYs);
      renderTwoLevelTable(goodRawData, months, columns, "goodHead", "goodBody");
      renderTypeOnlyChart(goodRawData, columns, "goodChart", "good");
    }

    function fmtWeight(v) {
      return v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    // 年度平均列は「▸ 月別に展開」ボタン、手動展開した年度の先頭月は
    // 「▾ 折りたたむ」ボタンを見出しに添える
    function columnHeaderHtml(col) {
      const t = dict[currentLang];
      if (col.type === "fy-avg") {
        return `<th class="col-fyavg">` +
          `<button type="button" class="fy-toggle-btn" onclick="toggleFY(${col.fy})" title="${t.title_expand}">▸</button> ` +
          `${columnLabel(col)}</th>`;
      }
      if (col.collapsible) {
        return `<th>` +
          `<button type="button" class="fy-toggle-btn" onclick="toggleFY(${col.fy})" title="${t.title_collapse}">▾</button> ` +
          `${columnLabel(col)}</th>`;
      }
      return `<th>${columnLabel(col)}</th>`;
    }

    function renderTable(data, months, columns) {
      const t = dict[currentLang];

      // ヘッダー
      const head = document.getElementById("qtyHead");
      head.innerHTML =
        `<th class="label-col col-type">${t.col_type}</th>` +
        `<th class="label-col col-size">${t.col_size}</th>` +
        `<th class="label-col col-mfg">${t.col_mfg}</th>`;
      columns.forEach(col => { head.innerHTML += columnHeaderHtml(col); });
      head.innerHTML += `<th title="${t.title_avg_excl_current}">${t.col_total}</th>`;

      // 行（押出種別 → ビレットサイズ → MFG の順に既にソート済み）
      const body = document.getElementById("qtyBody");
      body.innerHTML = "";

      // 右端の「今年度平均」列：当年度（4月〜、進行中の当月を除く）の月平均
      const avgMonths = averageMonths(data.months);

      const colTotals = {};
      columns.forEach(col => colTotals[col.key] = 0);
      let grandAvgTotal = 0;

      let prevType = null, prevSize = null;

      data.rows.forEach(row => {
        const tr = document.createElement("tr");
        let cells = "";

        const typeChanged = row.pressingTypeId !== prevType;
        const sizeChanged  = typeChanged || row.billetSize !== prevSize;

        cells += `<td class="label-col col-type">${typeChanged ? (t.typeLabel[row.pressingTypeId] ?? row.pressingType ?? "-") : ""}</td>`;
        cells += `<td class="label-col col-size">${sizeChanged ? "φ" + row.billetSize : ""}</td>`;
        cells += `<td class="label-col col-mfg">${t.mfgLabel[row.mfg] ?? row.mfg}</td>`;

        prevType = row.pressingTypeId;
        prevSize = row.billetSize;

        columns.forEach(col => {
          const v = columnValue(row, col);
          colTotals[col.key] += v;
          cells += `<td class="mono${col.type === "fy-avg" ? " col-fyavg" : ""}">${v > 0 ? fmtWeight(v) : ""}</td>`;
        });

        const rowAvgTotal = avgMonths.reduce((s, m) => s + (row.values[m] ?? 0), 0);
        const rowAvg = rowAvgTotal / (avgMonths.length || 1);
        grandAvgTotal += rowAvgTotal;
        cells += `<td class="total-col">${fmtWeight(rowAvg)}</td>`;

        tr.innerHTML = cells;
        body.appendChild(tr);
      });

      // 合計行
      const sumTr = document.createElement("tr");
      sumTr.className = "sum-row";
      let sumCells = `<td class="label-col" colspan="3">${t.sum_row}</td>`;
      columns.forEach(col => {
        const v = colTotals[col.key];
        sumCells += `<td${col.type === "fy-avg" ? ' class="col-fyavg"' : ""}>${v > 0 ? fmtWeight(v) : ""}</td>`;
      });
      const grandAvg = grandAvgTotal / (avgMonths.length || 1);
      sumCells += `<td class="total-col">${fmtWeight(grandAvg)}</td>`;
      sumTr.innerHTML = sumCells;
      body.appendChild(sumTr);
    }

    /* =====================================================
       切断重量テーブル（押出種別 → ビレットサイズ、MFG区分なし）
    ===================================================== */
    function renderTwoLevelTable(data, months, columns, headId, bodyId) {
      const t = dict[currentLang];

      const head = document.getElementById(headId);
      head.innerHTML =
        `<th class="label-col col-type">${t.col_type}</th>` +
        `<th class="label-col col-size">${t.col_size}</th>`;
      columns.forEach(col => { head.innerHTML += columnHeaderHtml(col); });
      head.innerHTML += `<th title="${t.title_avg_excl_current}">${t.col_total}</th>`;

      const body = document.getElementById(bodyId);
      body.innerHTML = "";

      // 右端の「今年度平均」列：当年度（4月〜、進行中の当月を除く）の月平均
      const avgMonths = averageMonths(data.months);

      const colTotals = {};
      columns.forEach(col => colTotals[col.key] = 0);
      let grandAvgTotal = 0;

      let prevType = null;

      data.rows.forEach(row => {
        const tr = document.createElement("tr");
        let cells = "";

        const typeChanged = row.pressingTypeId !== prevType;
        cells += `<td class="label-col col-type">${typeChanged ? (t.typeLabel[row.pressingTypeId] ?? row.pressingType ?? "-") : ""}</td>`;
        cells += `<td class="label-col col-size">φ${row.billetSize}</td>`;
        prevType = row.pressingTypeId;

        columns.forEach(col => {
          const v = columnValue(row, col);
          colTotals[col.key] += v;
          cells += `<td class="mono${col.type === "fy-avg" ? " col-fyavg" : ""}">${v > 0 ? fmtWeight(v) : ""}</td>`;
        });

        const rowAvgTotal = avgMonths.reduce((s, m) => s + (row.values[m] ?? 0), 0);
        const rowAvg = rowAvgTotal / (avgMonths.length || 1);
        grandAvgTotal += rowAvgTotal;
        cells += `<td class="total-col">${fmtWeight(rowAvg)}</td>`;

        tr.innerHTML = cells;
        body.appendChild(tr);
      });

      const sumTr = document.createElement("tr");
      sumTr.className = "sum-row";
      let sumCells = `<td class="label-col" colspan="2">${t.sum_row}</td>`;
      columns.forEach(col => {
        const v = colTotals[col.key];
        sumCells += `<td${col.type === "fy-avg" ? ' class="col-fyavg"' : ""}>${v > 0 ? fmtWeight(v) : ""}</td>`;
      });
      const grandAvg = grandAvgTotal / (avgMonths.length || 1);
      sumCells += `<td class="total-col">${fmtWeight(grandAvg)}</td>`;
      sumTr.innerHTML = sumCells;
      body.appendChild(sumTr);
    }

    /* =====================================================
       グラフ（押出種別ごとの積み上げ棒）
    ===================================================== */
    let chartInstance = null;

    function renderChart(data, columns) {
      const t      = dict[currentLang];
      const labels = columns.map(col => columnLabel(col));

      let datasets;
      if (chartMode === "mfg") {
        const mfgIds = [...new Set(data.rows.map(r => r.mfg))].sort((a, b) => a - b);
        datasets = mfgIds.map(mfgId => {
          const rowsOfMfg = data.rows.filter(r => r.mfg === mfgId);
          return {
            label:           t.mfgLabel[mfgId] ?? String(mfgId),
            data:            columns.map(col => rowsOfMfg.reduce((s, r) => s + columnValue(r, col), 0)),
            backgroundColor: (MFG_COLORS[mfgId] ?? "#999") + "bb",
            borderColor:     MFG_COLORS[mfgId] ?? "#999",
            borderWidth:     1,
            stack:           "qty",
          };
        });
      } else {
        const typeIds = [...new Set(data.rows.map(r => r.pressingTypeId))];
        datasets = typeIds.map(typeId => {
          const rowsOfType = data.rows.filter(r => r.pressingTypeId === typeId);
          return {
            label:           t.typeLabel[typeId] ?? String(typeId),
            data:            columns.map(col => rowsOfType.reduce((s, r) => s + columnValue(r, col), 0)),
            backgroundColor: (TYPE_COLORS[typeId] ?? "#999") + "bb",
            borderColor:     TYPE_COLORS[typeId] ?? "#999",
            borderWidth:     1,
            stack:           "qty",
          };
        });
      }

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById("myChart"), {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: { legend: { position: "top" } },
          scales: {
            y: { beginAtZero: true, stacked: true, title: { display: true, text: "重量 (t)" } },
            x: { stacked: true },
          },
        },
      });
    }

    /* =====================================================
       グラフ（切断重量・良品重量、押出種別ごとの積み上げ棒）
    ===================================================== */
    const typeOnlyChartInstances = {};

    function renderTypeOnlyChart(data, columns, canvasId, stackKey) {
      const t      = dict[currentLang];
      const labels = columns.map(col => columnLabel(col));
      const typeIds = [...new Set(data.rows.map(r => r.pressingTypeId))];

      const datasets = typeIds.map(typeId => {
        const rowsOfType = data.rows.filter(r => r.pressingTypeId === typeId);
        return {
          label:           t.typeLabel[typeId] ?? String(typeId),
          data:            columns.map(col => rowsOfType.reduce((s, r) => s + columnValue(r, col), 0)),
          backgroundColor: (TYPE_COLORS[typeId] ?? "#999") + "bb",
          borderColor:     TYPE_COLORS[typeId] ?? "#999",
          borderWidth:     1,
          stack:           stackKey,
        };
      });

      if (typeOnlyChartInstances[canvasId]) typeOnlyChartInstances[canvasId].destroy();
      typeOnlyChartInstances[canvasId] = new Chart(document.getElementById(canvasId), {
        type: "bar",
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: { legend: { position: "top" } },
          scales: {
            y: { beginAtZero: true, stacked: true, title: { display: true, text: "重量 (t)" } },
            x: { stacked: true },
          },
        },
      });
    }

    /* =====================================================
       CSV出力
    ===================================================== */
    function exportCSV() {
      const t         = dict[currentLang];
      const months    = filteredMonths();
      const avgMonths = averageMonths(rawData.months);
      const header = [t.col_type, t.col_size, t.col_mfg, ...months.map(m => m.slice(2).replace("-","/")), t.col_total];
      const escape = v => `"${String(v).replace(/"/g,'""')}"`;
      const lines  = [header.map(escape).join(",")];

      rawData.rows.forEach(row => {
        const vals = months.map(m => (row.values[m] ?? 0).toFixed(1));
        const avgTotal = avgMonths.reduce((s, m) => s + (row.values[m] ?? 0), 0);
        const avg = avgTotal / (avgMonths.length || 1);
        lines.push([
          t.typeLabel[row.pressingTypeId] ?? row.pressingType ?? "-",
          `φ${row.billetSize}`,
          t.mfgLabel[row.mfg] ?? row.mfg,
          ...vals,
          avg.toFixed(1),
        ].map(escape).join(","));
      });

      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = `押出重量実績_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function exportTwoLevelCSV(data, filenamePrefix) {
      const t         = dict[currentLang];
      const months    = filteredMonths(data.months);
      const avgMonths = averageMonths(data.months);
      const header = [t.col_type, t.col_size, ...months.map(m => m.slice(2).replace("-","/")), t.col_total];
      const escape = v => `"${String(v).replace(/"/g,'""')}"`;
      const lines  = [header.map(escape).join(",")];

      data.rows.forEach(row => {
        const vals = months.map(m => (row.values[m] ?? 0).toFixed(1));
        const avgTotal = avgMonths.reduce((s, m) => s + (row.values[m] ?? 0), 0);
        const avg = avgTotal / (avgMonths.length || 1);
        lines.push([
          t.typeLabel[row.pressingTypeId] ?? row.pressingType ?? "-",
          `φ${row.billetSize}`,
          ...vals,
          avg.toFixed(1),
        ].map(escape).join(","));
      });

      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = `${filenamePrefix}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function exportCutCSV()  { exportTwoLevelCSV(cutRawData, "切断重量実績"); }
    function exportGoodCSV() { exportTwoLevelCSV(goodRawData, "良品重量実績"); }

    function sizeLabel(billetSize) {
      const unit = currentLang === "vi" ? " inch" : "インチ";
      return `${billetSize}${unit}`;
    }

    function exportCombinedCSV() {
      const t = dict[currentLang];
      const allMonths = [...new Set([
        ...(rawData?.months ?? []),
        ...(cutRawData?.months ?? []),
        ...(goodRawData?.months ?? []),
      ])].sort();
      const months  = filteredMonths(allMonths);
      const columns = buildColumns(months, expandedFYs);

      const header = [
        t.col_category, t.col_type, t.col_size, t.col_mfg,
        ...columns.map(columnLabel), t.col_total,
      ];
      const escape = v => `"${String(v).replace(/"/g, '""')}"`;
      const lines  = [header.map(escape).join(",")];

      function pushRows(data, categoryLabel, mfgLabelFor) {
        if (!data) return;
        const avgMonths = averageMonths(data.months);
        data.rows.forEach(row => {
          const cells     = columns.map(col => columnValue(row, col).toFixed(1));
          const avgTotal  = avgMonths.reduce((s, m) => s + (row.values[m] ?? 0), 0);
          const avg       = avgTotal / (avgMonths.length || 1);
          lines.push([
            categoryLabel,
            t.typeLabel[row.pressingTypeId] ?? row.pressingType ?? "-",
            sizeLabel(row.billetSize),
            mfgLabelFor ? (t.mfgLabel[row.mfg] ?? row.mfg) : "",
            ...cells,
            avg.toFixed(1),
          ].map(escape).join(","));
        });
      }

      pushRows(rawData,     t.cat_input, true);
      pushRows(cutRawData,  t.cat_cut,   false);
      pushRows(goodRawData, t.cat_good,  false);

      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = `押出実績_統合_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function buildSheetAOA(data, hasMfg, months, columns, t) {
      const header = [t.col_type, t.col_size];
      if (hasMfg) header.push(t.col_mfg);
      header.push(...columns.map(columnLabel), t.col_total);
      const aoa = [header];

      const avgMonths = averageMonths(data.months);
      data.rows.forEach(row => {
        const rowArr = [t.typeLabel[row.pressingTypeId] ?? row.pressingType ?? "-", sizeLabel(row.billetSize)];
        if (hasMfg) rowArr.push(t.mfgLabel[row.mfg] ?? row.mfg);
        columns.forEach(col => rowArr.push(Number(columnValue(row, col).toFixed(1))));
        const avgTotal = avgMonths.reduce((s, m) => s + (row.values[m] ?? 0), 0);
        const avg = avgTotal / (avgMonths.length || 1);
        rowArr.push(Number(avg.toFixed(1)));
        aoa.push(rowArr);
      });
      return aoa;
    }

    function exportExcel() {
      const t  = dict[currentLang];
      const wb = XLSX.utils.book_new();

      [
        [rawData,     true,  t.cat_input],
        [cutRawData,  false, t.cat_cut],
        [goodRawData, false, t.cat_good],
      ].forEach(([data, hasMfg, sheetName]) => {
        if (!data) return;
        const months  = filteredMonths(data.months);
        const columns = buildColumns(months, expandedFYs);
        const aoa     = buildSheetAOA(data, hasMfg, months, columns, t);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheetName);
      });

      XLSX.writeFile(wb, `押出実績_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    /* =====================================================
       初期化
    ===================================================== */
    window.onload = async () => {
      setLang(currentLang);
      document.getElementById("yearFilter").disabled = true;
      document.getElementById("yearFilterRow").classList.add("is-disabled");
      await Promise.all([loadData(), loadCutData(), loadGoodData()]);
    };
  </script>
</body>
