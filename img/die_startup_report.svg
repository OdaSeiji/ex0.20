  <!-- 移管数ー到着数 の線と点（棒と重なっても見えるよう白いふちを付ける） -->
  <path d="M3 15.5 C 7 19, 9 13, 12 9.5 S 17 7, 21 3.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
  <path d="M3 15.5 C 7 19, 9 13, 12 9.5 S 17 7, 21 3.5" fill="none" stroke="#2b6ca3" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="3" cy="15.5" r="1.9" fill="#fff" /><circle cx="3" cy="15.5" r="1.3" />
  <circle cx="12" cy="9.5" r="1.9" fill="#fff" /><circle cx="12" cy="9.5" r="1.3" />
  <circle cx="21" cy="3.5" r="1.9" fill="#fff" /><circle cx="21" cy="3.5" r="1.3" />
  <!-- 床の線 -->
  <rect x="1.2" y="21" width="21.6" height="1.1" rx="0.4" />
