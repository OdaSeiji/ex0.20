  <rect x="2" y="9" width="1.8" height="11.5" rx="0.4" />
  <rect x="4.1" y="14" width="1.8" height="6.5" rx="0.4" opacity="0.55" />
  <rect x="6.2" y="12" width="1.8" height="8.5" rx="0.4" opacity="0.3" />
  <!-- 2つ目の月 -->
  <rect x="9" y="13" width="1.8" height="7.5" rx="0.4" />
  <rect x="11.1" y="11" width="1.8" height="9.5" rx="0.4" opacity="0.55" />
  <rect x="13.2" y="7" width="1.8" height="13.5" rx="0.4" opacity="0.3" />
  <!-- 3つ目の月 -->
  <rect x="16" y="15" width="1.8" height="5.5" rx="0.4" />
  <rect x="18.1" y="12.5" width="1.8" height="8" rx="0.4" opacity="0.55" />
