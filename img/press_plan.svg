<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 押出計画（press_plan.html）：1日の予定表の紙。左に時刻（8・12・16・20 時）、右に号機ごとの色の予定（2026-11-24 ユーザーが選んだ案） -->
  <rect x="3" y="1.5" width="18" height="21" rx="1.6" fill="#fff" stroke="#2b6ca3" stroke-width="1.3"/>
  <!-- 時刻と目盛りの線 -->
  <text x="6.3" y="7.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3" font-weight="bold" fill="#2b6ca3">8</text>
  <line x1="9" y1="6.2" x2="20" y2="6.2" stroke="#9fbcd8" stroke-width="0.6"/>
  <text x="6.3" y="11.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3" font-weight="bold" fill="#2b6ca3">12</text>
  <line x1="9" y1="10.6" x2="20" y2="10.6" stroke="#9fbcd8" stroke-width="0.6"/>
  <text x="6.3" y="16.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3" font-weight="bold" fill="#2b6ca3">16</text>
  <line x1="9" y1="15.0" x2="20" y2="15.0" stroke="#9fbcd8" stroke-width="0.6"/>
  <text x="6.3" y="20.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="3" font-weight="bold" fill="#2b6ca3">20</text>
  <line x1="9" y1="19.4" x2="20" y2="19.4" stroke="#9fbcd8" stroke-width="0.6"/>
  <!-- 予定（青＝1号機、緑＝2号機、オレンジ＝3号機。薄いのは次の金型） -->
  <rect x="10" y="4.6" width="3.2" height="7.6" rx="0.8" fill="#1565c0"/>
  <rect x="13.8" y="7.2" width="3.2" height="9" rx="0.8" fill="#2e7d32"/>
  <rect x="17.6" y="5.6" width="2.4" height="6" rx="0.8" fill="#ef6c00"/>
  <rect x="10" y="13.4" width="3.2" height="6.8" rx="0.8" fill="#1565c0" opacity="0.6"/>
  <rect x="17.6" y="12.6" width="2.4" height="8.2" rx="0.8" fill="#ef6c00" opacity="0.6"/>
</svg>
