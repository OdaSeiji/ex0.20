<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Machine Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }

    .lang-buttons { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .lang-buttons button {
      padding: 6px 12px; margin-left: 5px; border: 1px solid #0078d4;
      background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .lang-buttons button.active { background: #0078d4; color: #fff; }

    h1 { font-size: 22px; margin-bottom: 6px; border-left: 6px solid #0078d4; padding-left: 10px; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 18px; padding-left: 16px; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn { padding: 7px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-back { background: #546e7a; color: #fff; }
    .btn-csv  { background: #217346; color: #fff; }
    .btn-toggle { background: #8e5ec7; color: #fff; }

    .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; transition: opacity .2s; }
    .filter-row.is-disabled { opacity: 0.45; }
    .filter-row label { font-size: 13px; color: #555; }
    .filter-row select { padding: 5px 10px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px; }

    /* テーブル共通 */
    .section-title {
      font-size: 15px; font-weight: bold; color: #2b6ca3;
      margin: 24px 0 8px; padding-left: 8px;
      border-left: 4px solid #0078d4;
    }
    .table-wrap {
      background: #fff; border-radius: 8px; overflow-x: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 8px;
    }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 11px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; text-align: right; }
    th { background: #e8f1ff; text-align: center; font-size: 11px; position: sticky; top: 0; }
    td.label-col { text-align: left; font-weight: bold; min-width: 80px; background: #f5f5f5; position: sticky; left: 0; font-family: "Roboto Mono", monospace; }
    td.total-col { font-weight: bold; background: #e8f5e9; color: #2e7d32; }
    th.col-fyavg, td.col-fyavg { background: #fff8e1; }
    tr.sum-row td.col-fyavg { background: #ffecb3; }
    .fy-toggle-btn {
      border: none; background: transparent; color: #8e5ec7; cursor: pointer;
      font-size: 12px; font-weight: bold; padding: 0 2px; vertical-align: middle;
    }
    .fy-toggle-btn:hover { text-decoration: underline; }
    tr.sum-row td { background: #e3f2fd; font-weight: bold; color: #1565c0; }
    tr.sum-row td.label-col { background: #bbdefb; }
    tr:hover td { background: #f0f8ff; }
    tr:hover td.label-col { background: #e8f1ff; }
    tr.sum-row:hover td { background: #bbdefb; }
    td.mono { font-family: "Roboto Mono", monospace; }

    /* グラフ */
    .chart-wrap {
      background: #fff; border-radius: 8px; padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-top: 28px;
    }
    .chart-title { font-size: 15px; font-weight: bold; color: #2b6ca3; margin-bottom: 14px; }
    canvas { max-height: 360px; }
  </style>
</head>
<body>
  <div class="lang-buttons">
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
    <button id="btnVi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>

  <h1 data-key="title">🏭 設備稼働 実績レポート</h1>
  <div class="subtitle" data-key="subtitle">設備番号別・月別：稼働時間 / 押出回数</div>

  <div class="toolbar">
    <button class="btn btn-back" onclick="location.href='index.html'" data-key="btn_back">← 戻る</button>
    <button class="btn btn-csv"  onclick="exportCSV()" data-key="btn_csv">📥 CSV出力</button>
    <button class="btn btn-toggle" id="btnToggleView" onclick="toggleView()">📆 月別に展開</button>
  </div>

  <div class="filter-row is-disabled" id="yearFilterRow">
    <label data-key="label_year">年度絞り込み：</label>
    <select id="yearFilter" onchange="applyFilter()" disabled>
      <option value="" data-key="opt_all">全期間</option>
    </select>
  </div>

  <div class="section-title" data-key="sec_hours">⏱ 稼働時間（時間）</div>
  <div class="table-wrap">
    <table id="hoursTable">
      <thead><tr id="hoursHead"></tr></thead>
      <tbody id="hoursBody"></tbody>
    </table>
  </div>

  <div class="section-title" data-key="sec_extrusion">⚖️ ビレット投入量（t）</div>
  <div class="table-wrap">
    <table id="extrusionTable">
      <thead><tr id="extrusionHead"></tr></thead>
      <tbody id="extrusionBody"></tbody>
    </table>
  </div>

  <div class="section-title" data-key="sec_counts">🔢 押出回数</div>
  <div class="table-wrap">
    <table id="countsTable">
      <thead><tr id="countsHead"></tr></thead>
      <tbody id="countsBody"></tbody>
    </table>
  </div>

  <div class="chart-wrap">
    <div class="chart-title" data-key="chart_title">📈 設備別稼働時間（積み上げ）＋ 押出回数</div>
    <canvas id="myChart"></canvas>
  </div>

  <script>
    /* =====================================================
       多言語
    ===================================================== */
    const dict = {
      ja: {
        title:      "🏭 設備稼働 実績レポート",
        subtitle:   "設備番号別・月別：稼働時間 / 押出回数",
        btn_back:   "← 戻る",
        btn_csv:    "📥 CSV出力",
        label_year: "年度絞り込み：",
        opt_all:    "全期間",
        sec_hours:      "⏱ 稼働時間（時間）",
        sec_extrusion:  "⚖️ ビレット投入量（t）",
        sec_counts:     "🔢 押出回数",
        chart_title:"📈 設備別稼働時間（積み上げ）＋ ビレット投入量 / 良品量",
        col_total:  "今年度平均",
        fyLabel:    fy => `${String(fy % 100).padStart(2, "0")}年度(月平均)`,
        btn_expand:   "📆 月別に展開",
        btn_collapse: "📅 年度平均で表示",
        title_expand:   "この年度を月別に展開",
        title_collapse: "この年度を月平均に戻す",
        title_avg_excl_current: "当年度(4月〜)の月平均。進行中の当月は除く",
        machine:    n => `設備${n}`,
        sum_row:    "合計",
        count_line: "ビレット投入量 t（合計）",
        good_line:  "良品量 t（合計）",
      },
      vi: {
        title:      "🏭 Báo cáo hoạt động máy",
        subtitle:   "Theo máy & tháng：Giờ hoạt động / Số lần ép",
        btn_back:   "← Quay lại",
        btn_csv:    "📥 Xuất CSV",
        label_year: "Lọc theo năm：",
        opt_all:    "Tất cả",
        sec_hours:      "⏱ Giờ hoạt động",
        sec_extrusion:  "⚖️ Lượng phôi nạp（t）",
        sec_counts:     "🔢 Số lần ép",
        chart_title:"📈 Giờ HĐ theo máy（tích lũy）＋ Lượng phôi nạp / SP tốt",
        col_total:  "TB năm nay",
        fyLabel:    fy => `Năm ${String(fy % 100).padStart(2, "0")}(TB tháng)`,
        btn_expand:   "📆 Xem theo tháng",
        btn_collapse: "📅 Xem TB năm",
        title_expand:   "Xem chi tiết theo tháng của năm này",
        title_collapse: "Quay lại TB tháng của năm này",
        title_avg_excl_current: "TB tháng của năm tài chính hiện tại (từ tháng 4), không tính tháng hiện tại",
        machine:    n => `Máy ${n}`,
        sum_row:    "Tổng",
        count_line: "Lượng phôi nạp t（tổng）",
        good_line:  "SL SP tốt t（tổng）",
      },
    };

    let currentLang = localStorage.getItem("lang") || "ja";

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-key]").forEach(el => {
        const val = dict[lang][el.dataset.key];
        if (val && typeof val === "string") el.textContent = val;
      });
      document.getElementById("btnJa").classList.toggle("active", lang === "ja");
      document.getElementById("btnVi").classList.toggle("active", lang === "vi");
      if (rawData) syncExpandState();
      if (rawData) renderAll(rawData);
    }

    /* =====================================================
       データ
    ===================================================== */
    let rawData = null;

    // 設備ごとの色（最大10設備想定）
    const PALETTE = [
      "#1976d2","#2e7d32","#f57c00","#7b1fa2",
      "#00838f","#c62828","#4e342e","#37474f","#558b2f","#ad1457"
    ];

    async function loadData() {
      const res = await fetch("./php/report_php/get_machine_monthly.php");
      rawData = await res.json();
      buildYearFilter(rawData.months);
      syncExpandState();
      renderAll(rawData);
    }

    /* =====================================================
       年度フィルタ
    ===================================================== */
    function buildYearFilter(months) {
      const years = [...new Set(months.map(m => m.slice(0, 4)))].sort();
      const sel   = document.getElementById("yearFilter");
      years.forEach(y => {
        const opt = document.createElement("option");
        opt.value = y; opt.textContent = y;
        sel.appendChild(opt);
      });
    }

    function applyFilter() { if (rawData) renderAll(rawData); }

    function filteredMonths() {
      const y = document.getElementById("yearFilter").value;
      return y ? rawData.months.filter(m => m.startsWith(y)) : rawData.months;
    }

    /* =====================================================
       年度平均表示 ⇔ 月別表示
       （年度は4月始まり3月終わり。過去年度は月平均1列にまとめ、
        当年度分は月別のまま表示する。年度平均の列は、その列の
        ボタンから個別に月別展開／折りたたみができる）
    ===================================================== */
    let expandedFYs = new Set(); // 個別に「月別展開」した過去年度の集合

    function fiscalYearOf(monthStr) {
      const [y, m] = monthStr.split("-").map(Number);
      return m >= 4 ? y : y - 1;
    }

    function currentFiscalYear() {
      const now = new Date();
      const m = now.getMonth() + 1;
      return m >= 4 ? now.getFullYear() : now.getFullYear() - 1;
    }

    // 進行中の当月（例：9月の途中）は日数がそろっていないため、
    // 右端の「今年度平均」列の計算対象から除外する
    function currentMonthStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    }

    // 「今年度平均」の対象月：当年度（4月〜）のうち、進行中の当月を除いた月
    // （絞り込み表示の状態に関わらず、常にrawData全体の当年度実績で計算する）
    function averageMonths() {
      if (!rawData) return [];
      const curFY     = currentFiscalYear();
      const currentMo = currentMonthStr();
      return rawData.months.filter(m => fiscalYearOf(m) === curFY && m !== currentMo);
    }

    // 現在のデータに含まれる「当年度より前」の年度一覧（全体・フィルタ前提）
    function allPastFiscalYears() {
      if (!rawData) return [];
      const curFY = currentFiscalYear();
      return [...new Set(rawData.months.map(fiscalYearOf))].filter(fy => fy < curFY).sort((a, b) => a - b);
    }

    function buildColumns(months, expandedFYs) {
      const curFY = currentFiscalYear();
      const byFY = new Map();
      months.forEach(m => {
        const fy = fiscalYearOf(m);
        if (!byFY.has(fy)) byFY.set(fy, []);
        byFY.get(fy).push(m);
      });
      const columns = [];
      [...byFY.keys()].sort((a, b) => a - b).forEach(fy => {
        const fyMonths = byFY.get(fy);
        const isCurrent = fy === curFY;
        if (!isCurrent && !expandedFYs.has(fy)) {
          columns.push({ type: "fy-avg", key: "fy" + fy, fy, months: fyMonths });
        } else {
          fyMonths.forEach((m, i) => columns.push({
            type: "month", key: m, month: m, fy,
            // 手動で展開した年度だけ、先頭月に「折りたたむ」ボタンを出す
            collapsible: !isCurrent && i === 0,
          }));
        }
      });
      return columns;
    }

    function columnLabel(col) {
      const t = dict[currentLang];
      return col.type === "month" ? col.month.slice(2).replace("-", "/") : t.fyLabel(col.fy);
    }

    function columnValue(mObj, col) {
      if (col.type === "month") return mObj[col.month] ?? 0;
      const sum = col.months.reduce((s, m) => s + (mObj[m] ?? 0), 0);
      // データが揃っていない年度（先頭・末尾の端や、年度絞り込みで一部月だけの
      // 表示になっている場合）でも実態に合うよう、常に12ではなく実際の月数で割る
      return sum / (col.months.length || 1);
    }

    // 年度平均の列見出しについている「▸ 月別に展開」ボタン、
    // または展開済み年度の先頭月についている「▾ 折りたたむ」ボタン
    function toggleFY(fy) {
      if (expandedFYs.has(fy)) expandedFYs.delete(fy); else expandedFYs.add(fy);
      syncExpandState();
      if (rawData) renderAll(rawData);
    }

    // 年度絞り込みドロップダウンの有効/無効、ツールバーボタンの文言を
    // 現在の展開状況に合わせて更新する
    function syncExpandState() {
      const t         = dict[currentLang];
      const pastFYs   = allPastFiscalYears();
      const anyExpanded  = expandedFYs.size > 0;
      const allExpanded  = pastFYs.length > 0 && pastFYs.every(fy => expandedFYs.has(fy));

      const yearSel = document.getElementById("yearFilter");
      const yearRow = document.getElementById("yearFilterRow");
      yearSel.disabled = !anyExpanded;
      yearRow.classList.toggle("is-disabled", !anyExpanded);
      if (!anyExpanded) yearSel.value = "";

      document.getElementById("btnToggleView").textContent = allExpanded ? t.btn_collapse : t.btn_expand;
    }

    // ツールバーの「月別に展開」：全年度をまとめて展開／折りたたみ
    function toggleView() {
      const pastFYs     = allPastFiscalYears();
      const allExpanded = pastFYs.length > 0 && pastFYs.every(fy => expandedFYs.has(fy));
      if (allExpanded) {
        expandedFYs.clear();
      } else {
        pastFYs.forEach(fy => expandedFYs.add(fy));
      }
      syncExpandState();
      if (rawData) renderAll(rawData);
    }

    /* =====================================================
       描画
    ===================================================== */
    function renderAll(data) {
      const months  = filteredMonths();
      const columns = buildColumns(months, expandedFYs);
      renderTable("hours",     data, months, columns);
      renderTable("extrusion", data, months, columns);
      renderTable("counts",    data, months, columns);
      renderChart(data, columns);
    }

    function renderTable(type, data, months, columns) {
      const t         = dict[currentLang];
      const isHours   = type === "hours";
      const isExtrus  = type === "extrusion";
      const dataObj   = isHours ? data.hours : isExtrus ? data.extrusions : data.counts;
      const headId    = type === "hours" ? "hoursHead" : type === "extrusion" ? "extrusionHead" : "countsHead";
      const bodyId    = type === "hours" ? "hoursBody" : type === "extrusion" ? "extrusionBody" : "countsBody";
      const isDecimal = isHours || isExtrus;

      // ヘッダー
      const head = document.getElementById(headId);
      head.innerHTML = `<th class="label-col">設備 / 年月</th>`;
      columns.forEach(col => {
        if (col.type === "fy-avg") {
          head.innerHTML += `<th class="col-fyavg">` +
            `<button type="button" class="fy-toggle-btn" onclick="toggleFY(${col.fy})" title="${t.title_expand}">▸</button> ` +
            `${columnLabel(col)}</th>`;
        } else if (col.collapsible) {
          head.innerHTML += `<th>` +
            `<button type="button" class="fy-toggle-btn" onclick="toggleFY(${col.fy})" title="${t.title_collapse}">▾</button> ` +
            `${columnLabel(col)}</th>`;
        } else {
          head.innerHTML += `<th>${columnLabel(col)}</th>`;
        }
      });
      head.innerHTML += `<th title="${t.title_avg_excl_current}">${t.col_total}</th>`;

      // 行
      const body = document.getElementById(bodyId);
      body.innerHTML = "";

      const avgMonths = averageMonths();

      const colTotals = {};
      months.forEach(m => colTotals[m] = 0);

      const decimals = isExtrus ? 0 : 1;
      const fmt    = (v) => isDecimal ? v.toFixed(decimals) : v;
      const avgFmt = (v) => v.toFixed(1);
      // 年度平均列は元の値が整数（押出回数）でも小数になるので、常に小数1桁で丸める
      const fmtCol = (v, col) => col.type === "fy-avg" ? avgFmt(v) : fmt(v);

      data.machines.forEach(mno => {
        const tr  = document.createElement("tr");
        const mObj = dataObj[mno] ?? {};
        let cells = `<td class="label-col">${t.machine(mno)}</td>`;

        columns.forEach(col => {
          const v = columnValue(mObj, col);
          cells += `<td class="mono${col.type === "fy-avg" ? " col-fyavg" : ""}">${v > 0 ? fmtCol(v, col) : ""}</td>`;
        });
        months.forEach(m => { colTotals[m] += mObj[m] ?? 0; });
        // 右端は表示中の実月（進行中の当月を除く）の月平均
        const rowAvgTotal = avgMonths.reduce((s, m) => s + (mObj[m] ?? 0), 0);
        const rowAvg = rowAvgTotal / (avgMonths.length || 1);
        cells += `<td class="total-col">${avgFmt(rowAvg)}</td>`;
        tr.innerHTML = cells;
        body.appendChild(tr);
      });

      // 合計行（設備横断の月合計 → その平均）
      const sumTr = document.createElement("tr");
      sumTr.className = "sum-row";
      let sumCells = `<td class="label-col">${t.sum_row}</td>`;
      columns.forEach(col => {
        const sum = col.type === "month"
          ? colTotals[col.month] ?? 0
          : col.months.reduce((s, m) => s + (colTotals[m] ?? 0), 0) / (col.months.length || 1);
        sumCells += `<td${col.type === "fy-avg" ? ' class="col-fyavg"' : ""}>${sum > 0 ? fmtCol(sum, col) : ""}</td>`;
      });
      const grandAvgTotal = avgMonths.reduce((s, m) => s + (colTotals[m] ?? 0), 0);
      const grandAvg = grandAvgTotal / (avgMonths.length || 1);
      sumCells += `<td class="total-col">${avgFmt(grandAvg)}</td>`;
      sumTr.innerHTML = sumCells;
      body.appendChild(sumTr);
    }

    /* =====================================================
       グラフ（積み上げ棒 + 折れ線）
    ===================================================== */
    let chartInstance = null;

    function renderChart(data, columns) {
      const t      = dict[currentLang];
      const labels = columns.map(columnLabel);

      // 積み上げ棒：設備別稼働時間
      const datasets = data.machines.map((mno, i) => {
        const mObj = data.hours[mno] ?? {};
        return {
          type:            "bar",
          label:           t.machine(mno),
          data:            columns.map(col => columnValue(mObj, col)),
          backgroundColor: PALETTE[i % PALETTE.length] + "bb",
          borderColor:     PALETTE[i % PALETTE.length],
          borderWidth:     1,
          stack:           "hours",
          yAxisID:         "y",
        };
      });

      // 折れ線：押出量合計（右軸）
      const extrusionTotals = columns.map(col =>
        Math.round(data.machines.reduce((sum, mno) => sum + columnValue(data.extrusions[mno] ?? {}, col), 0))
      );
      datasets.push({
        type:            "line",
        label:           t.count_line,
        data:            extrusionTotals,
        borderColor:     "#e53935",
        backgroundColor: "transparent",
        borderWidth:     2,
        pointRadius:     4,
        pointBackgroundColor: "#e53935",
        tension:         0.3,
        yAxisID:         "y2",
      });

      // 折れ線：良品量合計（右軸）
      const goodWeightTotals = columns.map(col =>
        Math.round(data.machines.reduce((sum, mno) => sum + columnValue(data.goodWeights[mno] ?? {}, col), 0) * 100) / 100
      );
      datasets.push({
        type:            "line",
        label:           t.good_line,
        data:            goodWeightTotals,
        borderColor:     "#43a047",
        backgroundColor: "transparent",
        borderWidth:     2,
        pointRadius:     4,
        pointBackgroundColor: "#43a047",
        tension:         0.3,
        yAxisID:         "y2",
      });

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(document.getElementById("myChart"), {
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: { legend: { position: "top" } },
          scales: {
            y: {
              type:     "linear",
              position: "left",
              stacked:  true,
              beginAtZero: true,
              title: { display: true, text: "稼働時間 (h)" },
            },
            y2: {
              type:     "linear",
              position: "right",
              beginAtZero: true,
              grid: { drawOnChartArea: false },
              title: { display: true, text: "重量 (t)" },
            },
          },
        },
      });
    }

    /* =====================================================
       CSV出力
    ===================================================== */
    function exportCSV() {
      const t         = dict[currentLang];
      const months    = filteredMonths();
      const avgMonths = averageMonths();
      const avgOf     = (mObj) => {
        const sum = avgMonths.reduce((s, m) => s + (mObj[m] ?? 0), 0);
        return sum / (avgMonths.length || 1);
      };
      const header = ["", ...months.map(m => m.slice(2).replace("-","/")), t.col_total];
      const escape = v => `"${String(v).replace(/"/g,'""')}"`;
      const lines  = [header.map(escape).join(",")];

      // 稼働時間
      lines.push([escape(t.sec_hours)].join(","));
      rawData.machines.forEach(mno => {
        const mObj = rawData.hours[mno] ?? {};
        const vals = months.map(m => (mObj[m] ?? 0).toFixed(1));
        lines.push([t.machine(mno), ...vals, avgOf(mObj).toFixed(1)].map(escape).join(","));
      });

      // 押出量
      lines.push([escape(t.sec_extrusion)].join(","));
      rawData.machines.forEach(mno => {
        const mObj = rawData.extrusions[mno] ?? {};
        const vals = months.map(m => Math.round(mObj[m] ?? 0));
        lines.push([t.machine(mno), ...vals, avgOf(mObj).toFixed(1)].map(escape).join(","));
      });

      // 押出回数
      lines.push([escape(t.sec_counts)].join(","));
      rawData.machines.forEach(mno => {
        const mObj = rawData.counts[mno] ?? {};
        const vals = months.map(m => mObj[m] ?? 0);
        lines.push([t.machine(mno), ...vals, avgOf(mObj).toFixed(1)].map(escape).join(","));
      });

      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a    = document.createElement("a");
      a.href     = URL.createObjectURL(blob);
      a.download = `設備稼働実績_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    /* =====================================================
       初期化
    ===================================================== */
    window.onload = async () => {
      setLang(currentLang);
      await loadData();
    };
  </script>
</body>
</html>
