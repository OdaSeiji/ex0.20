<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Press Directive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Roboto Mono", "Segoe UI", monospace;
        background: #f0f2f5;
        padding: 20px;
      }

      .container { max-width: 1200px; margin: 0 auto; }

      .page-header {
        background: #fff;
        border-radius: 10px;
        padding: 16px 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .back-btn {
        background: #2b6ca3; color: #fff;
        padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer;
        white-space: nowrap;
      }
      h1 { font-size: 20px; border-left: 6px solid #0078d4; padding-left: 10px; }
      .lang-wrap { margin-left: auto; display: flex; gap: 6px; }
      .lang-btn {
        padding: 6px 12px; border: 1px solid #0078d4;
        background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px;
      }

      .card {
        background: #fff;
        border-radius: 10px;
        padding: 18px 22px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        margin-bottom: 16px;
      }
      .card-title {
        font-size: 14px; font-weight: bold; color: #1565c0;
        margin-bottom: 12px; border-bottom: 2px solid #e8f1ff; padding-bottom: 8px;
        display: flex; align-items: center; gap: 8px;
      }
      .card-title .step-num {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; border-radius: 50%; background: #1565c0; color: #fff;
        font-size: 11px; flex-shrink: 0;
      }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 7px 10px; border-bottom: 1px solid #eee; text-align: left; }
      th { color: #777; font-size: 11px; }
      tr.selectable { cursor: pointer; }
      tr.selectable:hover td { background: #f7f9ff; }
      tr.selectable:focus { outline: 2px solid #1565c0; outline-offset: -2px; }
      tr.selected td { background: #e8f1ff; font-weight: bold; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }

      input[type="text"], input[type="date"], input[type="number"], select, textarea {
        padding: 7px 10px; border: 1px solid #ccc; border-radius: 5px;
        font-size: 13px; font-family: inherit; width: 100%;
      }
      textarea { resize: vertical; min-height: 44px; }

      /* 金型選択の1段バー(ex0.11のdie-set__wrapper相当): 各項目を罫線ボックス+左ラベルで区切る */
      .die-header-bar {
        padding: 4px 0; display: flex; flex-wrap: wrap; align-items: stretch; gap: 0;
      }
      .die-header-item {
        display: flex; flex-direction: row; align-items: center; gap: 8px;
        border: 1px solid #9fb8dd; background: #fff;
        padding: 6px 12px; margin: 2px; box-sizing: border-box;
      }
      .die-header-item.hb-die-number { width: 270px; }
      .die-header-item.hb-die-size { width: 160px; }
      .die-header-item.hb-product { width: 300px; }
      .die-header-item.hb-unit-weight { width: 150px; }
      .die-header-item.work-length { width: 170px; }
      .die-header-item .hb-label {
        font-size: 11px; color: #1565c0; font-weight: bold; white-space: nowrap;
      }
      .die-header-item .hb-value { font-size: 15px; font-weight: bold; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .die-header-item.hb-die-number .hb-value,
      .die-header-item.hb-die-number input,
      .die-header-item.hb-product .hb-value,
      .die-header-item.hb-product select { font-size: 17px; }
      .die-header-item.work-length .hb-value { font-size: 22px; color: #e65100; }
      .die-header-item.work-length .hb-value .unit { font-size: 12px; font-weight: normal; color: #777; }
      #productSelect { width: 100%; }
      #fPressingType, #fPressingType option { font-family: "MS Gothic", "ＭＳ ゴシック", monospace; }

      .die-search-wrap { position: relative; width: 100%; }
      .die-dropdown {
        position: absolute; top: 100%; left: 0; right: 0; background: #fff;
        border: 1px solid #ccc; border-radius: 5px; max-height: 200px; overflow-y: auto;
        z-index: 20; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      .die-dropdown.show { display: block; }
      .die-dropdown div { padding: 6px 10px; cursor: pointer; font-size: 13px; }
      .die-dropdown div:hover, .die-dropdown div.active { background: #e8f1ff; }

      .product-pick-note { font-size: 12px; color: #999; margin-top: 6px; }
      .product-pick-note.warn { color: #c62828; }

      /* 押出条件: card1と同じくラベル+input横並びのボックスを並べる */
      .form-grid { display: flex; flex-wrap: wrap; }
      .form-item {
        display: flex; flex-direction: column;
        border: 1px solid #e0c66a; background: #fff8e1;
        padding: 4px 8px; margin: 2px; box-sizing: border-box;
        transition: background 0.15s, border-color 0.15s;
      }
      .form-item.complete, .form-item.static { background: #fff; border-color: #ccc; }
      .form-item .fi-row { display: flex; flex-direction: row; align-items: center; gap: 6px; }
      .fi-label { font-size: 11px; font-weight: bold; color: #555; white-space: nowrap; }
      .fi-prev { display: block; font-size: 10px; color: #1565c0; white-space: nowrap; min-height: 12px; margin-top: 2px; }
      .form-item input, .form-item select {
        background: transparent; border: none; padding: 3px 2px; font-size: 13px; width: 62px;
      }
      .form-item select { width: auto; }
      .form-item.fw-date input { width: 118px; }
      .form-item.fw-wide select { min-width: 110px; }
      .form-item.full { width: 100%; }
      .form-item.full .fi-row { align-items: flex-start; }
      .form-item.full textarea {
        background: transparent; border: none; padding: 3px 2px; font-size: 13px; flex: 1; width: auto; min-height: 40px;
      }

      .btn-row { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
      .btn-save { background: #1565c0; color: #fff; padding: 9px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
      .btn-save:disabled { background: #90a4ae; cursor: default; }
      .btn-update { background: #e65100; color: #fff; padding: 9px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
      .btn-update:disabled { background: #90a4ae; cursor: default; }
      .btn-print { background: #2e7d32; color: #fff; padding: 9px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
      .btn-print:disabled { background: #90a4ae; cursor: default; }
      .btn-cancel { background: #9e9e9e; color: #fff; padding: 9px 20px; border: none; border-radius: 5px; cursor: pointer; }
      .edit-badge { background: #e65100; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; }
      .delete-hint { font-size: 12px; color: #999; }

      .empty-note { color: #999; text-align: center; padding: 16px; }

      #toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: #323232; color: #fff; padding: 10px 20px; border-radius: 6px;
        font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      }
      #toast.show { opacity: 1; }

      dialog#deleteDialog {
        border: none; border-radius: 10px; padding: 20px 24px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2); font-size: 14px;
      }
      dialog#deleteDialog::backdrop { background: rgba(0,0,0,0.4); }
      dialog#deleteDialog .dlg-btn-row { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
      dialog#deleteDialog button { padding: 7px 16px; border: none; border-radius: 5px; cursor: pointer; }
      dialog#deleteDialog .dlg-cancel { background: #9e9e9e; color: #fff; }
      dialog#deleteDialog .dlg-delete { background: #c62828; color: #fff; }

      .fig-btn {
        padding: 4px 10px; border: 1px solid #1565c0; background: #fff; color: #1565c0;
        border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 4px;
      }
      .fig-btn:hover { background: #e8f1ff; }

      dialog#figDialog {
        border: none; border-radius: 10px; padding: 16px; max-width: 90vw; max-height: 90vh;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      }
      dialog#figDialog::backdrop { background: rgba(0,0,0,0.5); }
      dialog#figDialog .fig-title { font-size: 14px; font-weight: bold; color: #1565c0; margin-bottom: 10px; }
      dialog#figDialog img { max-width: 100%; max-height: 80vh; display: block; }
      dialog#figDialog .fig-close-row { display: flex; justify-content: flex-end; margin-top: 10px; }
      dialog#figDialog .fig-close-row button {
        padding: 7px 16px; border: none; border-radius: 5px; cursor: pointer; background: #9e9e9e; color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">

      <div class="page-header">
        <button class="back-btn" onclick="location.href='index.html'">← メニューへ戻る</button>
        <h1 data-key="title">プレス指示作成</h1>
        <div class="lang-wrap">
          <button class="lang-btn" onclick="setLang('ja')">日本語</button>
          <button class="lang-btn" onclick="setLang('vi')">Tiếng Việt</button>
        </div>
      </div>

      <!-- 金型・品番選択 -->
      <div class="card">
        <div class="card-body">
          <div class="die-header-bar">
            <div class="die-header-item hb-die-number">
              <span class="hb-label" data-key="hb_die_number">型番</span>
              <div class="die-search-wrap">
                <input type="text" id="dieSearchInput" autocomplete="off" data-key-placeholder="ph_die_search" placeholder="型番で検索/選択" oninput="searchDies(this.value)" onfocus="searchDies(this.value)" />
                <div class="die-dropdown" id="dieDropdown"></div>
              </div>
            </div>
            <div class="die-header-item hb-die-size">
              <span class="hb-label" data-key="hb_die_size">金型サイズ</span>
              <span class="hb-value" id="hbDieSize">-</span>
            </div>
            <div class="die-header-item hb-product">
              <span class="hb-label" data-key="hb_product">品番</span>
              <span class="hb-value"><select id="productSelect" onchange="onProductSelectChange()"><option value="">-</option></select></span>
            </div>
            <div class="die-header-item hb-unit-weight">
              <span class="hb-label" data-key="hb_unit_weight">単重</span>
              <span class="hb-value" id="hbUnitWeight">-</span>
            </div>
            <div class="die-header-item work-length">
              <span class="hb-label" data-key="hb_work_length">押出長さ</span>
              <span class="hb-value"><span id="workLengthValue">-</span> <span class="unit">m</span></span>
            </div>
          </div>
          <div class="product-pick-note" id="productPickNote"></div>
        </div>
      </div>

      <!-- 過去の指示履歴 -->
      <div class="card" id="historyCard">
        <div class="card-body">
          <div style="max-height:240px; overflow-y:auto;" tabindex="-1">
            <table>
              <thead>
                <tr>
                  <th data-key="col_plan_date">計画日</th>
                  <th data-key="col_pressing_type">プレス種別</th>
                  <th data-key="col_variant">品番</th>
                  <th class="num" data-key="col_billet_qty">投入本数</th>
                </tr>
              </thead>
              <tbody id="historyTbody">
                <tr><td colspan="4" class="empty-note" data-key="select_die_first">先に金型を選択してください</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 押出条件 -->
      <div class="card" id="formCard">
        <div class="card-body">
          <div class="form-grid" id="formGrid">
            <div class="form-item fw-date" data-field="fPlanDate">
              <div class="fi-row"><span class="fi-label" data-key="lbl_plan_date">計画日</span><input type="date" id="fPlanDate" /></div>
              <span class="fi-prev" id="prevFPlanDate"></span>
            </div>
            <div class="form-item fw-wide" data-field="fPressingType">
              <div class="fi-row"><span class="fi-label" data-key="lbl_pressing_type">プレス種別</span><select id="fPressingType"></select></div>
              <span class="fi-prev" id="prevFPressingType"></span>
            </div>
            <div class="form-item" data-field="fRamSpeed">
              <div class="fi-row"><span class="fi-label" data-key="lbl_ram_speed">ラム速度</span><input type="text" id="fRamSpeed" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFRamSpeed"></span>
            </div>
            <div class="form-item" data-field="fDiscardThickness">
              <div class="fi-row"><span class="fi-label" data-key="lbl_discard_thickness">ディスカード (mm)</span><input type="text" id="fDiscardThickness" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFDiscardThickness"></span>
            </div>

            <div class="form-item" data-field="fBilletSize">
              <div class="fi-row"><span class="fi-label" data-key="lbl_billet_size">ビレットサイズ (inch)</span>
                <select id="fBilletSize">
                  <option value="9">9</option>
                  <option value="12">12</option>
                  <option value="14">14</option>
                </select>
              </div>
              <span class="fi-prev" id="prevFBilletSize"></span>
            </div>
            <div class="form-item" data-field="fBilletLength">
              <div class="fi-row"><span class="fi-label" data-key="lbl_billet_length">ビレット長さ (mm)</span><input type="number" id="fBilletLength" list="billetLengthOptions" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFBilletLength"></span>
              <datalist id="billetLengthOptions">
                <option value="600"></option>
                <option value="1200"></option>
              </datalist>
            </div>
            <div class="form-item" data-field="fBilletTemp">
              <div class="fi-row"><span class="fi-label" data-key="lbl_billet_temp">ビレット温度 (℃)</span><input type="number" id="fBilletTemp" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFBilletTemp"></span>
            </div>
            <div class="form-item" data-field="fBilletTaper">
              <div class="fi-row"><span class="fi-label" data-key="lbl_billet_taper">テーパー加熱</span>
                <select id="fBilletTaper">
                  <option value="-1">-</option>
                  <option value="0">0</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </div>
              <span class="fi-prev" id="prevFBilletTaper"></span>
            </div>

            <div class="form-item" data-field="fBilletQty">
              <div class="fi-row"><span class="fi-label" data-key="lbl_billet_qty">ビレット投入本数</span><input type="number" id="fBilletQty" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFBilletQty"></span>
            </div>
            <div class="form-item" data-field="fSubInitial">
              <div class="fi-row"><span class="fi-label" data-key="lbl_sub_initial">サブ初期高さ</span><input type="number" id="fSubInitial" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFSubInitial"></span>
            </div>
            <div class="form-item" data-field="fDieTemp">
              <div class="fi-row"><span class="fi-label" data-key="lbl_die_temp">型温度 (℃)</span><input type="number" id="fDieTemp" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFDieTemp"></span>
            </div>
            <div class="form-item" data-field="fDieHeatTime">
              <div class="fi-row"><span class="fi-label" data-key="lbl_die_heat_time">型加熱時間</span><input type="text" id="fDieHeatTime" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFDieHeatTime"></span>
            </div>

            <div class="form-item" data-field="fStretchRatio">
              <div class="fi-row"><span class="fi-label" data-key="lbl_stretch_ratio">ストレッチ率</span><input type="text" id="fStretchRatio" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFStretchRatio"></span>
            </div>
            <div class="form-item fw-wide" data-field="fIncharge">
              <div class="fi-row"><span class="fi-label" data-key="lbl_incharge">担当者</span><select id="fIncharge"></select></div>
              <span class="fi-prev" id="prevFIncharge"></span>
            </div>
            <div class="form-item" data-field="fValueL">
              <div class="fi-row"><span class="fi-label" data-key="lbl_value_l">サンプル位置 l</span><input type="text" id="fValueL" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFValueL"></span>
            </div>
            <div class="form-item" data-field="fValueM">
              <div class="fi-row"><span class="fi-label" data-key="lbl_value_m">サンプル位置 m</span><input type="number" id="fValueM" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFValueM"></span>
            </div>

            <div class="form-item" data-field="fValueN">
              <div class="fi-row"><span class="fi-label" data-key="lbl_value_n">サンプル位置 n</span><input type="number" id="fValueN" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFValueN"></span>
            </div>
            <div class="form-item fw-wide" data-field="fNbn">
              <div class="fi-row"><span class="fi-label" data-key="lbl_nbn">nBn</span><select id="fNbn"></select></div>
              <span class="fi-prev" id="prevFNbn"></span>
            </div>
            <div class="form-item" data-field="fMachine">
              <div class="fi-row"><span class="fi-label" data-key="lbl_machine">設備</span>
                <select id="fMachine">
                  <option value="1">No.1</option>
                  <option value="2">No.2</option>
                  <option value="3">No.3</option>
                  <option value="4">No.4</option>
                </select>
              </div>
              <span class="fi-prev" id="prevFMachine"></span>
            </div>
            <div class="form-item" data-field="fInitial">
              <div class="fi-row"><span class="fi-label" data-key="lbl_initial">初期高さ</span><input type="number" id="fInitial" autocomplete="off" /></div>
              <span class="fi-prev" id="prevFInitial"></span>
            </div>

            <div class="form-item" data-field="fCooling">
              <div class="fi-row"><span class="fi-label" data-key="lbl_cooling">冷却方式</span>
                <select id="fCooling">
                  <option value="1">空冷</option>
                  <option value="2">水冷</option>
                  <option value="3">ミスト</option>
                </select>
              </div>
              <span class="fi-prev" id="prevFCooling"></span>
            </div>
            <div class="form-item static">
              <div class="fi-row"><span class="fi-label" data-key="lbl_fig">切断位置の図</span>
                <button type="button" class="fig-btn" onclick="openFigModal()" data-key="btn_fig">図</button>
              </div>
            </div>
            <div class="form-item full" data-field="fNote">
              <div class="fi-row"><span class="fi-label" data-key="lbl_note">備考</span><textarea id="fNote" autocomplete="off"></textarea></div>
              <span class="fi-prev" id="prevFNote"></span>
            </div>
          </div>

          <div class="btn-row">
            <button class="btn-cancel" onclick="resetForm()" data-key="btn_cancel">クリア</button>
            <button class="btn-save" id="saveBtn" onclick="saveDirective()" data-key="btn_save" disabled>指示を保存</button>
            <button class="btn-update" id="updateBtn" onclick="updateDirective()" data-key="btn_update" disabled>更新する</button>
            <button class="btn-print" id="printBtn" onclick="printDirective()" data-key="btn_print" disabled>印刷</button>
            <span class="edit-badge" id="editBadge" style="display:none;"></span>
            <span class="delete-hint" id="deleteHint" style="display:none;" data-key="delete_hint">履歴の選択中の行をもう一度クリックすると削除できます</span>
          </div>
        </div>
      </div>
    </div>

    <dialog id="deleteDialog">
      <div data-key="dlg_confirm">この指示を削除しますか？</div>
      <div class="dlg-btn-row">
        <button class="dlg-cancel" onclick="document.getElementById('deleteDialog').close()" data-key="dlg_cancel">キャンセル</button>
        <button class="dlg-delete" onclick="confirmDeleteDirective()" data-key="dlg_delete">削除する</button>
      </div>
    </dialog>

    <dialog id="figDialog">
      <div class="fig-title" data-key="lbl_fig">切断位置の図</div>
      <img src="./img/fig_001.svg" alt="切断位置の図" />
      <div class="fig-close-row">
        <button onclick="document.getElementById('figDialog').close()" data-key="dlg_cancel">キャンセル</button>
      </div>
    </dialog>

    <div id="toast"></div>

    <script>
      /* ── 多言語辞書 ── */
      const dict = {
        ja: {
          title: "プレス指示作成",
          hb_die_number: "型番", hb_die_size: "金型サイズ", hb_product: "品番", hb_unit_weight: "単重", hb_work_length: "押出長さ",
          ph_die_search: "型番で検索/選択",
          select_die_first: "先に金型を選択してください",
          col_plan_date: "計画日", col_pressing_type: "プレス種別",
          col_variant: "品番", col_billet_qty: "投入本数",
          empty_history: "履歴なし",
          lbl_plan_date: "計画日", lbl_pressing_type: "プレス種別", lbl_machine: "設備",
          lbl_incharge: "担当者", lbl_discard_thickness: "ディスカード (mm)",
          lbl_ram_speed: "ラム速度", lbl_stretch_ratio: "ストレッチ率", lbl_cooling: "冷却方式",
          lbl_billet_size: "ビレットサイズ (inch)", lbl_billet_length: "ビレット長さ (mm)",
          lbl_billet_qty: "ビレット投入本数", lbl_billet_temp: "ビレット温度 (℃)",
          lbl_billet_taper: "テーパー加熱", lbl_die_temp: "型温度 (℃)",
          lbl_die_heat_time: "型加熱時間", lbl_nbn: "nBn",
          lbl_sub_initial: "サブ初期高さ", lbl_initial: "初期高さ",

      function currentLang() {
        return localStorage.getItem("lang") || "ja";
      }

      function setLang(lang) {
        localStorage.setItem("lang", lang);
        document.querySelectorAll("[data-key]").forEach((el) => {
          const k = el.getAttribute("data-key");
          if (dict[lang][k] !== undefined) el.textContent = dict[lang][k];
        });
        document.querySelectorAll("[data-key-placeholder]").forEach((el) => {
          const k = el.getAttribute("data-key-placeholder");
          if (dict[lang][k] !== undefined) el.placeholder = dict[lang][k];
        });
      }

      function showToast(msg, ok = true) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.background = ok ? "#323232" : "#c62828";
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      /* ── 状態 ── */
      let selectedDie = null;        // {id, die_number, hole, die_diamater}
      let dieProducts = [];          // このダイに紐づく品番一覧
      let selectedVariant = null;    // {variant_id, production_number_id, production_number, specific_weight, production_length}
      let editingId = null;
      let originalPlanDate = null;   // 編集読込み元レコードの元の計画日(この値と一致する時だけ更新可)
      let selectedHistoryId = null;
      let masters = { pressingTypes: [], nbn: [], staff: [] };

      /* ── フィールド定義(Enterキー遷移順・完了バリデーション) ── */
      const fieldOrder = [
        "fPlanDate", "fPressingType", "fRamSpeed", "fDiscardThickness",
        "fBilletSize", "fBilletLength", "fBilletTemp", "fBilletTaper", "fBilletQty",
        "fSubInitial", "fDieTemp", "fDieHeatTime", "fStretchRatio", "fIncharge",
        "fValueL", "fValueM", "fValueN", "fNbn", "fMachine", "fInitial", "fCooling", "fNote",
      ];
      const validators = {
        fPlanDate: (v) => !!v,
        fDiscardThickness: (v) => v !== "" && Number(v) > 0 && Number(v) < 150,
        fPressingType: (v) => v !== "" && v !== "0",
        fRamSpeed: (v) => v !== "" && Number(v) > 0 && Number(v) < 50,
        fBilletLength: (v) => v !== "" && Number(v) > 0,
        fBilletTemp: (v) => v !== "" && Number(v) > 400 && Number(v) < 550,
        fBilletTaper: (v) => v !== "" && v !== "-1",
        fBilletSize: (v) => v !== "" && v !== "0",
        fBilletQty: (v) => v !== "" && Number(v) >= 0 && Number(v) < 1500,
        fSubInitial: (v) => v !== "" && Number(v) > 0 && Number(v) < 100,
        fDieTemp: (v) => v !== "" && Number(v) > 400 && Number(v) < 550,
        fDieHeatTime: (v) => v !== "" && Number(v) > 1 && Number(v) < 8,
        fStretchRatio: (v) => v !== "" && !isNaN(v) && Number(v) >= 0 && Number(v) < 5,
        fIncharge: (v) => v !== "" && v !== "0",
        fValueL: (v) => v !== "" && !isNaN(v) && Number(v) >= 0 && Number(v) <= 10,
        fValueM: (v) => v !== "" && !isNaN(v) && Number(v) >= 0 && Number(v) <= 30,
        fValueN: (v) => v !== "" && !isNaN(v) && Number(v) >= 1 && Number(v) <= 30,
        fNbn: (v) => v !== "" && v !== "0",
        fMachine: (v) => v !== "" && v !== "0",
        fInitial: (v) => v !== "" && Number(v) > 0 && Number(v) < 100,
        fCooling: (v) => v !== "" && v !== "0",
        fNote: (v) => v.trim().length > 2,
      };

      function fieldGroup(id) {
        return document.querySelector(`.form-item[data-field="${id}"]`);
      }

      function checkFieldComplete(id) {
        const el = document.getElementById(id);
        const ok = validators[id](el.value);
        fieldGroup(id).classList.toggle("complete", ok);
        return ok;
      }

      function checkAllComplete() {
        let allOk = true;
        fieldOrder.forEach((id) => { if (!checkFieldComplete(id)) allOk = false; });
        // 計画日が読込み元レコードと同じ時だけ「更新」扱い。日付を変えた場合は
        // 「このテンプレートを元に新規保存する」とみなし「保存」を使わせる。
        const isSameDate = !!editingId && document.getElementById("fPlanDate").value === originalPlanDate;
        document.getElementById("saveBtn").disabled = !(allOk && !isSameDate);
        document.getElementById("updateBtn").disabled = !(allOk && isSameDate);
        document.getElementById("printBtn").disabled = !editingId;
        return allOk;
      }

      fieldOrder.forEach((id, idx) => {
        const el = document.getElementById(id);
        el.addEventListener("input", checkAllComplete);
        el.addEventListener("change", checkAllComplete);
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && el.tagName !== "TEXTAREA") {
            e.preventDefault();
            const next = fieldOrder[idx + 1];
            if (next) document.getElementById(next).focus();
          }
        });
      });
      ["fBilletSize", "fBilletLength", "fDiscardThickness"].forEach((id) => {
        document.getElementById(id).addEventListener("input", recalcWorkLength);
        document.getElementById(id).addEventListener("change", recalcWorkLength);
      });

      /* ── Step 1: 金型検索・選択 ── */
      let dieSearchTimer = null;
      async function searchDies(q) {
        clearTimeout(dieSearchTimer);
        dieSearchTimer = setTimeout(async () => {
          const res = await fetch(`./php/press_directive/get_dies.php?q=${encodeURIComponent(q)}`);
          const dies = await res.json();
          renderDieDropdown(dies);
        }, 200);
      }

      let dieDropdownItems = [];
      let dieDropdownActiveIndex = -1;

      function renderDieDropdown(dies) {
        dieDropdownItems = dies;
        dieDropdownActiveIndex = dies.length ? 0 : -1;
        const dd = document.getElementById("dieDropdown");
        if (!dies.length) {
          dd.innerHTML = `<div style="color:#999;">該当する金型がありません</div>`;
          dd.classList.add("show");
          return;
        }
        renderDieDropdownItems();
        dd.classList.add("show");
      }

      function renderDieDropdownItems() {
        const dd = document.getElementById("dieDropdown");
        dd.innerHTML = dieDropdownItems.map((d, i) =>
          `<div class="${i === dieDropdownActiveIndex ? "active" : ""}" onmouseenter="dieDropdownActiveIndex=${i}; renderDieDropdownItems();" onclick='selectDie(${JSON.stringify(d)})'>${d.die_number}</div>`
        ).join("");
        const activeEl = dd.children[dieDropdownActiveIndex];
        if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
      }

      document.getElementById("dieSearchInput").addEventListener("keydown", (e) => {
        const dd = document.getElementById("dieDropdown");
        if (!dd.classList.contains("show") || !dieDropdownItems.length) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();
          dieDropdownActiveIndex = Math.min(dieDropdownActiveIndex + 1, dieDropdownItems.length - 1);
          renderDieDropdownItems();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          dieDropdownActiveIndex = Math.max(dieDropdownActiveIndex - 1, 0);
          renderDieDropdownItems();
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (dieDropdownActiveIndex >= 0) selectDie(dieDropdownItems[dieDropdownActiveIndex]);
        } else if (e.key === "Escape") {
          dd.classList.remove("show");
        } else if (e.key === "Tab") {
          dd.classList.remove("show");
        }
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".die-search-wrap")) {
          document.getElementById("dieDropdown").classList.remove("show");
        }
      });

      async function selectDie(die) {
        selectedDie = die;
        document.getElementById("dieSearchInput").value = die.die_number;
        document.getElementById("dieDropdown").classList.remove("show");
        document.getElementById("hbDieSize").textContent = die.die_diamater ? `Φ${die.die_diamater}mm` : "-";

        selectedVariant = null;
        editingId = null;
        selectedHistoryId = null;
        document.getElementById("editBadge").style.display = "none";
        document.getElementById("deleteHint").style.display = "none";

        const res = await fetch(`./php/press_directive/get_die_products.php?die_id=${die.id}`);
        dieProducts = await res.json();
        renderProductPick();

        await loadHistory(die.id);
        resetForm(false);

        if (dieProducts.length > 1) {
          document.getElementById("productSelect").focus();
        } else {
          focusFirstHistoryRowOrFallback();
        }
      }

      function focusFirstHistoryRowOrFallback() {
        const firstRow = document.querySelector("#historyTbody tr[data-id]");
        if (firstRow) firstRow.focus();
        else document.getElementById("fPlanDate").focus();
      }

      function renderProductPick() {
        const t = dict[currentLang()];
        const note = document.getElementById("productPickNote");
        const sel = document.getElementById("productSelect");

        if (!dieProducts.length) {
          note.textContent = t.no_products;
          note.classList.add("warn");
          sel.innerHTML = `<option value="">-</option>`;
          selectedVariant = null;
          updateUnitWeightDisplay();
          recalcWorkLength();
          return;
        }
        note.classList.remove("warn");

        sel.innerHTML = (dieProducts.length > 1 ? `<option value="">-</option>` : "") +
          dieProducts.map((p) => `<option value="${p.variant_id}">${p.production_number}</option>`).join("");

        if (dieProducts.length === 1) {
          note.textContent = "";
          sel.value = String(dieProducts[0].variant_id);
          pickProduct(dieProducts[0]);
          return;
        }

        note.textContent = t.pick_product;
      }

      function onProductSelectChange() {
        const id = document.getElementById("productSelect").value;
        const p = dieProducts.find((dp) => String(dp.variant_id) === id);
        pickProduct(p ?? null);
        focusFirstHistoryRowOrFallback();
      }

      function pickProduct(p) {
        selectedVariant = p;
        document.getElementById("productSelect").value = p ? String(p.variant_id) : "";
        if (p) document.getElementById("productPickNote").textContent = "";
        updateUnitWeightDisplay();
        recalcWorkLength();
      }

      function updateUnitWeightDisplay() {
        document.getElementById("hbUnitWeight").textContent =
          selectedVariant && selectedVariant.specific_weight != null
            ? `${Number(selectedVariant.specific_weight).toFixed(2)} kg/m` : "-";
      }

      /* ── 押出長さのリアルタイム計算(ex0.11 calPressLength と同じ式) ── */
      function recalcWorkLength() {
        const el = document.getElementById("workLengthValue");
        if (!el) return;
        if (!selectedVariant || selectedVariant.specific_weight == null || !selectedDie.hole) {
          el.textContent = "-";
          return;
        }
        const billetSize = Number(document.getElementById("fBilletSize").value);
        const billetLength = Number(document.getElementById("fBilletLength").value);
        const discardThickness = Number(document.getElementById("fDiscardThickness").value);
        if (!billetLength || document.getElementById("fDiscardThickness").value === "") {
          el.textContent = "-";
          return;
        }
        let billetWeight, containerDimension;
        if (billetSize === 9) { billetWeight = 132.3; containerDimension = 237; }
        else if (billetSize === 12) { billetWeight = 235; containerDimension = 312; }
        else if (billetSize === 14) { billetWeight = 320; containerDimension = 366; }
        else { el.textContent = "-"; return; }

        const inputMaterialWeight =
          billetWeight * (billetLength / 1200) -
          (((containerDimension ** 2 / 4) * 3.142 * discardThickness) / 10 ** 6) * 2.7;
        let workLength = inputMaterialWeight / Number(selectedVariant.specific_weight);
        workLength = workLength / Number(selectedDie.hole);
        el.textContent = workLength > 0 ? workLength.toFixed(1) : "-";
      }

      /* ── Step 2: 過去の指示履歴 ── */
      let historyRows = [];
      async function loadHistory(diesId) {
        const res = await fetch(`./php/press_directive/get_directive_history.php?dies_id=${diesId}`);
        historyRows = await res.json();
        renderHistory();
      }

      function renderHistory() {
        const tbody = document.getElementById("historyTbody");
        if (!historyRows.length) {
          tbody.innerHTML = `<tr><td colspan="4" class="empty-note">${dict[currentLang()].empty_history}</td></tr>`;
          return;
        }
        const ptMap = {};
        masters.pressingTypes.forEach((t) => { ptMap[t.id] = t.remarks_jp ?? t.pressing_type; });

        tbody.innerHTML = historyRows.map((r) => `
          <tr class="selectable ${String(r.id) === String(selectedHistoryId) ? "selected" : ""}" tabindex="0" data-id="${r.id}" onclick="onHistoryRowClick(${r.id})">
            <td>${r.plan_date_at ?? "-"}</td>
            <td>${ptMap[r.pressing_type_id] ?? "-"}</td>
            <td>${r.variant_production_number ?? "-"}</td>
            <td class="num">${r.billet_input_quantity ?? "-"}</td>
          </tr>
        `).join("");
      }

      document.getElementById("historyTbody").addEventListener("keydown", (e) => {
        const tr = e.target.closest("tr[data-id]");
        if (!tr) return;
        if (e.key === "Enter") {
          e.preventDefault();
          onHistoryRowClick(Number(tr.dataset.id));
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          tr.nextElementSibling?.focus();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          tr.previousElementSibling?.focus();
        }
      });

      function onHistoryRowClick(id) {
        if (String(selectedHistoryId) === String(id)) {
          document.getElementById("deleteDialog").showModal();
          return;
        }
        selectedHistoryId = id;
        renderHistory();
        loadIntoForm(historyRows.find((r) => r.id === id));
      }

      function confirmDeleteDirective() {
        document.getElementById("deleteDialog").close();
        deleteDirective(selectedHistoryId);
      }

      function openFigModal() {
        document.getElementById("figDialog").showModal();
      }

      /* ── 指示書印刷: 別ファイル press_directive_print.html で表示・印刷する ── */
      function printDirective() {
        if (!editingId) return;
        window.open(`./press_directive_print.html?id=${editingId}`, "_blank");
      }

      async function deleteDirective(id) {
        const res = await fetch("./php/press_directive/delete_directive.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const result = await res.json();
        if (result.status !== "ok") { showToast("削除に失敗しました", false); return; }
        showToast("削除しました");
        resetForm();
        await loadHistory(selectedDie.id);
      }

      function loadIntoForm(r) {
        editingId = r.id;
        originalPlanDate = r.plan_date_at ?? null;
        document.getElementById("editBadge").style.display = "";
        document.getElementById("editBadge").textContent = `編集中: ID ${editingId}`;
        document.getElementById("deleteHint").style.display = "";

        const vals = {
          fPressingType: r.pressing_type_id ?? "",
          fRamSpeed: r.ram_speed ?? "",
          fDiscardThickness: r.discard_thickness ?? "",
          fBilletSize: r.billet_size ?? "9",
          fBilletLength: r.billet_length ?? "",
          fBilletTemp: r.billet_temperature ?? "",
          fBilletTaper: r.billet_taper_heating ?? "-1",
          fBilletQty: r.billet_input_quantity ?? "",
          fSubInitial: r.sub_initial ?? "",
          fDieTemp: r.die_temperature ?? "",
          fDieHeatTime: r.die_heating_time ?? "",
          fStretchRatio: r.stretch_ratio ?? "",
          fIncharge: r.incharge_person_id ?? "",
          fValueL: r.value_l ?? "",
          fValueM: r.value_m ?? "",
          fValueN: r.value_n ?? "",
          fNbn: r.nbn_id ?? "",
          fMachine: r.press_machine ?? "1",
          fInitial: r.initial ?? "",
          fCooling: r.cooling_type ?? "1",
          fNote: r.previous_press_note ?? "",
        };
        fieldOrder.forEach((id) => {
          if (id === "fPlanDate") return; // 計画日は履歴の値を反映せず、デフォルト値(今日)を維持する
          document.getElementById(id).value = vals[id];
          const prevEl = document.getElementById("prev" + id[0].toUpperCase() + id.slice(1));
          if (prevEl) prevEl.innerHTML = vals[id] !== "" ? `前回: <span class="val">${vals[id]}</span>` : "";
        });

        if (r.die_production_number_variant_id) {
          const p = dieProducts.find((dp) => dp.variant_id === r.die_production_number_variant_id);
          if (p) pickProduct(p);
        }

        checkAllComplete();
        recalcWorkLength();
        showToast("編集用に読み込みました");
        document.getElementById("fPlanDate").focus();
      }

      /* ── Step 3: フォーム ── */
      async function loadMasters() {
        const res = await fetch("./php/press_directive/get_masters.php");
        masters = await res.json();

        document.getElementById("fPressingType").innerHTML =
          `<option value="0">-</option>` +
          masters.pressingTypes.map((t) => `<option value="${t.id}">${t.pressing_type}</option>`).join("");
        document.getElementById("fNbn").innerHTML =
          `<option value="0">-</option>` + masters.nbn.map((n) => `<option value="${n.id}">${n.nbn}</option>`).join("");
        document.getElementById("fIncharge").innerHTML =
          `<option value="0">-</option>` + masters.staff.map((s) => `<option value="${s.id}">${s.staff_name}</option>`).join("");
      }

      function resetForm(focusDate = true) {
        editingId = null;
        originalPlanDate = null;
        selectedHistoryId = null;
        document.getElementById("editBadge").style.display = "none";
        document.getElementById("deleteHint").style.display = "none";
        renderHistory();

        fieldOrder.forEach((id) => {
          const el = document.getElementById(id);
          el.value = "";
          const prevEl = document.getElementById("prev" + id[0].toUpperCase() + id.slice(1));
          if (prevEl) prevEl.innerHTML = "";
        });
        document.getElementById("fMachine").value = "1";
        document.getElementById("fCooling").value = "1";
        document.getElementById("fBilletSize").value = "9";
        document.getElementById("fBilletTaper").value = "-1";
        document.getElementById("fPressingType").value = "0";
        document.getElementById("fNbn").value = "0";
        document.getElementById("fIncharge").value = "0";
        document.getElementById("fPlanDate").value = new Date().toISOString().slice(0, 10);

        checkAllComplete();
        recalcWorkLength();
        if (focusDate) document.getElementById("fPlanDate").focus();
      }

      function collectPayload() {
        return {
          id: editingId,
          dies_id: selectedDie.id,
          die_production_number_variant_id: selectedVariant ? selectedVariant.variant_id : null,
          plan_date_at: document.getElementById("fPlanDate").value,
          pressing_type_id: document.getElementById("fPressingType").value,
          discard_thickness: document.getElementById("fDiscardThickness").value,
          ram_speed: document.getElementById("fRamSpeed").value,
          billet_size: document.getElementById("fBilletSize").value,
          billet_length: document.getElementById("fBilletLength").value,
          billet_input_quantity: document.getElementById("fBilletQty").value,
          billet_temperature: document.getElementById("fBilletTemp").value,
          billet_taper_heating: document.getElementById("fBilletTaper").value,
          die_temperature: document.getElementById("fDieTemp").value,
          die_heating_time: document.getElementById("fDieHeatTime").value,
          stretch_ratio: document.getElementById("fStretchRatio").value,
          incharge_person_id: document.getElementById("fIncharge").value,
          value_l: document.getElementById("fValueL").value,
          value_m: document.getElementById("fValueM").value,
          value_n: document.getElementById("fValueN").value,
          nbn_id: document.getElementById("fNbn").value,
          press_machine: document.getElementById("fMachine").value,
          cooling_type: document.getElementById("fCooling").value,
          sub_initial: document.getElementById("fSubInitial").value,
          initial: document.getElementById("fInitial").value,
          previous_press_note: document.getElementById("fNote").value,
        };
      }

      async function saveDirective() {
        if (!selectedDie) { showToast("金型を選択してください", false); return; }
        if (!checkAllComplete()) { showToast("未入力の項目があります", false); return; }

        const res = await fetch("./php/press_directive/save_directive.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(collectPayload()),
        });
        const result = await res.json();
        if (result.status !== "ok") { showToast(result.message || "保存に失敗しました", false); return; }

        showToast("保存しました");
        await loadHistory(selectedDie.id);
        resetForm();
      }

      async function updateDirective() {
        if (!editingId) return;
        if (!checkAllComplete()) { showToast("未入力の項目があります", false); return; }

        const res = await fetch("./php/press_directive/update_directive.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(collectPayload()),
        });
        const result = await res.json();
        if (result.status !== "ok") { showToast(result.message || "更新に失敗しました", false); return; }

        showToast("更新しました");
        await loadHistory(selectedDie.id);
        resetForm();
      }

      /* ── 初期化 ── */
      setLang(currentLang());
      loadMasters().then(() => { checkAllComplete(); });
      document.getElementById("fPlanDate").value = new Date().toISOString().slice(0, 10);
      document.getElementById("dieSearchInput").focus();
    </script>
  </body>
</html>
