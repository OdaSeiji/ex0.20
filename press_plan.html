<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Press Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Roboto Mono", "Segoe UI", monospace;
        background: #f0f2f5;
        padding: 16px;
      }

      /* 3列（金型一覧・計画の作成・計画の一覧）。1920px の画面に収まる幅 */
      .container { max-width: 1880px; margin: 0 auto; }

      .page-header {
        background: #fff;
        border-radius: 10px;
        padding: 12px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .back-btn {
        background: #2b6ca3; color: #fff;
        padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer;
        white-space: nowrap;
      }
      h1 { font-size: 20px; border-left: 6px solid #0078d4; padding-left: 10px; }
      .lang-wrap { margin-left: auto; display: flex; gap: 6px; }
      .lang-btn {
        padding: 6px 12px; border: 1px solid #0078d4;
        background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px;
      }

      /* 左と中央は固定幅（データを読み込んでも幅が変わらない）。中身がはみ出す分は横にスクロール */
      .columns {
        display: grid; grid-template-columns: 450px 380px minmax(0, 1fr); gap: 12px; align-items: start;
        grid-template-areas: "die plan list" "billet billet list";
        grid-template-rows: 450px auto;   /* 上の段は金型一覧・計画の作成と同じ高さ（右の一覧に引き伸ばされない） */
      }
      .area-die { grid-area: die; }
      .area-plan { grid-area: plan; }
      .area-list { grid-area: list; }
      .area-billet { grid-area: billet; }
      .billet-scroll { height: 220px; overflow: auto; }   /* 高さ 1024px の画面に収まるように */
      .hscroll { overflow-x: auto; }
      /* 金型一覧と計画の作成は同じ高さ。中の表はカードの残りの高さでスクロール */
      .card.fixed-h { height: 450px; display: flex; flex-direction: column; }
      .card.fixed-h > .fill { flex: 1; min-height: 0; overflow: auto; }
      .billet-table { min-width: 420px; }
      .card {
        background: #fff;
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        min-width: 0;
      }
      .card-title {
        font-size: 14px; font-weight: bold; color: #1565c0;
        margin-bottom: 8px; border-bottom: 2px solid #e8f1ff; padding-bottom: 6px;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      }

      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { padding: 4px 5px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
      th { color: #777; font-size: 11px; background: #fff; position: sticky; top: 0; z-index: 1; }
      td.c { text-align: center; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .scroll { overflow: auto; }
      tr.selectable { cursor: pointer; }
      tr.selectable:hover td { filter: brightness(0.96); }

      input[type="text"], input[type="date"], input[type="number"], select {
        padding: 5px 7px; border: 1px solid #ccc; border-radius: 4px;
        font-size: 13px; font-family: inherit;
      }
      .required { background: #fff8e1; border-color: #ffb300 !important; }

      /* 金型一覧の色分け */
      tr.st-nitriding td { background: #ffcdd2; }
      tr.st-fixing td    { background: #ffe0b2; }
      tr.st-nopress td   { background: #fff9c4; }
      tr.in-plan td      { color: #1565c0; font-weight: bold; }
      .legend { display: flex; gap: 14px; font-size: 11px; color: #555; margin-top: 8px; flex-wrap: wrap; }
      .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1px solid #aaa; margin-right: 4px; vertical-align: -2px; }
      .legend .lg-nitriding::before { background: #ffcdd2; }
      .legend .lg-fixing::before    { background: #ffe0b2; }
      .legend .lg-nopress::before   { background: #fff9c4; }
      .pn-list { font-size: 11px; color: #555; }
      /* 金型の状態のバッジ */
      .st-badge { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; color: #fff; line-height: 1.5; }
      .st-legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

      /* 計画の作成 */
      .form-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
      .form-label { font-size: 12px; font-weight: bold; color: #1565c0; }
      /* 計画1件を2段で表示（上：型番・種別・直・順番・本数、下：ビレット・窒素加熱・備考・✕）。段ごとに幅を決める */
      .plan-item { padding: 6px 4px; border-bottom: 2px solid #e0e0e0; }
      .plan-item.odd { background: #f8fafd; }
      .pi-row { display: grid; gap: 6px; align-items: end; }
      .pi-row.r1 { grid-template-columns: 136px 46px 52px 30px 37px; }
      .pi-row.r2 { grid-template-columns: 82px 52px 141px 26px; margin-top: 4px; }
      .pi-cell { min-width: 0; }
      .plan-item input[type="text"], .plan-item input[type="number"], .plan-item select { width: 100%; padding: 3px 4px; font-size: 12px; }
      .plan-item .w-qty { text-align: right; padding-right: 2px; }
      .plan-item .fl { font-size: 10px; color: #888; line-height: 1.2; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 入力欄の上の項目名 */
      .plan-item .die-name { font-weight: bold; font-size: 12px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .plan-item .pn-select { display: block; margin-top: 2px; font-size: 11px; padding: 1px 2px; }
      .del-btn { border: none; background: none; color: #c62828; cursor: pointer; font-size: 15px; }
      .btn-row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
      .btn-save { background: #1565c0; color: #fff; padding: 8px 22px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
      .btn-save:disabled, .btn-update:disabled { background: #90a4ae; cursor: default; }
      .btn-update { background: #e65100; color: #fff; padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
      .btn-cancel { background: #9e9e9e; color: #fff; padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer; }
      .edit-badge { background: #e65100; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 12px; }
      .hint { font-size: 11px; color: #999; }
      .empty-note { color: #999; text-align: center; padding: 14px; white-space: normal; }
      .billet-table td.size-cell { font-weight: bold; color: #1565c0; vertical-align: top; border-right: 1px solid #eee; }
      .billet-table td.order-need { color: #c62828; font-weight: bold; }
      .billet-table tr.size-first td { border-top: 2px solid #e0e0e0; }

      /* 計画の一覧：選んだ行と同じ日の行を号機ごとの色で */
      tr.same-date.m1 td { background: #e3f2fd; }
      tr.same-date.m2 td { background: #e8f5e9; }
      tr.same-date.m3 td { background: #fff3e0; }
      tr.same-date.m4 td { background: #f3e5f5; }
      tr.selected td { font-weight: bold; outline: 2px solid #1565c0; outline-offset: -2px; }

      .btn-schedule { margin-left: auto; background: #455a64; color: #fff; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .row-del { border: none; background: none; color: #c62828; cursor: pointer; font-size: 13px; padding: 0 4px; }
      .row-del:hover { color: #fff; background: #c62828; border-radius: 3px; }
      dialog#deleteDialog {
        border: none; border-radius: 10px; padding: 20px 24px; margin: auto;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2); font-size: 14px; min-width: 320px;
      }
      dialog#deleteDialog::backdrop { background: rgba(0,0,0,0.4); }
      dialog#deleteDialog .dlg-target { margin: 10px 0; padding: 8px 10px; background: #f5f5f5; border-radius: 6px; font-size: 13px; }
      dialog#deleteDialog .dlg-error { color: #c62828; font-size: 12px; min-height: 16px; margin-top: 6px; }
      dialog#deleteDialog .dlg-btn-row { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; }
      dialog#deleteDialog button { padding: 7px 16px; border: none; border-radius: 5px; cursor: pointer; }
      dialog#deleteDialog .dlg-cancel { background: #9e9e9e; color: #fff; }
      dialog#deleteDialog .dlg-delete { background: #c62828; color: #fff; }

      #toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: #323232; color: #fff; padding: 10px 20px; border-radius: 6px;
        font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10;
      }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <button class="back-btn" onclick="location.href='index.html'" data-key="btn_back_menu">← メニューへ戻る</button>
        <h1 data-key="title">押出計画</h1>
        <div class="lang-wrap">
          <button class="lang-btn" onclick="setLang('ja')">日本語</button>
          <button class="lang-btn" onclick="setLang('vi')">Tiếng Việt</button>
        </div>
      </div>

      <div class="columns">
        <!-- ① 金型一覧 -->
        <div class="card fixed-h area-die">
          <div class="card-title">
            <span data-key="die_list_title">金型一覧</span>
            <input type="text" id="dieSearch" data-key-placeholder="ph_die_search" placeholder="型番・品番で検索" oninput="onDieSearch()" style="flex:1; min-width:160px;" />
          </div>
          <div class="scroll fill" id="dieScroll">
            <table style="width:auto;">
              <thead><tr id="dieHead"></tr></thead>
              <tbody id="dieBody"></tbody>
            </table>
          </div>
          <div class="legend">
            <span class="lg-nitriding" data-key="lg_nitriding">窒化が必要</span>
            <span class="lg-fixing" data-key="lg_fixing">修理中</span>
            <span class="lg-nopress" data-key="lg_nopress">洗浄が必要</span>
            <span class="hint" style="margin-left:auto;" data-key="hint_click_die">行をクリックすると計画に追加</span>
          </div>
          <div class="st-legend" id="statusLegend"></div>
        </div>

        <!-- ② 計画の作成・修正 -->
        <div class="card fixed-h area-plan">
          <div class="card-title">
            <span id="planFormTitle" data-key="plan_new_title">計画の作成</span>
            <span class="edit-badge" id="editBadge" style="display:none;" data-key="edit_badge">修正中</span>
          </div>
          <div class="form-row">
            <span class="form-label" data-key="lbl_plan_date">押出日</span>
            <input type="date" id="fPlanDate" onchange="checkForm()" />
            <span class="form-label" data-key="lbl_machine">号機</span>
            <select id="fMachine" onchange="checkForm()">
              <option value="0">-</option><option value="1">No.1</option><option value="2">No.2</option><option value="3">No.3</option><option value="4">No.4</option>
            </select>
          </div>
          <div class="fill" id="addBody"></div>
          <div class="btn-row">
            <button class="btn-cancel" onclick="resetForm()" data-key="btn_clear">クリア</button>
            <button class="btn-save" id="saveBtn" onclick="savePlans()" data-key="btn_save" disabled>保存</button>
            <button class="btn-update" id="updateBtn" onclick="updatePlan()" data-key="btn_update" style="display:none;" disabled>更新する</button>
          </div>
          <div class="hint" style="margin-top:8px;" data-key="hint_form">左の金型一覧から型を選び、押出日と号機を決めて保存します。右の計画の行をクリックすると修正できます。</div>
        </div>

        <!-- ③ 計画の一覧（右、上下2段分） -->
        <div class="card area-list">
          <div class="card-title">
            <span data-key="plan_list_title">計画の一覧</span>
            <input type="date" id="fStart" onchange="loadPlans()" /> →
            <input type="date" id="fEnd" onchange="loadPlans()" />
            <input type="text" id="fDie" data-key-placeholder="ph_die" placeholder="型番" oninput="onPlanFilter()" style="width:110px;" />
            <select id="fListMachine" onchange="loadPlans()">
              <option value="0" data-key="all_machines">全号機</option><option value="1">No.1</option><option value="2">No.2</option><option value="3">No.3</option><option value="4">No.4</option>
            </select>
            <button class="btn-schedule" onclick="openSchedule()" data-key="btn_schedule">スケジュール表</button>
          </div>
          <div class="scroll" style="height: calc(100vh - 170px);">
            <table>
              <thead><tr id="planHead"></tr></thead>
              <tbody id="planBody"></tbody>
            </table>
          </div>
        </div>

        <!-- ④ ビレットの在庫と発注の目安（期間は右の計画の一覧と同じ）。左から中央までの2列分 -->
        <div class="card area-billet">
          <div class="card-title">
            <span data-key="billet_title">ビレットの在庫と発注の目安</span>
            <span class="hint" data-key="billet_note">（Dubai のみ。期間は右の一覧と同じ）</span>
          </div>
          <div class="billet-scroll">
            <table class="billet-table">
              <thead><tr id="billetHead"></tr></thead>
              <tbody id="billetBody"></tbody>
            </table>
          </div>
          <div class="hint" style="margin-top:6px;" data-key="billet_hint">発注＝（計画 − 在庫）を 7 本単位に切り上げ。計画の太さ・長さは、その品番を最後に押したときのビレット。</div>
        </div>
      </div>
    </div>

    <dialog id="deleteDialog">
      <div data-key="dlg_confirm">この計画を削除しますか？</div>
      <div class="dlg-target" id="deleteTarget"></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span data-key="lbl_passcode">パスコード</span>
        <input type="password" id="deletePasscode" autocomplete="off" inputmode="numeric" style="width:100px;"
               onkeydown="if (event.key === 'Enter') { event.preventDefault(); confirmDelete(); }" />
      </div>
      <div class="dlg-error" id="deleteError"></div>
      <div class="dlg-btn-row">
        <button class="dlg-cancel" onclick="document.getElementById('deleteDialog').close()" data-key="dlg_cancel">キャンセル</button>
        <button class="dlg-delete" onclick="confirmDelete()" data-key="dlg_delete">削除する</button>
      </div>
    </dialog>

    <div id="toast"></div>

          col_size: "Cỡ", col_material: "Vật liệu", col_length: "Dài", col_stock: "Tồn HT", col_used: "Thực tế", col_plan: "Kế hoạch", col_order: "Order",
          tip_stock_at: "Ngày kiểm kê",
          dlg_confirm: "Xóa kế hoạch này?", lbl_passcode: "Mã xác nhận", dlg_cancel: "Hủy", dlg_delete: "Xóa",
          msg_deleted: "Đã xóa", err_passcode: "Sai mã xác nhận", tip_delete: "Xóa", btn_schedule: "Lịch đùn",
        },
      };
      function currentLang() { try { return localStorage.getItem("lang") || "ja"; } catch (e) { return "ja"; } }
      function t(k) { return dict[currentLang()][k] ?? dict.ja[k] ?? k; }
      function setLang(lang) {
        try { localStorage.setItem("lang", lang); } catch (e) {}
        document.querySelectorAll("[data-key]").forEach((el) => {
          const k = el.getAttribute("data-key");
          if (dict[lang][k] !== undefined) el.textContent = dict[lang][k];
        });
        document.querySelectorAll("[data-key-placeholder]").forEach((el) => {
          const k = el.getAttribute("data-key-placeholder");
          if (dict[lang][k] !== undefined) el.placeholder = dict[lang][k];
        });
        renderDies(); renderAdd(); renderPlans(); renderBillet();
        document.getElementById("planFormTitle").textContent = t(editingId ? "plan_edit_title" : "plan_new_title");
      }

      function showToast(msg, ok = true) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.background = ok ? "#323232" : "#c62828";
        el.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => el.classList.remove("show"), 2500);
      }
      function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
      function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

      // ビレットの表示（例：1120 (VN)）
      function billetLabel(len, origin) {
        const o = Number(origin) ? t(`origin_${origin}`) : "";
        return [len || "", o ? `(${o})` : ""].filter(Boolean).join(" ");
      }

      const PTYPES = [{ id: 3, label: "●" }, { id: 2, label: "◎" }, { id: 1, label: "〇" }];   // m_pressing_type
      const ptypeLabel = (id) => (PTYPES.find((x) => x.id === Number(id)) || {}).label ?? "-";

      const SHIFTS = [{ id: 4, label: "HC" }, { id: 1, label: "1" }, { id: 2, label: "2" }, { id: 3, label: "3" }];
      const shiftLabel = (id) => (SHIFTS.find((s) => s.id === Number(id)) || {}).label ?? "-";

      /* ── 状態 ── */
      let dies = [];
      let addRows = [];      // 計画に追加する行（新規）
      let plans = [];
      let editingId = null;  // 修正中の計画の id
      let selectedPlanId = null;

      /* ── ① 金型一覧 ── */
      // 色分け（exd11 PressPlanV12 の決まり。赤＞橙＞黄の順）
      function dieClass(r) {
        const len = Number(r.nit_len_km) || 0, dia = Number(r.die_diamater) || 0, no = r.die_number || "";
        const nitriding =
          (len > 3 && dia <= 260) || (len > 2.5 && dia >= 300) || Number(r.wash_after_nit) >= 5 ||
          (no.startsWith("XLA25") && len > 2.5) || (/^CP96..T-/.test(no) && len > 2);
        if (nitriding) return "st-nitriding";
        const st = Number(r.die_status_id);
        if ([7, 8, 9].includes(st)) return "st-fixing";
        const days = r.status_at ? (Date.now() - new Date(r.status_at.replace(" ", "T")).getTime()) / 86400000 : 0;
        const nopress = Number(r.press_after_wash) >= 2 || [3, 31, 32].includes(st) ||
          (st === 10 && Number(r.press_after_wash) === 0 && days >= 360);
        return nopress ? "st-nopress" : "";
      }

      // 状態の色（m_die_status の id ごと）
      const STATUS_COLORS = {
        10: "#757575",                          // On rack
        4: "#1565c0",                           // Washing
        1: "#00897b",                           // Measuring
        2: "#2e7d32",                           // OK
        3: "#c62828", 31: "#c62828", 32: "#c62828", // NG
        7: "#ef6c00", 9: "#ef6c00",             // Grinding / Wire cutting
        8: "#6a1b9a",                           // Nitriding
        11: "#37474f",                          // Press
        5: "#5c6bc0", 6: "#0288d1",             // Shot / Clean
      };
      function statusBadge(id, text, tip = "") {
        if (!id) return "-";
        return `<span class="st-badge" style="background:${STATUS_COLORS[id] ?? "#9e9e9e"}" title="${esc(tip)}">${esc(text)}</span>`;
      }
      // バッジにマウスを乗せたときの説明：状態になった日時と、洗浄タンクの番号
      function statusTip(r) {
        return [r.status_at, r.tank ? `${t("lbl_tank")} No.${r.tank}` : ""].filter(Boolean).join("  ");
      }
      // 凡例：一覧に出ている状態だけ（タンク番号は除いた名前で）
      function renderStatusLegend() {
        const seen = new Map();
        dies.forEach((r) => {
          if (r.die_status_id && !seen.has(r.die_status_id)) seen.set(r.die_status_id, r.status_name);
        });
        const order = [10, 4, 1, 2, 3, 31, 32, 7, 9, 8, 11, 5, 6];
        document.getElementById("statusLegend").innerHTML = [...seen.entries()]
          .sort((a, b) => {
            const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
            return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
          })
          .map(([id, name]) => statusBadge(id, name)).join("");
      }

      async function loadDies() {
        const q = document.getElementById("dieSearch").value.trim();
        const res = await fetch("./php/press_plan/get_dies.php?q=" + encodeURIComponent(q));
        dies = await res.json();
        renderDies();
        renderStatusLegend();
      }
      function onDieSearch() {
        clearTimeout(onDieSearch.timer);
        onDieSearch.timer = setTimeout(loadDies, 300);
      }

      function renderDies() {
        document.getElementById("dieHead").innerHTML = `
          <th>${t("col_die")}</th><th>${t("col_status")}</th>
          <th class="num" title="${t("tip_press_after_wash")}">${t("col_press_after_wash")}</th>
          <th class="num" title="${t("tip_nit_len")}">${t("col_nit_len")}</th>
          <th class="num" title="${t("tip_wash_after_nit")}">${t("col_wash_after_nit")}</th>
          <th class="num">${t("col_dia")}</th><th class="num">${t("col_ok_rate")}</th>
          <th class="num" title="${t("tip_max_billet")}">${t("col_max_billet")}</th>`;
        const body = document.getElementById("dieBody");
        if (!dies.length) { body.innerHTML = `<tr><td colspan="8" class="empty-note">${t("empty_dies")}</td></tr>`; return; }
        const inPlan = new Set(addRows.map((a) => a.dies_id));
        body.innerHTML = dies.map((r, i) => `
          <tr class="selectable ${dieClass(r)} ${inPlan.has(r.dies_id) ? "in-plan" : ""}" onclick="addDie(${i})">
            <td>${esc(r.die_number)}</td>
            <td>${statusBadge(r.die_status_id, r.status_name, statusTip(r))}</td>
            <td class="num">${r.press_after_wash}</td>
            <td class="num">${Number(r.nit_len_km).toFixed(2)}</td>
            <td class="num">${r.wash_after_nit}</td>
            <td class="num">${r.die_diamater ?? "-"}</td>
            <td class="num">${r.ok_rate != null ? Math.round(Number(r.ok_rate)) + "%" : "-"}</td>
            <td class="num">${r.max_billet != null ? `${r.max_billet} <span class="hint">(${r.mp_billet_length}/${r.mp_billet_size}in)</span>` : "-"}</td>
          </tr>`).join("");
      }

      /* ── ② 計画の作成・修正 ── */
      function addDie(i) {
        const d = dies[i];
        if (editingId) {
          // 修正中は、選んだ型に差し替える
          const row = addRows[0];
          row.dies_id = d.dies_id; row.die_number = d.die_number; row.products = d.products;
          row.production_number_id = d.products.length ? d.products[0].id : 0;
          renderAdd(); renderDies(); checkForm();
          return;
        }
        if (addRows.some((a) => a.dies_id === d.dies_id)) { showToast(t("msg_already"), false); return; }
        addRows.push({
          dies_id: d.dies_id, die_number: d.die_number, products: d.products,
          production_number_id: d.products.length ? d.products[0].id : 0,
          shift_id: 4, ordinal: String(addRows.length + 1), quantity: "", pressing_type_id: 3, billet_origin: 0, billet_length: "", nitride_use: 0, note: "",
        });
        renderAdd(); renderDies(); checkForm();
      }

      function renderAdd() {
        // 計画1件を2段で（上：型番 | 種別 | 直 | 順番 | 本数、下：ビレット | 窒素加熱 | 備考 | ✕）。各入力欄の上に項目名
        // 段ごとに幅を決める（表だと上下の段で列の幅が共通になり、下の段だけ狭くできないため）
        const fl = (key, tip = "") => `<div class="fl"${tip ? ` title="${t(tip)}"` : ""}>${t(key)}</div>`;
        const body = document.getElementById("addBody");
        if (!addRows.length) { body.innerHTML = `<div class="empty-note">${t("empty_add")}</div>`; return; }
        body.innerHTML = addRows.map((r, i) => `
          <div class="plan-item ${i % 2 ? "odd" : ""}">
            <div class="pi-row r1">
              <div class="pi-cell" title="${esc(r.products.find((p) => p.id === r.production_number_id)?.production_number ?? "")}">${fl("col_die")}<div class="die-name">${esc(r.die_number)}</div>${r.products.length > 1
                ? `<select class="pn-select" onchange="setAdd(${i}, 'production_number_id', Number(this.value))">${r.products.map((p) => `<option value="${p.id}" ${p.id === r.production_number_id ? "selected" : ""}>${esc(p.production_number)}</option>`).join("")}</select>`
                : ""}</div>
              <div class="pi-cell">${fl("col_ptype", "tip_ptype")}<select onchange="setAdd(${i}, 'pressing_type_id', Number(this.value))">${PTYPES.map((x) => `<option value="${x.id}" ${x.id === Number(r.pressing_type_id) ? "selected" : ""}>${x.label}</option>`).join("")}</select></div>
              <div class="pi-cell">${fl("col_shift")}<select onchange="setAdd(${i}, 'shift_id', Number(this.value))">${SHIFTS.map((s) => `<option value="${s.id}" ${s.id === r.shift_id ? "selected" : ""}>${s.label}</option>`).join("")}</select></div>
              <div class="pi-cell">${fl("col_ordinal")}<input type="text" value="${esc(r.ordinal)}" oninput="setAdd(${i}, 'ordinal', this.value)" /></div>
              <div class="pi-cell">${fl("col_qty")}<input type="number" min="0" step="1" class="w-qty ${/^\d+$/.test(r.quantity) ? "" : "required"}" value="${esc(r.quantity)}" oninput="setAdd(${i}, 'quantity', this.value); this.classList.toggle('required', !/^\\d+$/.test(this.value))" /></div>
            </div>
            <div class="pi-row r2">
              <div class="pi-cell">${fl("col_billet", "tip_billet")}<select onchange="setAdd(${i}, 'billet_origin', Number(this.value))">${[0, 1, 2].map((o) => `<option value="${o}" ${o === Number(r.billet_origin) ? "selected" : ""}>${t(`origin_${o}`)}</option>`).join("")}</select></div>
              <div class="pi-cell">${fl("col_nitride", "tip_nitride")}<select onchange="setAdd(${i}, 'nitride_use', Number(this.value))"><option value="0" ${r.nitride_use ? "" : "selected"}>${t("nitride_no")}</option><option value="1" ${r.nitride_use ? "selected" : ""}>${t("nitride_yes")}</option></select></div>
              <div class="pi-cell">${fl("col_note")}<input type="text" value="${esc(r.note)}" oninput="setAdd(${i}, 'note', this.value)" /></div>
              <div class="pi-cell">${editingId ? "" : `<button class="del-btn" title="×" onclick="removeAdd(${i})">✕</button>`}</div>
            </div>
          </div>`).join("");
      }
      function setAdd(i, key, value) { addRows[i][key] = value; checkForm(); }
      function removeAdd(i) { addRows.splice(i, 1); renderAdd(); renderDies(); checkForm(); }

      function checkForm() {
        const dateEl = document.getElementById("fPlanDate"), mcEl = document.getElementById("fMachine");
        dateEl.classList.toggle("required", !dateEl.value);
        mcEl.classList.toggle("required", mcEl.value === "0");
        const ok = dateEl.value && mcEl.value !== "0" && addRows.length > 0 &&
          addRows.every((r) => r.production_number_id > 0 && /^\d+$/.test(String(r.quantity)) && /^(|[1-9]\d*)$/.test(String(r.billet_length ?? "")));
        document.getElementById("saveBtn").disabled = !ok;
        document.getElementById("updateBtn").disabled = !ok;
      }

      function setEditMode(on) {
        document.getElementById("editBadge").style.display = on ? "" : "none";
        document.getElementById("saveBtn").style.display = on ? "none" : "";
        document.getElementById("updateBtn").style.display = on ? "" : "none";
        document.getElementById("planFormTitle").textContent = t(on ? "plan_edit_title" : "plan_new_title");
      }

      function resetForm() {
        editingId = null; selectedPlanId = null;
        addRows = [];
        setEditMode(false);
        renderAdd(); renderDies(); renderPlans(); checkForm();
      }

      async function savePlans() {
        const body = {
          plan_date: document.getElementById("fPlanDate").value,
          press_machine: Number(document.getElementById("fMachine").value),
          rows: addRows.map(({ products, die_number, ...r }) => r),
        };
        const res = await fetch("./php/press_plan/save_plans.php", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
        });
        const result = await res.json();
        if (!result.ok) { showToast(result.message || "error", false); return; }
        showToast(t("msg_saved"));
        addRows = [];
        renderAdd(); renderDies(); checkForm();
        await loadPlans();
      }

      async function updatePlan() {
        const { products, die_number, ...r } = addRows[0];
        const body = { ...r, id: editingId, plan_date: document.getElementById("fPlanDate").value, press_machine: Number(document.getElementById("fMachine").value) };
        const res = await fetch("./php/press_plan/update_plan.php", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
        });
        const result = await res.json();
        if (!result.ok) { showToast(result.message || "error", false); return; }
        showToast(t("msg_updated"));
        await loadPlans();
      }

      /* ── ビレットの在庫と発注の目安 ── */
      let billetRows = [];
      async function loadBillet() {
        const p = new URLSearchParams({ start: document.getElementById("fStart").value, end: document.getElementById("fEnd").value });
        const res = await fetch("./php/press_plan/get_billet_summary.php?" + p.toString());
        billetRows = (await res.json()).rows;
        renderBillet();
      }
      function renderBillet() {
        document.getElementById("billetHead").innerHTML = `
          <th>${t("col_size")}</th><th>${t("col_material")}</th><th class="num">${t("col_length")}</th>
          <th class="num">${t("col_stock")}</th><th class="num">${t("col_used")}</th>
          <th class="num">${t("col_plan")}</th><th class="num">${t("col_order")}</th>`;
        const perSize = {};
        billetRows.forEach((r) => { perSize[r.size] = (perSize[r.size] || 0) + 1; });
        let prev = null;
        document.getElementById("billetBody").innerHTML = billetRows.map((r) => {
          const first = r.size !== prev; prev = r.size;
          const sizeCell = first
            ? `<td class="size-cell" rowspan="${perSize[r.size]}" title="${t("tip_stock_at")}: ${r.stock_at ?? "-"}">${r.size}in<br><span class="hint">${r.stock_at ?? "-"}</span></td>`
            : "";
          return `<tr class="${first ? "size-first" : ""}">${sizeCell}
            <td>${r.material}</td><td class="num">${r.length}</td>
            <td class="num">${r.stock ?? "-"}</td><td class="num">${r.used}</td><td class="num">${r.plan}</td>
            <td class="num ${r.order > 0 ? "order-need" : ""}">${r.order}</td></tr>`;
        }).join("");
      }

      /* ── ③ 計画の一覧 ── */
      async function loadPlans() {
        const p = new URLSearchParams({
          start: document.getElementById("fStart").value,
          end: document.getElementById("fEnd").value,
          die: document.getElementById("fDie").value.trim(),
          machine: document.getElementById("fListMachine").value,
        });
        const res = await fetch("./php/press_plan/get_plans.php?" + p.toString());
        plans = await res.json();
        renderPlans();
        loadBillet();
      }
      function onPlanFilter() {
        clearTimeout(onPlanFilter.timer);
        onPlanFilter.timer = setTimeout(loadPlans, 300);
      }

      function renderPlans() {
        document.getElementById("planHead").innerHTML = `
          <th>${t("col_date")}</th><th>${t("col_mc")}</th><th>${t("col_pn")}</th><th>${t("col_die")}</th><th title="${t("tip_ptype")}">${t("col_ptype")}</th>
          <th>${t("col_shift")}</th><th>${t("col_ordinal")}</th><th class="num">${t("col_qty")}</th>
          <th title="${t("tip_billet")}">${t("col_billet")}</th>
          <th title="${t("tip_nitride")}">${t("col_nitride")}</th><th>${t("col_note")}</th><th></th>`;
        const body = document.getElementById("planBody");
        if (!plans.length) { body.innerHTML = `<tr><td colspan="12" class="empty-note">${t("empty_plans")}</td></tr>`; return; }
        const sel = plans.find((p) => p.id === selectedPlanId);
        body.innerHTML = plans.map((p) => {
          const cls = sel && p.plan_date === sel.plan_date ? `same-date m${p.press_machine}` : "";
          return `
          <tr class="selectable ${cls} ${p.id === selectedPlanId ? "selected" : ""}" onclick="openPlan(${p.id})">
            <td>${p.plan_date}</td><td>${p.press_machine}</td>
            <td>${esc(p.production_number ?? "-")}</td><td>${esc(p.die_number ?? "-")}</td><td class="c">${ptypeLabel(p.pressing_type_id)}</td>
            <td>${shiftLabel(p.shift_id)}</td><td>${esc(p.ordinal ?? "")}</td>
            <td class="num">${p.quantity}</td><td>${esc(billetLabel(p.billet_length, p.billet_origin))}</td><td>${Number(p.nitride_use) === 1 ? "Yes" : "No"}</td>
            <td>${esc(p.note ?? "")}</td>
            <td><button class="row-del" title="${t("tip_delete")}" onclick="event.stopPropagation(); openDelete(${p.id})">✕</button></td>
          </tr>`;
        }).join("");
      }

      // 一覧の行をクリック：同じ日の計画を号機ごとの色で示し、中央に修正用に読み込む
      function openPlan(id) {
        const p = plans.find((x) => x.id === id);
        if (!p) return;
        selectedPlanId = id; editingId = id;
        const die = dies.find((d) => d.dies_id === p.dies_id);
        let products = die ? die.products : [];
        if (!products.some((x) => x.id === p.production_number_id)) {
          products = [...products, { id: p.production_number_id, production_number: p.production_number ?? "-" }];
        }
        addRows = [{
          dies_id: p.dies_id, die_number: p.die_number ?? "-", products,
          production_number_id: p.production_number_id, shift_id: Number(p.shift_id) || 4,
          ordinal: p.ordinal ?? "", quantity: String(p.quantity ?? ""),
          pressing_type_id: Number(p.pressing_type_id) || 3, billet_origin: Number(p.billet_origin) || 0, billet_length: p.billet_length != null ? String(p.billet_length) : "", nitride_use: Number(p.nitride_use) === 1 ? 1 : 0, note: p.note ?? "",
        }];
        document.getElementById("fPlanDate").value = p.plan_date;
        document.getElementById("fMachine").value = String(p.press_machine);
        setEditMode(true);
        renderAdd(); renderDies(); renderPlans(); checkForm();
        showToast(t("msg_loaded"));
      }

      /* ── スケジュール表：選んだ計画の日（無ければ期間の始まり）と、選んだ号機で開く ── */
      function openSchedule() {
        const sel = plans.find((p) => p.id === selectedPlanId);
        const date = sel ? sel.plan_date : document.getElementById("fStart").value;
        const mc = sel ? sel.press_machine : document.getElementById("fListMachine").value;
        window.open(`press_schedule.html?date=${date}&machine=${mc}`, "_blank");
      }

      /* ── 削除（パスコードはサーバー側で確かめる） ── */
      let deletingId = null;
      function openDelete(id) {
        const p = plans.find((x) => x.id === id);
        if (!p) return;
        deletingId = id;
        document.getElementById("deleteTarget").textContent =
          `${p.plan_date}  No.${p.press_machine}  ${p.die_number ?? "-"}  ${shiftLabel(p.shift_id)}  ${t("col_qty")} ${p.quantity}`;
        document.getElementById("deletePasscode").value = "";
        document.getElementById("deleteError").textContent = "";
        document.getElementById("deleteDialog").showModal();
        document.getElementById("deletePasscode").focus();
      }

      async function confirmDelete() {
        const res = await fetch("./php/press_plan/delete_plan.php", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: deletingId, passcode: document.getElementById("deletePasscode").value }),
        });
        const result = await res.json();
        if (!result.ok) {
          document.getElementById("deleteError").textContent = result.code === "passcode" ? t("err_passcode") : "error";
          document.getElementById("deletePasscode").select();
          return;
        }
        document.getElementById("deleteDialog").close();
        if (editingId === deletingId) resetForm();
        showToast(t("msg_deleted"));
        await loadPlans();
      }

      /* ── 起動 ── */
      (async () => {
        const today = new Date();
        const end = new Date(); end.setDate(end.getDate() + 10);
        document.getElementById("fStart").value = ymd(today);
        document.getElementById("fEnd").value = ymd(end);
        setLang(currentLang());
        checkForm();
        await Promise.all([loadDies(), loadPlans()]);
      })();
    </script>
  </body>
</html>
