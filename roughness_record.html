<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Roughness Record</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }

    .lang-buttons { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .lang-buttons button {
      padding: 6px 12px; margin-left: 5px; border: 1px solid #0078d4;
      background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px;
    }
    .lang-buttons button.active { background: #0078d4; color: #fff; }

    h1 { font-size: 22px; margin-bottom: 6px; border-left: 6px solid #0078d4; padding-left: 10px; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 14px; padding-left: 16px; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .btn { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-back { background: #546e7a; color: #fff; }
    .btn-main { background: #0078d4; color: #fff; }
    .btn-sub  { background: #fff; color: #0078d4; border: 1px solid #0078d4; }
    .btn-csv  { background: #217346; color: #fff; }
    .status-msg { font-size: 13px; }
    .status-msg.err { color: #c62828; font-weight: bold; }
    .status-msg.ok  { color: #2e7d32; }

    .layout { display: flex; gap: 16px; align-items: flex-start; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card-header { background: #e8f1ff; padding: 8px 12px; font-size: 13px; font-weight: bold; color: #0055a5; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-body { padding: 12px; }

    /* 左：押出の一覧 */
    .left { width: 560px; flex-shrink: 0; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .filters input { padding: 5px 8px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px; width: 150px; }
    .seg { display: inline-flex; border: 1px solid #0078d4; border-radius: 5px; overflow: hidden; }
    .seg button { padding: 5px 12px; border: none; background: #fff; color: #0078d4; font-size: 13px; font-weight: bold; cursor: pointer; }
    .seg button + button { border-left: 1px solid #0078d4; }
    .seg button.active { background: #0078d4; color: #fff; }
    .list-wrap { max-height: calc(100vh - 250px); overflow: auto; }
    .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.5; }

    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { padding: 4px 5px; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
    th { background: #e8f1ff; font-size: 11px; position: sticky; top: 0; z-index: 1; }
    td.mono { font-family: "Roboto Mono", monospace; }
    td.c { text-align: center; }
    td.r { text-align: right; }
    td.staff { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
    tbody tr.pick { cursor: pointer; }
    tbody tr.pick:hover td { background: #f0f8ff; }
    tbody tr.selected td { background: #fff3cd !important; }
    .empty { padding: 24px; text-align: center; color: #999; }

    /* 右：選んだ押出 */
    .right { flex: 1; min-width: 0; }
    .placeholder { padding: 40px; text-align: center; color: #999; }
    .press-info { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; margin-bottom: 10px; }
    .press-info b { font-family: "Roboto Mono", monospace; font-size: 14px; }
    .press-info .lbl { color: #777; font-size: 11px; margin-right: 4px; }
    .std-note { font-size: 12px; color: #8d6e00; background: #fff8e1; border-radius: 4px; padding: 4px 8px; margin-bottom: 10px; white-space: pre-wrap; }
    .warn { font-size: 12px; color: #e65100; margin-bottom: 10px; }

    .form-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 10px; }
    .form-row label { color: #555; font-size: 12px; margin-right: 4px; }
    .form-row input, .form-row select { padding: 5px 8px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px; }
    .unsaved { background: #f0a000; color: #fff; border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: bold; }

    .data-wrap { max-height: calc(100vh - 340px); overflow: auto; }
    #dataTable { width: auto; }
    #dataTable td { padding: 2px 3px; }
    #dataTable th { text-align: center; }
    #dataTable thead tr:nth-child(2) th { top: 23px; }
    #dataTable thead tr:nth-child(3) th { top: 44px; background: #fff8e1; color: #8d6e00; font-family: "Roboto Mono", monospace; }
    #dataTable th.g1 span { text-decoration: underline 3px #d32f2f; text-underline-offset: 3px; }
    #dataTable th.g2 span { text-decoration: underline dashed 3px #d32f2f; text-underline-offset: 3px; }
    #dataTable th.gl, #dataTable td.gl { border-left: 2px solid #c5d5ea; }
    #dataTable input { width: 50px; padding: 3px 4px; border: 1px solid #ccd; border-radius: 3px; font-family: "Roboto Mono", monospace; font-size: 12px; text-align: right; }
    #dataTable input.pos { width: 52px; text-align: left; font-weight: bold; }
    #dataTable input.note { width: 160px; text-align: left; font-family: "Segoe UI", sans-serif; }
    #dataTable input:focus { outline: 2px solid #0078d4; border-color: #0078d4; }
    #dataTable input.ng { background: #ffcdd2; color: #c62828; font-weight: bold; border-color: #e57373; }
    .x-btn { border: none; background: none; color: #c62828; cursor: pointer; font-size: 14px; padding: 0 4px; }
    .add-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; }
    .add-row input { width: 70px; padding: 4px 6px; border: 1px solid #aac4e8; border-radius: 4px; font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <div class="lang-buttons">
    <button id="btnJa" onclick="setLang('ja')">日本語</button>
    <button id="btnVi" onclick="setLang('vi')">Tiếng Việt</button>
  </div>

  <h1 data-key="title">📏 粗さ測定記録</h1>
  <div class="subtitle" data-key="subtitle">押出を選び、サンプル位置ごとに面1〜3の Rz と型筋を入力します。品番の基準を超えた値は赤くなります。</div>

  <div class="toolbar">
    <button class="btn btn-back" onclick="location.href='index.html'" data-key="btn_back">← 戻る</button>
    <span class="status-msg" id="statusMsg"></span>
  </div>

  <div class="layout">
    <!-- 左：押出の一覧 -->
    <div class="left card">
      <div class="card-header"><span data-key="list_title">押出の一覧</span></div>
      <div class="card-body">
        <div class="filters">
          <input type="text" id="fDie" data-ph="ph_die" placeholder="型番で検索" />
          <div class="seg" id="statusSeg">
            <button data-status="all" data-key="st_all">すべて</button>
            <button data-status="open" data-key="st_open">記録なし</button>
            <button data-status="done" data-key="st_done">記録あり</button>
          </div>
        </div>
        <div class="list-wrap">
          <table>
            <thead><tr id="listHead"></tr></thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="hint" data-key="list_hint">※ 新しい押出から350件まで表示します。「記録」は入力済みの位置の数です。</div>
      </div>
    </div>

    <!-- 右：選んだ押出 -->
    <div class="right" id="right">
      <div class="card"><div class="placeholder" data-key="placeholder">← 左の一覧から押出を選んでください</div></div>
    </div>
  </div>

  <script src="./scr/sample_position.js"></script>
  <script>
    /* =====================================================
       多言語
    ===================================================== */
    const dict = {
      ja: {
        title: "📏 粗さ測定記録",
        subtitle: "押出を選び、サンプル位置ごとに面1〜3の Rz と型筋を入力します。品番の基準を超えた値は赤くなります。",
        btn_back: "← 戻る",
        list_title: "押出の一覧",
        ph_die: "型番で検索",
        st_all: "すべて", st_open: "記録なし", st_done: "記録あり",
        list_hint: "※ 新しい押出から350件まで表示します。「記録」は入力済みの位置の数です。",
        placeholder: "← 左の一覧から押出を選んでください",
        col_date: "押出日", col_machine: "号機", col_die: "型番", col_type: "種別", col_billets: "ビレット",
        col_records: "記録", col_check: "測定日", col_staff: "担当",
        empty: "該当する押出はありません",
        info_date: "押出日", info_machine: "号機", info_die: "型番", info_pn: "品番", info_type: "種別",
        info_billets: "ビレット", info_nbn: "nBn × 穴",
        no_std: "品番に粗さの基準がありません（判定しません）",
        no_positions: "nBn・穴数・ビレット本数がそろわないため、位置を自動で作れません。下の「行を追加」で位置を入れてください。",
        lbl_check_date: "測定日", lbl_staff: "担当者", staff_none: "－－－",
        unsaved: "未保存",
        new_rows: "まだ保存していません（位置は nBn から自動で作りました）",
        col_pos: "位置", col_note: "備考",
        g1: "赤実線の面", g2: "赤点線の面", g3: "印なしの面",
        rz: "Rz", mark: "型筋", std_row: "基準",
        add_pos: "位置", btn_add_row: "＋ 行を追加",
        btn_save: "保存", btn_csv: "📥 CSV",
        btn_today: "今日",
        msg_saved: "保存しました",
        msg_discard: "保存していない変更があります。もう一度押すと変更を捨てて移動します",
        err_pos: "位置を入力してください",
        err_future: "測定日に未来の日付は入れられません",
        err_num: "測定値は数字で入力してください",
        del_row: "この行を削除（保存で確定）",
      },
      vi: {
        title: "📏 Ghi kết quả đo độ nhám",
        subtitle: "Chọn lần đùn, nhập Rz và dấu khuôn của mặt 1〜3 cho từng vị trí mẫu. Giá trị vượt tiêu chuẩn của mã SP sẽ hiện màu đỏ.",
        btn_back: "← Quay lại",
        list_title: "Danh sách lần đùn",
        ph_die: "Tìm mã khuôn",
        st_all: "Tất cả", st_open: "Chưa lưu", st_done: "Đã lưu",
        list_hint: "※ Hiển thị tối đa 350 lần đùn mới nhất. \"Dữ liệu\" là số vị trí đã nhập.",
        placeholder: "← Chọn lần đùn ở danh sách bên trái",
        col_date: "Ngày đùn", col_machine: "Máy", col_die: "Mã khuôn", col_type: "Kiểu", col_billets: "Billet",
        col_records: "Dữ liệu", col_check: "Ngày đo", col_staff: "Người đo",
        empty: "Không có lần đùn phù hợp",
        info_date: "Ngày đùn", info_machine: "Máy", info_die: "Mã khuôn", info_pn: "Mã SP", info_type: "Kiểu",
        info_billets: "Billet", info_nbn: "nBn × lỗ",
        no_std: "Mã SP chưa có tiêu chuẩn độ nhám (không đánh giá)",
        no_positions: "Thiếu nBn / số lỗ / số billet nên không tự tạo được vị trí. Hãy thêm vị trí bằng \"Thêm dòng\" bên dưới.",
        lbl_check_date: "Ngày đo", lbl_staff: "Người đo", staff_none: "－－－",
        unsaved: "Chưa lưu",
        new_rows: "Chưa lưu (vị trí được tạo tự động từ nBn)",
        col_pos: "Vị trí", col_note: "Ghi chú",
        g1: "Đánh dấu (nét liền)", g2: "Đánh dấu (nét đứt)", g3: "Không đánh dấu",
        rz: "Rz", mark: "Dấu khuôn", std_row: "Tiêu chuẩn",
        add_pos: "Vị trí", btn_add_row: "＋ Thêm dòng",
        btn_save: "Lưu", btn_csv: "📥 CSV",
        btn_today: "Hôm nay",
        msg_saved: "Đã lưu",
        msg_discard: "Có thay đổi chưa lưu. Bấm lần nữa để bỏ thay đổi và chuyển",
        err_pos: "Hãy nhập vị trí",
        err_future: "Ngày đo không được là ngày trong tương lai",
        err_num: "Giá trị đo phải là số",
        del_row: "Xóa dòng này (xác nhận khi lưu)",
      },
    };
    let currentLang = localStorage.getItem("lang") || "ja";
    const t = (k) => dict[currentLang][k];

    function setLang(lang) {
      currentLang = lang;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-key]").forEach(el => {
        const v = dict[lang][el.dataset.key];
        if (typeof v === "string") el.textContent = v;
      });
      document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = dict[lang][el.dataset.ph]);
      document.getElementById("btnJa").classList.toggle("active", lang === "ja");
      document.getElementById("btnVi").classList.toggle("active", lang === "vi");
      renderList();
      renderRight();
    }

    /* =====================================================
       共通
    ===================================================== */
    const API = "./php/roughness_record/";
    const N_VALUES = 6;      // 面1〜3 ×（Rz, 型筋）。並びは rz1, die_mark_1, rz2, die_mark_2, rz3, die_mark_3
    const NOTE_COL = N_VALUES;

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

    function showMsg(msg, isErr) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg || "";
      el.className = "status-msg " + (isErr ? "err" : "ok");
      if (msg && !isErr) setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 3000);
    }
    async function getJson(url) {
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || res.statusText);
      return data;
    }
    async function postJson(file, body) {
      const res = await fetch(API + file, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || res.statusText);
      return data;
    }

    /* =====================================================
       状態
    ===================================================== */
    const state = {
      status: "all",
      rows: null,
      pressId: null,
      press: null,
      staff: [],
      records: [],       // { id | null, position, values[6], note, orig[6]（読み込んだときの値） }
      deleteIds: [],
      checkDate: "",
      staffId: null,
      isNew: false,      // まだ1行も保存していない（位置を nBn から作った）
      dirty: false,
      discardArmedFor: null,
    };

    /* =====================================================
       左：一覧
    ===================================================== */
    let listSeq = 0;
    async function loadList() {
      const seq = ++listSeq;
      const q = new URLSearchParams({ die: document.getElementById("fDie").value.trim(), status: state.status });
      const data = await getJson(`${API}get_list.php?${q}`);
      if (seq !== listSeq) return;
      state.rows = data.rows;
      renderList();
    }

    let dieTimer = null;
    document.getElementById("fDie").addEventListener("input", () => {
      clearTimeout(dieTimer);
      dieTimer = setTimeout(() => loadList().catch(err => showMsg(err.message, true)), 300);
    });
    document.getElementById("statusSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      state.status = b.dataset.status;
      loadList().catch(err => showMsg(err.message, true));
    });
    document.getElementById("listBody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (tr) selectPress(Number(tr.dataset.id));
    });

    function renderList() {
      document.querySelectorAll("#statusSeg button").forEach(b => b.classList.toggle("active", b.dataset.status === state.status));
      document.getElementById("listHead").innerHTML =
        ["col_date", "col_machine", "col_die", "col_type", "col_billets", "col_records", "col_check", "col_staff"]
          .map(k => `<th>${t(k)}</th>`).join("");
      const body = document.getElementById("listBody");
      if (!state.rows) return;
      if (state.rows.length === 0) {
        body.innerHTML = `<tr><td colspan="8" class="empty">${t("empty")}</td></tr>`;
        return;
      }
      body.innerHTML = state.rows.map(r => `
        <tr class="pick ${r.id === state.pressId ? "selected" : ""}" data-id="${r.id}">
          <td class="mono">${esc(r.press_date.slice(2))}</td>
          <td class="c">${r.machine ?? ""}</td>
          <td class="mono">${esc(r.die_number)}</td>
          <td class="c">${esc(r.pressing_type)}</td>
          <td class="r mono">${r.billets ?? ""}</td>
          <td class="r mono">${r.records || ""}</td>
          <td class="mono">${r.check_date ? esc(r.check_date.slice(5)) : ""}</td>
          <td class="staff" title="${esc(r.staff_name)}">${esc(r.staff_name)}</td>
        </tr>`).join("");
    }

    /* =====================================================
       右：選んだ押出
    ===================================================== */
    async function selectPress(id) {
      // 保存していない変更があるときは、もう一度押したら捨てて移動する
      if (state.dirty && id !== state.pressId && state.discardArmedFor !== id) {
        state.discardArmedFor = id;
        showMsg(t("msg_discard"), true);
        return;
      }
      state.discardArmedFor = null;
      showMsg("");
      state.pressId = id;
      renderList();
      await loadDetail();
    }

    async function loadDetail() {
      try {
        const data = await getJson(`${API}get_press.php?id=${state.pressId}`);
        state.press = data.press;
        state.staff = data.staff;
        state.deleteIds = [];
        state.checkDate = data.press.check_date || "";
        state.staffId = data.press.staff_id;
        state.dirty = false;
        if (data.records.length) {
          state.records = data.records.map(r => ({ ...r, orig: [...r.values] }));
          state.isNew = false;
        } else {
          const p = data.press;
          state.records = roughnessPositions(p.nbn, p.billets, p.hole)
            .map(pos => newRecord(pos));
          state.isNew = true;
        }
        renderRight();
      } catch (err) {
        showMsg(err.message, true);
      }
    }

    const newRecord = (pos) => ({ id: null, position: pos, values: Array(N_VALUES).fill(""), note: "", orig: Array(N_VALUES).fill("") });
    const hasStd = () => state.press.std.some(v => v !== null);
    // 基準を超えたら NG（ex0.11 と同じ）
    const isNg = (ci, v) => {
      const std = state.press.std[ci];
      return std !== null && String(v).trim() !== "" && !isNaN(Number(v)) && Number(v) > std;
    };

    function renderRight() {
      const right = document.getElementById("right");
      const p = state.press;
      if (!p) {
        right.innerHTML = `<div class="card"><div class="placeholder">${t("placeholder")}</div></div>`;
        return;
      }
      const info = (k, v) => `<span><span class="lbl">${t(k)}</span><b>${esc(v ?? "－")}</b></span>`;
      const groupHead = ["g1", "g2", "g3"].map((g, i) => `<th colspan="2" class="g${i + 1} gl"><span>${t(g)}</span></th>`).join("");
      const subHead = [0, 1, 2].map(() => `<th class="gl">${t("rz")}</th><th>${t("mark")}</th>`).join("");
      const stdHead = p.std.map((v, ci) => `<th class="${ci % 2 === 0 ? "gl" : ""}">${v ?? "－"}</th>`).join("");
      const bodyRows = state.records.map((r, ri) => `
        <tr data-ri="${ri}">
          <td><input class="pos" data-ri="${ri}" data-col="pos" value="${esc(r.position)}" /></td>
          ${r.values.map((v, ci) => `<td class="${ci % 2 === 0 ? "gl" : ""}"><input data-ri="${ri}" data-col="${ci}" value="${esc(v)}" inputmode="decimal" class="${isNg(ci, v) ? "ng" : ""}" /></td>`).join("")}
          <td class="gl"><input class="note" data-ri="${ri}" data-col="${NOTE_COL}" value="${esc(r.note)}" maxlength="200" /></td>
          <td><button class="x-btn" data-del="${ri}" title="${t("del_row")}">×</button></td>
        </tr>`).join("");
      const staffOpts = [`<option value="">${t("staff_none")}</option>`]
        .concat(state.staff.map(s => `<option value="${s.id}" ${s.id === state.staffId ? "selected" : ""}>${esc(s.name)}</option>`)).join("");

      right.innerHTML = `
        <div class="card">
          <div class="card-header">
            <span>${esc(p.die_number)}　${esc(p.press_date)}</span>
            <span id="dirtyBadge">${state.dirty ? `<span class="unsaved">${t("unsaved")}</span>` : ""}</span>
          </div>
          <div class="card-body">
            <div class="press-info">
              ${info("info_date", p.press_date)}${info("info_machine", p.machine)}${info("info_die", p.die_number)}
              ${info("info_pn", p.production_number)}${info("info_type", p.pressing_type)}${info("info_billets", p.billets)}
              ${info("info_nbn", p.nbn ? `${p.nbn} × ${p.hole ?? "?"}` : null)}
            </div>
            ${hasStd() ? "" : `<div class="warn">${t("no_std")}</div>`}
            ${p.std_note ? `<div class="std-note">${esc(p.std_note)}</div>` : ""}
            ${state.isNew && state.records.length ? `<div class="warn">${t("new_rows")}</div>` : ""}
            ${state.records.length === 0 ? `<div class="warn">${t("no_positions")}</div>` : ""}

            <div class="form-row">
              <span><label>${t("lbl_check_date")}</label><input type="date" id="fCheckDate" value="${esc(state.checkDate)}" max="${today()}" />
                <button class="btn btn-sub" id="btnToday" style="padding:4px 8px">${t("btn_today")}</button></span>
              <span><label>${t("lbl_staff")}</label><select id="fStaff">${staffOpts}</select></span>
            </div>

            <div class="data-wrap">
              <table id="dataTable">
                <thead>
                  <tr><th rowspan="2">${t("col_pos")}</th>${groupHead}<th rowspan="2" class="gl">${t("col_note")}</th><th rowspan="2"></th></tr>
                  <tr>${subHead}</tr>
                  <tr><th>${t("std_row")}</th>${stdHead}<th class="gl"></th><th></th></tr>
                </thead>
                <tbody>${bodyRows}</tbody>
              </table>
            </div>
            <div class="add-row">
              <label>${t("add_pos")}</label><input id="fNewPos" maxlength="11" />
              <button class="btn btn-sub" id="btnAddRow">${t("btn_add_row")}</button>
            </div>

            <div class="actions">
              <button class="btn btn-main" id="btnSave">${t("btn_save")}</button>
              <button class="btn btn-csv" id="btnCsv">${t("btn_csv")}</button>
            </div>
          </div>
        </div>`;
    }

    function markDirty() {
      state.dirty = true;
      const b = document.getElementById("dirtyBadge");
      if (b) b.innerHTML = `<span class="unsaved">${t("unsaved")}</span>`;
    }

    // 入力：値を state に入れ、そのセルの色だけ更新する（表を作り直すとフォーカスが外れるため）
    document.getElementById("right").addEventListener("input", (e) => {
      const el = e.target;
      if (el.id === "fCheckDate") { state.checkDate = el.value; markDirty(); return; }
      if (el.dataset.ri === undefined) return;
      const r = state.records[Number(el.dataset.ri)];
      if (el.dataset.col === "pos") r.position = el.value;
      else if (Number(el.dataset.col) === NOTE_COL) r.note = el.value;
      else {
        const ci = Number(el.dataset.col);
        r.values[ci] = el.value;
        el.classList.toggle("ng", isNg(ci, el.value));
      }
      markDirty();
    });
    document.getElementById("right").addEventListener("change", (e) => {
      if (e.target.id === "fStaff") { state.staffId = e.target.value ? Number(e.target.value) : null; markDirty(); }
    });

    document.getElementById("right").addEventListener("click", (e) => {
      const el = e.target;
      if (el.id === "btnSave") return save();
      if (el.id === "btnCsv") return downloadCsv();
      if (el.id === "btnToday") { state.checkDate = today(); markDirty(); return renderRight(); }
      if (el.id === "btnAddRow") {
        const pos = document.getElementById("fNewPos").value.trim();
        if (!pos) return showMsg(t("err_pos"), true);
        state.records.push(newRecord(pos));
        markDirty();
        renderRight();
        const input = document.querySelector(`#dataTable input[data-ri="${state.records.length - 1}"][data-col="0"]`);
        if (input) input.focus();
        return;
      }
      if (el.dataset.del !== undefined) {
        const r = state.records.splice(Number(el.dataset.del), 1)[0];
        if (r.id) state.deleteIds.push(r.id);
        markDirty();
        renderRight();
      }
    });

    // 矢印キーで上下左右のセルへ、Enter で右のセル（備考なら次の行の最初の値へ）
    document.getElementById("right").addEventListener("keydown", (e) => {
      const el = e.target;
      if (el.tagName !== "INPUT" || el.dataset.ri === undefined) return;
      const ri = Number(el.dataset.ri);
      const ci = el.dataset.col === "pos" ? -1 : Number(el.dataset.col);
      let to = null;
      if (e.key === "ArrowUp") to = [ri - 1, ci];
      else if (e.key === "ArrowDown") to = [ri + 1, ci];
      else if (e.key === "ArrowLeft" && el.selectionStart === 0) to = [ri, ci - 1];
      else if (e.key === "ArrowRight" && el.selectionEnd === el.value.length) to = [ri, ci + 1];
      else if (e.key === "Enter") to = ci >= NOTE_COL ? [ri + 1, 0] : [ri, ci + 1];
      if (!to) return;
      const [r, c] = to;
      const target = document.querySelector(`#dataTable input[data-ri="${r}"][data-col="${c < 0 ? "pos" : c}"]`);
      if (target) { e.preventDefault(); target.focus(); target.select(); }
    });

    async function save() {
      if (state.checkDate && state.checkDate > today()) return showMsg(t("err_future"), true);
      for (const r of state.records) {
        if (!r.position.trim()) return showMsg(t("err_pos"), true);
        // 数字かどうかは、変えた値だけ確かめる（ex0.11 の古い記録には "2.0,2.5" のような値があるため）
        if (r.values.some((v, ci) => v !== r.orig[ci] && v.trim() !== "" && isNaN(Number(v)))) return showMsg(`${t("err_num")}（${r.position}）`, true);
      }
      const btn = document.getElementById("btnSave");
      btn.disabled = true;
      try {
        await postJson("save.php", {
          press_id: state.pressId,
          rows: state.records.map(r => ({ id: r.id, position: r.position.trim(), values: r.values.map(v => v.trim()), note: r.note.trim() })),
          delete_ids: state.deleteIds,
          check_date: state.checkDate || null,
          staff_id: state.staffId,
        });
        showMsg(t("msg_saved"));
        await loadDetail();
        loadList().catch(() => {});
      } catch (err) {
        showMsg(err.message, true);
        btn.disabled = false;
      }
    }

    function downloadCsv() {
      const p = state.press;
      const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const head = [t("col_pos"), ...[1, 2, 3].flatMap(i => [`${t("rz")}${i}`, `${t("mark")}${i}`]), t("col_note")];
      const lines = [head.map(q).join(",")].concat(state.records.map(r =>
        [r.position, ...r.values, r.note].map(q).join(",")));
      const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${p.press_date.slice(2)}-${p.die_number}-roughness.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // 保存していない変更があるときは、タブを閉じる・再読み込み・「戻る」の前にブラウザの確認を出す
    window.addEventListener("beforeunload", (e) => {
      if (!state.dirty) return;
      e.preventDefault();
      e.returnValue = "";
    });

    setLang(currentLang);
    loadList().catch(err => showMsg(err.message, true));
  </script>
</body>
</html>
