<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Staff Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        padding: 20px;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
        background: #fff;
        border-radius: 10px;
        padding: 24px 28px 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .top-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .back-btn {
        background: #2b6ca3;
        color: #fff;
        padding: 8px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
      }

      h1 {
        font-size: 20px;
        border-left: 6px solid #0078d4;
        padding-left: 10px;
      }

      /* Form */
      .form-grid {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 12px 14px;
        align-items: center;
        font-size: 13px;
      }
      .form-grid label { color: #555; font-weight: bold; }
      .form-grid label .req { color: #c62828; margin-left: 2px; }
      .form-grid input, .form-grid select {
        padding: 7px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        width: 260px;
      }
      .form-grid input.emp { font-family: "Roboto Mono", monospace; }
      .form-grid .hint { grid-column: 2; font-size: 11px; color: #888; margin-top: -8px; }
      .form-grid input.ng { border-color: #c62828; background: #fff5f5; }
      .form-grid input.ok, .form-grid select.ok { border-color: #2e7d32; }

      .actions { margin-top: 22px; display: flex; gap: 10px; align-items: center; }
      .save-btn {
        padding: 9px 26px;
        background: #1565c0;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
      }
      .save-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .clear-btn {
        padding: 9px 16px;
        background: #fff;
        color: #555;
        border: 1px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
      }
      .msg { font-size: 13px; }
      .msg.err { color: #c62828; font-weight: bold; }
      .msg.ok  { color: #2e7d32; font-weight: bold; }

      .note {
        margin-top: 18px;
        font-size: 12px;
        color: #777;
        line-height: 1.7;
        background: #f7f9ff;
        border-radius: 6px;
        padding: 10px 12px;
      }

      /* 登録した人 */
      .done-title { margin-top: 24px; font-size: 14px; font-weight: bold; color: #2b6ca3; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { padding: 7px 10px; border-bottom: 1px solid #e8e8e8; font-size: 13px; text-align: left; }
      th { background: #e8f1ff; }
      td.emp-num { font-family: "Roboto Mono", monospace; }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="top-bar">
        <button class="back-btn" onclick="location.href='staff_settings.html'">← スタッフ設定へ戻る</button>
        <h1>新規社員の登録</h1>
      </div>

      <div class="form-grid">
        <label for="fNum">社員番号<span class="req">*</span></label>
        <input type="text" id="fNum" class="emp" inputmode="numeric" maxlength="7" autocomplete="off" />
        <div class="hint">数字7桁。もう登録されている番号は登録できません</div>

        <label for="fName">氏名<span class="req">*</span></label>
        <input type="text" id="fName" maxlength="40" autocomplete="off" />

        <label for="fPos">区分<span class="req">*</span></label>
        <select id="fPos">
          <option value="">— 選んでください —</option>
          <option value="1">Staff</option>
          <option value="2">Worker</option>
        </select>

        <label for="fJoin">入社日<span class="req">*</span></label>
        <input type="date" id="fJoin" />

        <label for="fRole">ロール</label>
        <select id="fRole"></select>
        <div class="hint">あとからスタッフ設定でも変えられます</div>
      </div>

      <div class="actions">
        <button class="save-btn" id="btnSave" disabled>登録</button>
        <button class="clear-btn" id="btnClear">クリア</button>
        <span class="msg" id="msg"></span>
      </div>

      <div class="note">
        ※ ex0.11 の社員登録（StaffAndCode2）と同じ項目です。退職日は、登録のあとで設定します。<br />
        ※ パスワードは空のまま登録します（スタッフ設定の「PW リセット」で、社員番号がパスワードになります）。
      </div>

      <div id="doneArea" style="display:none">
        <div class="done-title">この画面で登録した人</div>
        <table>
          <thead><tr><th>社員番号</th><th>氏名</th><th>区分</th><th>入社日</th><th>ロール</th></tr></thead>
          <tbody id="doneBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      // スタッフ設定（staff_settings.html）と同じロールの一覧
      const ROLES = [
        { value: "",            label: "— 未設定 —" },
        { value: "admin",       label: "admin（全権限）" },
        { value: "operator",    label: "operator（押出）" },
        { value: "inspector",   label: "inspector（測定・診断）" },
        { value: "maintenance", label: "maintenance（修理）" },
        { value: "die_setup",   label: "die_setup（金型段取り）" },
        { value: "die_engineer", label: "die_engineer（金型エンジニア）" },
      ];
      const POSITIONS = { 1: "Staff", 2: "Worker" };

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

      $("fRole").innerHTML = ROLES.map((r) => `<option value="${r.value}">${r.label}</option>`).join("");

      let existing = new Set();   // 登録済みの社員番号（入力中に重なりを知らせる）
      const done = [];

      function showMsg(text, ok) {
        $("msg").textContent = text || "";
        $("msg").className = "msg " + (ok ? "ok" : "err");
      }

      // 入力の確かめ：全部そろったら「登録」を押せるようにする
      function check() {
        const num = $("fNum").value.trim();
        const numOk = /^\d{7}$/.test(num) && !existing.has(String(Number(num)));
        $("fNum").classList.toggle("ng", num !== "" && !numOk);
        $("fNum").classList.toggle("ok", numOk);
        if (num !== "" && /^\d+$/.test(num) && existing.has(String(Number(num)))) showMsg(`社員番号 ${num} はもう登録されています`, false);
        else if ($("msg").classList.contains("err")) showMsg("");
        const nameOk = $("fName").value.trim().length >= 2;
        $("fName").classList.toggle("ok", nameOk);
        const posOk = $("fPos").value !== "";
        $("fPos").classList.toggle("ok", posOk);
        const joinOk = /^\d{4}-\d{2}-\d{2}$/.test($("fJoin").value);
        $("fJoin").classList.toggle("ok", joinOk);
        $("btnSave").disabled = !(numOk && nameOk && posOk && joinOk);
      }
      ["fNum", "fName", "fPos", "fJoin", "fRole"].forEach((id) => {
        $(id).addEventListener("input", check);
        $(id).addEventListener("change", check);
      });

      function clearForm() {
        $("fNum").value = "";
        $("fName").value = "";
        $("fPos").value = "";
        $("fJoin").value = today();
        $("fRole").value = "";
        check();
        $("fNum").focus();
      }
      $("btnClear").addEventListener("click", () => { showMsg(""); clearForm(); });

      $("btnSave").addEventListener("click", async () => {
        const body = {
          emploee_number: $("fNum").value.trim(),
          staff_name: $("fName").value.trim(),
          position_id: Number($("fPos").value),
          joining_date: $("fJoin").value,
          role: $("fRole").value,
        };
        $("btnSave").disabled = true;
        try {
          const res = await fetch("./php/staff/insert_staff.php", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          const result = await res.json();
          if (result.status !== "ok") throw new Error(result.message || "登録に失敗しました");
          existing.add(String(Number(body.emploee_number)));
          done.unshift(body);
          $("doneArea").style.display = "block";
          $("doneBody").innerHTML = done.map((r) => `<tr>
            <td class="emp-num">${esc(r.emploee_number)}</td><td>${esc(r.staff_name)}</td><td>${POSITIONS[r.position_id]}</td>
            <td class="emp-num">${esc(r.joining_date)}</td><td>${esc(r.role || "—")}</td></tr>`).join("");
          showMsg(`${body.staff_name} さんを登録しました`, true);
          clearForm();
        } catch (e) {
          showMsg(e.message, false);
          check();
        }
      });

      // 登録済みの社員番号を読んでおく
      fetch("./php/staff/get_staff_list.php")
        .then((r) => r.json())
        .then((data) => { existing = new Set(data.map((r) => String(r.emploee_number))); check(); })
        .catch(() => showMsg("社員の一覧を読めませんでした", false));

      clearForm();
    </script>
  </body>
</html>
