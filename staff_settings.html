<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Staff Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: #fff;
        border-radius: 10px;
        padding: 24px 28px 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .top-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .back-btn {
        background: #2b6ca3;
        color: #fff;
        padding: 8px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        white-space: nowrap;
      }

      h1 {
        font-size: 20px;
        border-left: 6px solid #0078d4;
        padding-left: 10px;
      }

      /* Filter bar */
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        font-size: 13px;
      }
      .filter-bar label { color: #555; }
      .filter-bar select, .filter-bar input {
        padding: 5px 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 13px;
      }
      .filter-bar input { width: 200px; }

      /* 表だけを縦にスクロールさせ、画面（1920×1080）の中に収める。見出しの行は上に止まる */
      .table-wrap {
        max-height: calc(100vh - 200px);
        overflow-y: auto;
        border: 1px solid #e8e8e8;
        border-radius: 6px;
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 10px 12px;
        border-bottom: 1px solid #e8e8e8;
        font-size: 13px;
        text-align: left;
      }
      th {
        background: #e8f1ff;
        font-weight: bold;
        color: #333;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      th, .badge, .reset-btn, .save-role-btn { white-space: nowrap; }
      tr:hover { background: #f7f9ff; }
      tr.inactive { opacity: 0.45; }

      td.upd { color: #777; font-size: 12px; white-space: nowrap; }
      /* 編集できる欄 */
      .cell-input {
        padding: 5px 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 13px;
      }
      .cell-input.num { width: 90px; font-family: "Roboto Mono", monospace; }
      .cell-input.name { width: 200px; }
      .cell-input.leave { width: 130px; }
      .status-cell { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
      .status-select { padding: 5px 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; }
      tr.dirty td { background: #fffbe6; }
      .save-role-btn:disabled { opacity: 0.35; cursor: default; }
      /* 並べ替えできる見出し */
      th.sortable { cursor: pointer; user-select: none; }
      th.sortable:hover { color: #0078d4; }
      th.sortable .arrow { color: #0078d4; margin-left: 3px; }
      .emp-num {
        font-family: "Roboto Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.03em;
      }

      /* Role select */
      .role-select {
        padding: 5px 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 12px;
        width: 160px;
      }

      /* Badges */
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: bold;
        color: #fff;
      }
      .pw-set   { background: #2e7d32; }
      .pw-unset { background: #c62828; }
      .active   { background: #1565c0; }
      .inactive-badge { background: #9e9e9e; }

      /* Buttons */
      .reset-btn {
        padding: 5px 12px;
        background: #e65100;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .reset-btn:hover { background: #bf360c; }

      .save-role-btn {
        padding: 5px 12px;
        background: #1565c0;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .save-role-btn:hover { background: #0d47a1; }

      /* Toast */
      #toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: #323232;
        color: #fff;
        padding: 10px 24px;
        border-radius: 6px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 999;
      }
      #toast.show { opacity: 1; }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="top-bar">
        <button class="back-btn" onclick="location.href='index.html'">← メニューへ戻る</button>
        <h1>スタッフ設定</h1>
        <button class="back-btn" style="margin-left:auto;background:#2e7d32" onclick="location.href='staff_register.html'">＋ 新規社員の登録</button>
      </div>

      <div class="filter-bar">
        <label>表示：</label>
        <select id="filterSelect" onchange="applyFilter()">
          <option value="active">在籍中のみ</option>
          <option value="all">全員</option>
        </select>
        <label for="nameFilter">名前：</label>
        <input type="search" id="nameFilter" placeholder="名前・社員番号で絞り込み" oninput="applyFilter()" />
        <span id="countLabel" style="color:#888;"></span>
      </div>

      <div class="table-wrap">
      <table id="staffTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="emp">社員番号<span class="arrow"></span></th>
            <th class="sortable" data-sort="name">氏名<span class="arrow"></span></th>
            <th>ロール</th>
            <th>在籍状況</th>
            <th>保存</th>
            <th>PW状態</th>
            <th>PW リセット</th>
            <th class="sortable" data-sort="upd">更新日<span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      const ROLES = [
        { value: "",            label: "— 未設定 —" },
        { value: "admin",       label: "admin（全権限）" },
        { value: "operator",    label: "operator（押出）" },
        { value: "inspector",   label: "inspector（測定・診断）" },
        { value: "maintenance", label: "maintenance（修理）" },
        { value: "die_setup",   label: "die_setup（金型段取り）" },
        { value: "die_engineer", label: "die_engineer（金型エンジニア）" },
      ];

      let allData = [];
      // 並べ替え：見出しを押すたびに 昇順 → 降順。何も選んでいなければ、在籍中を先に社員番号の順（サーバーの順）
      let sortKey = null, sortDir = 1;
      const SORTERS = {
        emp:  (r) => Number(r.emploee_number ?? 0),
        name: (r) => fold(r.staff_name),
        upd:  (r) => r.updated_sort ?? "",
      };
      document.querySelector("#staffTable thead").addEventListener("click", (e) => {
        const th = e.target.closest("th.sortable");
        if (!th) return;
        if (sortKey === th.dataset.sort) sortDir = -sortDir;
        else { sortKey = th.dataset.sort; sortDir = th.dataset.sort === "upd" ? -1 : 1; }   // 更新日は新しい順から
        applyFilter();
      });

      function showToast(msg, ok = true) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.style.background = ok ? "#323232" : "#c62828";
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      const fold = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

      function applyFilter() {
        const mode  = document.getElementById("filterSelect").value;
        const tbody = document.querySelector("#staffTable tbody");
        tbody.innerHTML = "";

        // 名前の絞り込みは、大文字・小文字とベトナム語の声調記号を区別しない（"thuy" で "Thủy" も出る）。社員番号でも探せる
        const q = fold(document.getElementById("nameFilter").value.trim());
        const filtered = (mode === "all" ? allData : allData.filter((r) => !r.leave_at))
          .filter((r) => !q || fold(r.staff_name).includes(q) || String(r.emploee_number ?? "").includes(q));

        if (sortKey) {
          const f = SORTERS[sortKey];
          filtered.sort((a, b) => (f(a) > f(b) ? 1 : f(a) < f(b) ? -1 : 0) * sortDir);
        }
        document.querySelectorAll("th.sortable").forEach((th) => {
          th.querySelector(".arrow").textContent = th.dataset.sort === sortKey ? (sortDir > 0 ? "▲" : "▼") : "";
        });

        document.getElementById("countLabel").textContent =
          `${filtered.length} 名`;

        filtered.forEach((row) => renderRow(row, tbody));
      }

      function renderRow(row, tbody) {
        const isActive = !row.leave_at;
        const tr = document.createElement("tr");
        if (!isActive) tr.classList.add("inactive");
        tr.dataset.id           = row.id;
        tr.dataset.empNum       = row.emploee_number ?? "";

        /* Role select options */
        const options = ROLES.map((r) =>
          `<option value="${r.value}" ${row.role === r.value ? "selected" : ""}>${r.label}</option>`
        ).join("");

        /* PW badge */
        const pwBadge = Number(row.has_password)
          ? `<span class="badge pw-set">設定済</span>`
          : `<span class="badge pw-unset">未設定</span>`;

        tr.innerHTML = `
          <td><input class="cell-input num" data-f="emploee_number" value="${esc(row.emploee_number)}" inputmode="numeric" maxlength="9" /></td>
          <td><input class="cell-input name" data-f="staff_name" value="${esc(row.staff_name)}" maxlength="40" /></td>
          <td>
            <select class="role-select" data-f="role">
              ${options}
            </select>
          </td>
          <td>
            <div class="status-cell">
              <select class="status-select" data-f="status">
                <option value="active" ${isActive ? "selected" : ""}>在籍</option>
                <option value="left" ${isActive ? "" : "selected"}>退職</option>
              </select>
              <input type="date" class="cell-input leave" data-f="leave_at" value="${esc(row.leave_at)}" title="退職日" style="${isActive ? "display:none" : ""}" />
            </div>
          </td>
          <td>
            <button class="save-role-btn" onclick="saveStaff(this)" disabled>保存</button>
          </td>
          <td class="pw-cell">${pwBadge}</td>
          <td>
            <button class="reset-btn" onclick="resetPassword(this)">リセット</button>
          </td>
          <td class="emp-num upd">${row.updated_at ?? "—"}</td>
        `;

        tbody.appendChild(tr);
      }

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

      // 行の今の入力の値
      function rowValues(tr) {
        const v = (f) => tr.querySelector(`[data-f="${f}"]`).value.trim();
        const left = v("status") === "left";
        return { emploee_number: v("emploee_number"), staff_name: v("staff_name"), role: v("role") || null, leave_at: left ? (v("leave_at") || null) : null, left };
      }

      // 編集：変えた行は黄色にして「保存」を押せるようにする。退職を選ぶと退職日の欄を出す（最初は今日）
      document.querySelector("#staffTable tbody").addEventListener("input", onEdit);
      document.querySelector("#staffTable tbody").addEventListener("change", onEdit);
      function onEdit(e) {
        const tr = e.target.closest("tr");
        if (!tr || !e.target.dataset.f) return;
        if (e.target.dataset.f === "status") {
          const leave = tr.querySelector('[data-f="leave_at"]');
          leave.style.display = e.target.value === "left" ? "" : "none";
          if (e.target.value === "left" && !leave.value) leave.value = todayStr();
        }
        const row = allData.find((r) => String(r.id) === tr.dataset.id);
        const now = rowValues(tr);
        const dirty = now.emploee_number !== String(row.emploee_number ?? "") || now.staff_name !== (row.staff_name ?? "")
          || (now.role ?? "") !== (row.role ?? "") || (now.leave_at ?? "") !== (row.leave_at ?? "");
        tr.classList.toggle("dirty", dirty);
        tr.querySelector(".save-role-btn").disabled = !dirty;
      }

      async function saveStaff(btn) {
        const tr  = btn.closest("tr");
        const now = rowValues(tr);
        if (!/^\d{1,9}$/.test(now.emploee_number)) return showToast("社員番号は数字で入れてください", false);
        if (now.staff_name.length < 2) return showToast("氏名を入れてください", false);
        if (now.left && !now.leave_at) return showToast("退職日を入れてください", false);
        btn.disabled = true;
        const res    = await fetch("./php/staff/update_staff.php", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ action: "update_staff", id: tr.dataset.id, ...now }),
        });
        const result = await res.json();
        if (result.status === "ok") {
          showToast(`${now.staff_name} を保存しました`);
          reloadList();   // 更新日時を出し直す（在籍中のみの表示で退職にした人は消える）
        } else {
          showToast(result.message || "保存に失敗しました", false);
          btn.disabled = false;
        }
      }

      async function resetPassword(btn) {
        const tr     = btn.closest("tr");
        const id     = tr.dataset.id;
        const empNum = tr.dataset.empNum;
        if (tr.classList.contains("dirty")) return showToast("先に「保存」してください（社員番号を変えているかもしれないため）", false);

        if (!confirm(`社員番号「${empNum}」をパスワードにリセットします。よろしいですか？`)) return;

        const res    = await fetch("./php/staff/update_staff.php", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            action:          "reset_password",
            id,
            emploee_number:  empNum,
          }),
        });
        const result = await res.json();

        if (result.status === "ok") {
          showToast("パスワードをリセットしました（初期値：社員番号）");
          /* update badge */
          tr.querySelector(".pw-cell").innerHTML =
            `<span class="badge pw-set">設定済</span>`;
          /* sync allData */
          const entry = allData.find((r) => String(r.id) === String(id));
          if (entry) entry.has_password = "1";
          reloadList();   // 更新日時を出し直す
        } else {
          showToast("リセットに失敗しました", false);
        }
      }

      /* Load（保存のあとも呼んで、更新日時を出し直す。絞り込みとスクロールの位置はそのまま） */
      function reloadList() {
        const wrap = document.querySelector(".table-wrap");
        const top = wrap.scrollTop;
        return fetch("./php/staff/get_staff_list.php")
          .then((r) => r.json())
          .then((data) => {
            allData = data;
            applyFilter();
            wrap.scrollTop = top;
          })
          .catch(() => showToast("データ取得に失敗しました", false));
      }
      reloadList();
    </script>
  </body>
</html>
